<style>
html,body{margin:0;height:100%;background:#f5f8f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
html,body{overflow:hidden}iframe{display:block;width:100%;height:100vh;height:100dvh;border:0;background:#fff}
</style>
</head>
<body>
<iframe id="app" src="./core.html?field=v12&rev=202611082322-v1534444-status"></iframe>
<script>
const frame=document.getElementById('app');
const v11711BaseSrc=frame.getAttribute('src');
let v11711BootRetry=0,v11711LastRetry=0;
setInterval(()=>{
  try{
    const cd=frame.contentDocument,txt=(cd?.body?.innerText||'');
    if(/主程序未能从腾讯云\s*COS\s*加载|资源[：:]\s*主程序未加载/.test(txt) && v11711BootRetry<2 && Date.now()-v11711LastRetry>2500){
      v11711BootRetry++;v11711LastRetry=Date.now();
      const sep=v11711BaseSrc.includes('?')?'&':'?';
      frame.src=v11711BaseSrc+sep+'bootretry='+v11711BootRetry+'&t='+Date.now();
    }
  }catch{}
},1800);
frame.addEventListener('load',async()=>{
  let d; try{d=frame.contentDocument}catch(e){return}
  if(!d||d.body.dataset.fieldDone)return;
  d.body.dataset.fieldDone='1';

  // v1.16: OCR.space mode is priority cloud mode with Paddle fallback.
  const relabelOcrMode=()=>{
    const sel=d.getElementById('ocrMode');
    if(!sel)return;
    [...sel.options].forEach(opt=>{
      if(opt.value==='space'||/仅\s*OCR\.space\s*云端/i.test(opt.textContent||'')){
        opt.textContent='优先 OCR.space（失败自动切换 Paddle）';
      }
    });
  };
  relabelOcrMode();

  const finalCandidateUi=()=>{
    const deptLabel=d.querySelector('label[for="dept"]');
    if(deptLabel) deptLabel.textContent='科室';
    const pasteLabel=d.querySelector('label[for="pasteOcrText"]');
    if(pasteLabel) pasteLabel.remove();
    const ta=d.getElementById('pasteOcrText');
    if(ta&&!ta.dataset.autoGrow11716){
      ta.dataset.autoGrow11716='1';
      ta.rows=1;
      const grow=()=>{ta.style.height='38px';if(ta.value)ta.style.height=Math.min(160,Math.max(38,ta.scrollHeight))+'px';ta.style.overflowY=ta.scrollHeight>160?'auto':'hidden'};
      ta.addEventListener('input',grow);grow();
    }
    const createBtn=d.getElementById('pasteOcrBtn');
    if(createBtn) createBtn.textContent='新建';
  };
  finalCandidateUi();
  setTimeout(finalCandidateUi,500);
  setTimeout(finalCandidateUi,1500);

  // v1.18 test.2 final iframe-side UI fixes.
  const V118_SHORT_FOOTER='照片和记录保存在当前浏览器；删除只删除本机记录，不删除飞书云端数据。已确认数据会自动同步飞书，建议按需定期下载Excel留档。';
  const applyV118InnerFinal=()=>{
    // Footer/version are rendered inside core.html, so modify the iframe document directly.
    try{
      const walker=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT);
      let n;
      while((n=walker.nextNode())){
        const t=n.nodeValue||'';
        if(t.includes('OCR 与智能分类均需人工复核')||t.includes('照片缩略图和审核记录保存在当前浏览器')){
          n.nodeValue=V118_SHORT_FOOTER;
          continue;
        }
        if(/v1\.18-test\.1|v1\.18 test\.1/.test(t)){
          n.nodeValue=t.replace(/v1\.18-test\.1/g,'v1.18-test.2').replace(/v1\.18 test\.1/g,'v1.18 test.2');
        }
      }
    }catch{}

    if(!d.getElementById('v118InnerFinalStyle')){
      const x=d.createElement('style');
      x.id='v118InnerFinalStyle';
      x.textContent=`
      @media(max-width:700px){
        .wrap{padding-bottom:58px!important}
        .mobile-dock{
          display:grid!important;
          grid-template-columns:repeat(5,minmax(0,1fr))!important;
          position:fixed!important;
          left:0!important;right:0!important;bottom:0!important;top:auto!important;
          width:100%!important;
          min-height:48px!important;height:50px!important;
          margin:0!important;
          padding:1px 3px max(1px,env(safe-area-inset-bottom,0px))!important;
          box-sizing:border-box!important;
          transform:none!important;
          overflow:visible!important;
          z-index:90000!important;
        }
        .mobile-dock .dock-btn{
          min-width:0!important;
          height:48px!important;min-height:48px!important;
          margin:0!important;padding:2px 1px!important;
          display:flex!important;flex-direction:column!important;
          align-items:center!important;justify-content:center!important;
          overflow:visible!important;
          line-height:1.05!important;
        }
        .mobile-dock .dock-camera-ring{
          position:relative!important;top:-12px!important;width:54px!important;height:54px!important;margin:0 auto -14px!important;
        }
      }`;
      (d.head||d.documentElement).appendChild(x);
    }
  };
  applyV118InnerFinal();
  [300,800,1600,3200,6000].forEach(ms=>setTimeout(applyV118InnerFinal,ms));


  const v118NormalizeDialogs=()=>{
    const allButtons=[...d.querySelectorAll('button,.btn')];

    const nearestOverlay=(el)=>{
      let n=el;
      while(n&&n!==d.body){
        const cs=getComputedStyle(n);
        if(cs.position==='fixed')return n;
        n=n.parentElement;
      }
      return el?.closest?.('[role="dialog"]')||null;
    };

    const setCancelStyle=(b)=>{
      if(!b)return;
      b.style.setProperty('background','#fff1f1','important');
      b.style.setProperty('color','#a33','important');
      b.style.setProperty('border','1px solid #efb5b5','important');
      b.style.setProperty('border-radius','10px','important');
      b.style.setProperty('font-weight','700','important');
    };

    // 1) Thumbnail viewer: 关闭｜重拍照 / Paddle重识别｜OCR.space重识别.
    const paddle=allButtons.find(b=>(b.textContent||'').trim()==='Paddle重识别');
    const cloud=allButtons.find(b=>(b.textContent||'').trim()==='OCR.space重识别');
    if(paddle&&cloud){
      const overlay=nearestOverlay(paddle)||nearestOverlay(cloud);
      if(overlay){
        const obs=[...overlay.querySelectorAll('button,.btn')];
        const rephoto=obs.find(b=>(b.textContent||'').trim()==='重拍照');
        const close=obs.find(b=>(b.textContent||'').trim()==='关闭');
        if(rephoto&&close){
          const row=paddle.parentElement;
          if(row&&[close,rephoto,paddle,cloud].every(b=>b.parentElement===row)){
            row.style.setProperty('display','grid','important');
            row.style.setProperty('grid-template-columns','repeat(2,minmax(0,1fr))','important');
            row.style.setProperty('grid-template-rows','auto auto','important');
            row.style.setProperty('gap','8px','important');
            row.style.setProperty('align-items','stretch','important');
            // Explicit order regardless of original DOM order.
            close.style.setProperty('grid-column','1','important'); close.style.setProperty('grid-row','1','important');
            rephoto.style.setProperty('grid-column','2','important'); rephoto.style.setProperty('grid-row','1','important');
            paddle.style.setProperty('grid-column','1','important'); paddle.style.setProperty('grid-row','2','important');
            cloud.style.setProperty('grid-column','2','important'); cloud.style.setProperty('grid-row','2','important');
            [close,rephoto,paddle,cloud].forEach(b=>{
              b.style.setProperty('width','100%','important');
              b.style.setProperty('min-width','0','important');
              b.style.setProperty('white-space','nowrap','important');
              b.style.setProperty('min-height','42px','important');
              b.style.setProperty('padding','7px 6px','important');
              b.style.setProperty('font-size','14px','important');
            });
            setCancelStyle(close);
          }
        }
      }
    }

    // 2/3) Crop dialogs: compact enough to fit one phone screen.
    // Identify by visible text/title and by rotate controls + confirm/cancel/re-recognize actions.
    const fixed=[...d.querySelectorAll('body *')].filter(el=>{
      const cs=getComputedStyle(el);
      if(cs.position!=='fixed'||cs.display==='none'||cs.visibility==='hidden')return false;
      const r=el.getBoundingClientRect();
      return r.width>innerWidth*.72&&r.height>innerHeight*.55;
    });
    for(const modal of fixed){
      const txt=(modal.textContent||'');
      const cropLike=txt.includes('裁剪铭牌识别区域') || (txt.includes('左转90°')&&txt.includes('右转90°'));
      if(!cropLike)continue;

      const panel=[...modal.children].find(x=>{
        const r=x.getBoundingClientRect(); return r.width>innerWidth*.65&&r.height>innerHeight*.45;
      })||modal.firstElementChild||modal;
      panel.style.setProperty('max-height','calc(100dvh - 18px)','important');
      panel.style.setProperty('overflow-y','auto','important');
      panel.style.setProperty('padding-top','12px','important');
      panel.style.setProperty('padding-bottom','10px','important');

      // Compress oversized visual/control blocks without changing OCR image itself.
      [...modal.querySelectorAll('button,.btn')].forEach(b=>{
        b.style.setProperty('min-height','40px','important');
        b.style.setProperty('padding-top','6px','important');
        b.style.setProperty('padding-bottom','6px','important');
        b.style.setProperty('line-height','1.15','important');
      });
      [...modal.querySelectorAll('img,canvas')].forEach(el=>{
        const r=el.getBoundingClientRect();
        if(r.height>innerHeight*.48) el.style.setProperty('max-height','48dvh','important');
      });

      const mbtn=[...modal.querySelectorAll('button,.btn')];
      const confirm=mbtn.find(b=>(b.textContent||'').trim()==='确认');
      let cancel=mbtn.find(b=>(b.textContent||'').trim()==='取消');
      const p=mbtn.find(b=>(b.textContent||'').trim()==='Paddle重识别');
      const c=mbtn.find(b=>(b.textContent||'').trim()==='OCR.space重识别');
      const close=mbtn.find(b=>(b.textContent||'').trim()==='关闭');

      // Re-recognition crop: rename Close -> Cancel.
      if((p||c)&&close&&!cancel){
        close.textContent='取消';
        cancel=close;
      }
      if(cancel)setCancelStyle(cancel);

      // Photo / re-photo crop: Confirm + Cancel centered and equal width.
      if(confirm&&cancel&&confirm.parentElement===cancel.parentElement){
        const row=confirm.parentElement;
        row.style.setProperty('display','grid','important');
        row.style.setProperty('grid-template-columns','repeat(2,minmax(0,1fr))','important');
        row.style.setProperty('gap','10px','important');
        row.style.setProperty('align-items','stretch','important');
        [confirm,cancel].forEach(b=>{
          b.style.setProperty('width','100%','important');
          b.style.setProperty('min-width','0','important');
          b.style.setProperty('min-height','40px','important');
          b.style.setProperty('padding','6px 8px','important');
        });
      }

      // Re-recognition crop: keep Paddle / OCR / Cancel on one compact row if they share a row.
      if(p&&c&&cancel&&p.parentElement===c.parentElement&&p.parentElement===cancel.parentElement){
        const row=p.parentElement;
        row.style.setProperty('display','grid','important');
        row.style.setProperty('grid-template-columns','minmax(0,1fr) minmax(0,1.12fr) minmax(68px,.72fr)','important');
        row.style.setProperty('gap','6px','important');
        [p,c,cancel].forEach(b=>{
          b.style.setProperty('width','100%','important');
          b.style.setProperty('min-width','0','important');
          b.style.setProperty('white-space','nowrap','important');
          b.style.setProperty('font-size','13px','important');
          b.style.setProperty('min-height','40px','important');
          b.style.setProperty('padding','6px 4px','important');
        });
      }
    }

    // Other Close buttons elsewhere: same light-red visual treatment.
    for(const b of allButtons){
      if((b.textContent||'').trim()==='关闭')setCancelStyle(b);
    }
  };
  v118NormalizeDialogs();
  try{
    const v118DialogMo=new MutationObserver(()=>requestAnimationFrame(v118NormalizeDialogs));
    v118DialogMo.observe(d.body,{subtree:true,childList:true,attributes:true,attributeFilter:['style','class','open']});
  }catch{}
  d.addEventListener('click',()=>setTimeout(v118NormalizeDialogs,0),true);

  const v118ModalDockGuard=()=>{
    const dock=d.querySelector('.mobile-dock');
    if(!dock)return;
    const vw=Math.max(d.documentElement.clientWidth||0,innerWidth||0), vh=Math.max(d.documentElement.clientHeight||0,innerHeight||0);
    let modalOpen=false;
    for(const el of [...d.body.children]){
      if(el===dock || el.closest?.('.mobile-dock'))continue;
      const cs=getComputedStyle(el);
      if(cs.display==='none'||cs.visibility==='hidden'||Number(cs.opacity||1)===0)continue;
      if(cs.position!=='fixed')continue;
      const r=el.getBoundingClientRect();
      const covers=(r.width>=vw*.72 && r.height>=vh*.55);
      const dialogLike=el.id==='fieldStatsModalV1171'||el.getAttribute('role')==='dialog'||/modal|dialog|overlay|crop/i.test(el.className||'')||/modal|dialog|overlay|crop/i.test(el.id||'');
      if(covers||dialogLike){modalOpen=true;break;}
    }
    dock.style.setProperty('display',modalOpen?'none':'grid','important');
  };
  v118ModalDockGuard();
  try{
    const v118DockMo=new MutationObserver(()=>requestAnimationFrame(v118ModalDockGuard));
    v118DockMo.observe(d.body,{subtree:true,childList:true,attributes:true,attributeFilter:['style','class','hidden','open']});
  }catch{}
  d.addEventListener('click',()=>setTimeout(v118ModalDockGuard,0),true);
  d.addEventListener('transitionend',v118ModalDockGuard,true);

  try{
    const v118InnerMo=new MutationObserver(()=>applyV118InnerFinal());
    v118InnerMo.observe(d.body,{subtree:true,childList:true,characterData:true});
  }catch{}

  const st=d.createElement('style');
  st.textContent=`
  body{background:#f4f8f6!important;color:#17201c!important}
  .brand-header{background:#00695c!important;color:#fff!important;border-bottom:0!important;padding:10px 12px!important;box-shadow:none!important}
  .brand-inner{max-width:1040px!important;margin:auto!important;display:flex!important;align-items:center!important;gap:8px!important}
  .brand-mark,.brand-divider{display:none!important}
  .brand-inner:before{content:'▣';font-size:18px;color:#fff;margin-right:3px}
  .brand-inner h1{font-size:inherit!important;line-height:1.2!important;color:#fff!important;margin:0!important}
  .field-settings-btn{margin-left:auto!important;background:transparent!important;color:#fff!important;border:1px solid rgba(255,255,255,.38)!important;border-radius:7px!important;padding:6px 9px!important;min-height:34px!important;font:inherit!important;font-weight:600!important}
  .field-settings-panel{max-width:1040px!important;margin:6px auto 0!important;background:#fff!important;border:1px solid #dfe7e2!important;border-radius:10px!important;padding:8px!important}
  .wrap{max-width:1040px!important;padding:7px 6px 72px!important}
  .panel{background:#fff!important;border:1px solid #dfe7e2!important;border-radius:11px!important;box-shadow:none!important}
  #fieldWork,#fieldStats,#fieldRecords{margin:0 0 7px!important;padding:8px!important}

  /* 工作信息：保留稳定版字号，只压缩间距 */
  #fieldWork>.row:first-of-type{display:grid!important;grid-template-columns:1.35fr 1fr .82fr .78fr;gap:6px!important}
  #fieldWork>.row:first-of-type .field{min-width:0!important}
  #fieldWork label{margin-bottom:3px!important}
  #fieldWork input,#fieldWork select{height:38px!important;padding:7px 9px!important;border-radius:7px!important;background:#fbfcfb!important;border-color:#dce4df!important}
  #fieldWork .primary-actions{display:grid!important;grid-template-columns:1.1fr 1fr .9fr;gap:6px!important;margin:6px 0 0!important}
  #fieldWork .primary-actions .btn{min-width:0!important;min-height:38px!important;border-radius:7px!important;padding:7px 9px!important;box-shadow:none!important}
  #fieldWork #cameraBtn{background:#00a88f!important;color:#fff!important;border-color:#00a88f!important;font-weight:700!important}
  #fieldWork #galleryBtn{background:#e6f6f2!important;color:#126453!important;border-color:#d5ece5!important}
  #fieldWork #pasteQuickBtn{background:#f2f5f4!important;color:#3f5049!important;border-color:#e3e9e6!important}
  #quickPastePanel label[for="pasteOcrText"]{display:none!important}

  /* 两行状态栏：字号沿用稳定版 */
  #fieldStats{padding:7px 8px!important}
  #fieldStats .toolbar-row{display:none!important}
  #fieldStats .topstat{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px!important;margin:0!important}
  #fieldStats .pill,#fieldStats .retry-failed-all{
    min-height:26px!important;padding:2px 5px!important;border-radius:7px!important;
    display:flex!important;align-items:center!important;justify-content:center!important;
    line-height:1.05!important;text-align:center!important;
    background:#f2f4f3!important;color:#8a938e!important;border:1px solid #e6ebe8!important;box-shadow:none!important
  }
  #fieldStats .pill.field-has-data.field-pending,
  #fieldStats .pill.field-has-data.field-sync{background:#fff4d8!important;color:#8d620c!important;border-color:#efdca9!important}
  #fieldStats .pill.field-has-data.field-confirmed,
  #fieldStats .pill.field-has-data.field-selected,
  #fieldStats .field-total.field-has-data{background:#e6f6ef!important;color:#126a4b!important;border-color:#cce8da!important}
  #fieldStats .pill.field-has-data.field-failed,
  #fieldStats .retry-failed-all.field-has-data{background:#fdeceb!important;color:#a6322d!important;border-color:#ecc7c4!important}
  #fieldStats .field-queue.field-has-data{background:#edf1ef!important;color:#4f5d56!important;border-color:#dce3df!important}
  #fieldStats .field-active{outline:2px solid currentColor!important;outline-offset:-1px!important;font-weight:700!important}
  #fieldStats .field-pending.field-active,#fieldStats .field-sync.field-active{background:#f1d27b!important}
  #fieldStats .field-confirmed.field-active,#fieldStats .field-selected.field-active,#fieldStats .field-total.field-active{background:#b8e4cf!important}
  #fieldStats .field-failed.field-active,#fieldStats .retry-failed-all.field-active{background:#ebb0ab!important}

  /* 常用批量操作常驻 */
  .field-bulk{display:block!important;margin:5px 0 4px!important}
  .field-bulk .bulkbar{display:flex!important;flex-wrap:wrap!important;gap:5px!important;margin:0!important}
  .field-bulk .btn{min-height:34px!important;padding:6px 9px!important;border-radius:7px!important}

  /* 设备记录标题 + 下载数据 */
  #fieldRecords{padding:8px!important}
  .field-head{display:flex;align-items:center;gap:7px;margin-bottom:6px}
  .field-head h2{margin:0;white-space:nowrap}
  .field-head .field-network{display:flex;align-items:center}
  .field-head #networkPill{margin:0!important;white-space:nowrap!important}
  .field-head .toolbar-download{margin-left:auto!important}
  .field-head .toolbar-download .btn{background:#00a88f!important;color:#fff!important;border-color:#00a88f!important;border-radius:8px!important;min-height:36px!important;padding:7px 12px!important;font-weight:700!important}
  .field-tools{display:grid!important;grid-template-columns:auto 132px auto minmax(0,1fr);gap:6px!important;align-items:center!important;padding:5px!important;background:#f7faf8!important;border:1px solid #e5ebe7!important;border-radius:8px!important;margin:0 0 5px!important}

  #fieldRecords .pages{margin:4px 0!important}

  #fieldRecords,#recordList,#fieldRecords #recordList .card{overflow-anchor:none!important}
  #fieldRecords #recordList .card{border:1px solid #e3e9e6!important;border-radius:9px!important;padding:7px!important;margin:5px 0!important;box-shadow:none!important}
  #fieldRecords #recordList .thumb{border-radius:7px!important}
  #fieldRecords #recordList input,#fieldRecords #recordList textarea,#fieldRecords #recordList select{background:#fbfcfb!important;border-color:#dfe6e2!important;border-radius:7px!important}
  #fieldRecords #recordList .controls .btn{border-radius:7px!important}
  #fieldRecords .badge{border-radius:999px!important}

  /* 底部快捷栏：仅手机显示 */
  .mobile-dock{display:none!important;background:#00695c!important;color:#fff!important;border-top:0!important;box-shadow:0 -4px 16px rgba(0,70,60,.16)!important}

  .dock-home{background:#00a88f!important;color:#fff!important}

  .dock-btn span,.dock-btn div{color:inherit!important}

  @media(max-width:700px){
    .mobile-dock{display:grid!important}
    .wrap{padding:5px 4px 66px!important}
    .brand-header{padding:8px 9px!important}
    #fieldWork,#fieldStats,#fieldRecords{padding:6px!important;margin-bottom:5px!important}
    #fieldWork>.row:first-of-type{grid-template-columns:1fr 1fr!important;gap:5px!important}
    #fieldWork input,#fieldWork select{height:36px!important;padding:6px 7px!important}
    #fieldWork .primary-actions{gap:5px!important;margin-top:5px!important}
    #fieldWork .primary-actions .btn{min-height:36px!important;padding:6px 6px!important}
    #progress{padding:6px 7px!important;margin-top:4px!important}
    #fieldStats .topstat{grid-template-columns:repeat(4,1fr)!important;gap:3px!important}
    #fieldStats .pill,#fieldStats .retry-failed-all{min-height:25px!important;padding:2px 3px!important}
    .field-bulk .bulkbar{display:grid!important;grid-template-columns:repeat(5,1fr)!important;gap:4px!important}
    .field-bulk .btn{min-width:0!important;padding:5px 3px!important}
    .field-head{margin-bottom:4px!important}

  if(progressEl){syncProgressVisibility();new MutationObserver(syncProgressVisibility).observe(progressEl,{childList:true,subtree:true,characterData:true});}
  const cardsObserver=new MutationObserver(()=>decorateCards());
  const list=d.getElementById('recordList');if(list)cardsObserver.observe(list,{childList:true,subtree:true});
  decorateCards();
  // v1.18-test.2 test: compact field UI + inline statistics
  async function openFieldStats(){
    d.getElementById('fieldStatsModalV1171')?.remove();
    const rows=(await allRecords()).filter(r=>r&&r.name);
    const modal=d.createElement('div');modal.id='fieldStatsModalV1171';modal.style.cssText='position:fixed;inset:0;z-index:100005;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;justify-content:center;padding:12px;box-sizing:border-box';
    let mode='dept';
    const esc=v=>String(v??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
    const render=()=>{
      const map=new Map();
      rows.forEach(r=>{
        const unit=r.unitName||r.batch||'',dept=r.dept||'',name=r.name||'';if(!name)return;
        const k=mode==='dept'?[unit,dept,name].join('\u0001'):[unit,name].join('\u0001');
        map.set(k,(map.get(k)||0)+1);
      });
      const data=[...map.entries()].map(([k,n])=>[...k.split('\u0001'),n]).sort((x,y)=>x.map(String).join('\u0001').localeCompare(y.map(String).join('\u0001')));
      const headers=mode==='dept'?['单位名称','科室','设备名称','数量']:['单位名称','设备名称','数量'];
      modal.querySelector('[data-stats-body]').innerHTML='<div style="position:sticky;top:0;background:#fff;padding-bottom:9px;z-index:2"><div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap"><b style="font-size:18px;margin-right:2px">数据统计</b><button class="btn '+(mode==='dept'?'primary':'secondary')+'" style="padding:7px 11px;width:auto;min-width:0" data-mode="dept">按科室</button><button class="btn '+(mode==='name'?'primary':'secondary')+'" style="padding:7px 11px;width:auto;min-width:0" data-mode="name">按设备名称</button><button style="margin-left:auto;border:1px solid #efb5b5;background:#fff1f1;color:#a33;border-radius:10px;padding:8px 15px;font-weight:700" data-close-stats>关闭</button></div></div><table style="width:100%;border-collapse:collapse;font-size:14px"><thead><tr>'+headers.map(h=>'<th style="padding:7px 4px;text-align:left">'+h+'</th>').join('')+'</tr></thead><tbody>'+data.map(r=>'<tr>'+r.map((v,i)=>'<td style="padding:7px 4px;border-top:1px solid #e5ebe7;'+(i===r.length-1?'text-align:center;font-weight:700':'')+'">'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
      modal.querySelectorAll('[data-mode]').forEach(btn=>btn.onclick=()=>{mode=btn.dataset.mode;render()});
      modal.querySelector('[data-close-stats]').onclick=()=>modal.remove();
    };
    modal.innerHTML='<div data-stats-body style="background:#fff;width:min(920px,100%);max-height:82vh;overflow:auto;border-radius:14px;padding:14px"></div>';
    d.body.appendChild(modal);render();modal.onclick=e=>{if(e.target===modal)modal.remove()};
  }
  const dl=d.getElementById('csvTopBtn');
  d.getElementById('fieldStatsBtnV1171')?.remove();
  if(dl&&!d.getElementById('fieldStatsBtnV11714')){
    const topStat=d.createElement('button');topStat.id='fieldStatsBtnV11714';topStat.className=dl.className;topStat.textContent='数据统计';topStat.style.marginRight='6px';topStat.onclick=openFieldStats;dl.parentNode?.insertBefore(topStat,dl);
  }

  // Search box may only change from a real user input in the search field.
  const searchGuard=d.getElementById('searchBox')||[...d.querySelectorAll('input')].find(inp=>/名称\s*\/\s*厂家\s*\/\s*型号\s*\/\s*编号/.test(inp.placeholder||''));
  if(searchGuard){
    searchGuard.setAttribute('autocomplete','off');searchGuard.setAttribute('autocapitalize','off');searchGuard.setAttribute('name','mingpai-record-search-v11714');
    let trustedSearch=searchGuard.value||'';
    searchGuard.addEventListener('input',e=>{if(e.isTrusted)trustedSearch=searchGuard.value},true);
    setInterval(()=>{if(searchGuard.value!==trustedSearch)searchGuard.value=trustedSearch},350);
  }

  const installDockStats=()=>{
    const dock=d.querySelector('.mobile-dock');if(!dock)return;
    const items=[...dock.children];
    const find=t=>items.find(x=>(x.textContent||'').includes(t));
    const home=find('首页'),add=find('新增记录'),camera=find('拍照'),download=find('下载数据');
    let stat=d.getElementById('dockStatsV11714');
    if(!stat){stat=d.createElement('button');stat.id='dockStatsV11714';stat.className='dock-btn';stat.innerHTML='<div class="dock-icon">▦</div><span>数据统计</span>';stat.onclick=openFieldStats;}
    dock.style.gridTemplateColumns='repeat(5,1fr)';
    [home,add,camera,stat,download].filter(Boolean).forEach(x=>dock.appendChild(x));
  };
  setTimeout(installDockStats,250);setTimeout(installDockStats,1000);
  // v1.18: tiny online version manifest check. Large COS files are only prefetched when version changes.
  // v1.18 test.2: top metadata inputs use Done/Confirm instead of Next.
  const v118TopDone=()=>{
    ['unitName','dept','operatorName'].forEach(id=>{
      const el=d.getElementById(id); if(!el) return;
      el.setAttribute('enterkeyhint','done');
      el.enterKeyHint='done';
      if(!el.dataset.v118Done){
        el.dataset.v118Done='1';
        el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();el.blur();}});
      }
    });
  };
  v118TopDone();setTimeout(v118TopDone,400);setTimeout(v118TopDone,1200);
  const compactDiagnostics=()=>{
    const box=d.getElementById('adaptiveOcrStatusV117');
    if(box&&!box.dataset.collapsedV1171){box.dataset.collapsedV1171='1';const det=d.createElement('details');det.innerHTML='<summary style="cursor:pointer;font-weight:700">识别诊断（需要时点击展开）</summary>';box.parentNode.insertBefore(det,box);det.appendChild(box);box.style.marginTop='7px';}
    d.querySelectorAll('p,.hint,small').forEach(el=>{const t=(el.textContent||'').trim();if(t.includes('OCR 与智能分类均需人工复核')||t.includes('请人工复核型号和编号'))el.textContent='照片和记录保存在当前浏览器；删除只删除本机记录，不删除飞书云端数据。已确认数据会自动同步飞书，建议按需定期下载Excel留档。';else if(t.includes('版本： v1.16')||t.includes('版本：v1.16'))el.textContent=t.replace(/v1\.16/g,'v1.17');});
  };
  setTimeout(compactDiagnostics,800);setTimeout(compactDiagnostics,1800);


  function numFrom(el){
    const m=(el?.textContent||'').match(/\d+/g);
    if(!m)return 0;
    return Math.max(...m.map(Number));
  }
  function paint(){
    const queueLabel=d.getElementById('queuePill');
    if(queueLabel){
      const cleaned=(queueLabel.textContent||'').replace(/^队列\s*[：:]\s*/,'');
      if(cleaned!==queueLabel.textContent) queueLabel.textContent=cleaned;
    }
    const statusEls=[allEl,okEl,pendingEl,syncEl,selectedEl,queueEl,failedEl].filter(Boolean);
    statusEls.forEach(el=>{
      const n=numFrom(el);
      el.classList.toggle('field-has-data',n>0);
      el.classList.toggle('field-zero',n===0);
      el.classList.toggle('field-active',el.classList.contains('filter-active'));
    });
    const failed=d.getElementById('queueFailedPill');
    const fn=numFrom(failed);
    if(retry){
      retry.classList.toggle('field-has-data',fn>0);
      retry.classList.toggle('field-zero',fn===0);
      retry.classList.toggle('field-active',retry.classList.contains('filter-active'));
    }
  }
  paint();
  new MutationObserver(paint).observe(d.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['class']});
});
</script>

<script id="v118-upgrade-probe">
(()=> {
  const MANIFEST='./version-v118-test.json';
  const CACHE='mingpai-runtime-long-v1';
  function mount(){
    const frame=document.getElementById('app');
    let td;
    try{td=frame?.contentDocument}catch{}
    if(!td||!td.body)return null;
    let box=td.getElementById('v118StandaloneUpgradeStatus');
    if(box) return box;
    box=td.createElement('div');
    box.id='v118StandaloneUpgradeStatus';
    box.textContent='版本检查：正在检查在线版本…';
    box.style.cssText='margin:6px 0;padding:8px 10px;border-radius:8px;background:#fff8df;color:#765a00;border:1px solid #ecd98a;font-size:14px;line-height:1.4;box-sizing:border-box';
    const target=td.getElementById('fieldRuntimeStatus')||td.getElementById('progress')||td.getElementById('queueStatus');
    if(target?.parentNode) target.parentNode.insertBefore(box,target.nextSibling);
    else (td.querySelector('.wrap')||td.body).prepend(box);
    return box;
  }
  function say(msg,kind='ok'){
    let box=mount();
    if(!box){setTimeout(()=>say(msg,kind),300);return;}
    box.textContent=msg;
    if(kind==='error'){
      box.style.background='#fff1f0'; box.style.color='#a33a32'; box.style.borderColor='#efc3bd';
    }else if(kind==='work'){
      box.style.background='#fff8df'; box.style.color='#765a00'; box.style.borderColor='#ecd98a';
    }else{
      box.style.background='#eefaf5'; box.style.color='#176b56'; box.style.borderColor='#cfeadf';
    }
  }
  async function has(rel){
    try{
      const c=await caches.open(CACHE);
      const key=new Request(new URL('./runtime/'+rel,location.href),{method:'GET'});
      return !!(await c.match(key));
    }catch{return false}
  }
  async function prefetch(sw,ver,files){
    return new Promise((resolve,reject)=>{
      const ch=new MessageChannel();
      const timer=setTimeout(()=>reject(new Error('后台缓存等待超时')),90000);
      ch.port1.onmessage=e=>{
        const x=e.data||{};
        if(x.type==='PREFETCH_VERSION_DONE'&&String(x.version||'')===ver){
          clearTimeout(timer);
          x.ok?resolve(x):reject(new Error(x.error||'后台缓存失败'));
        }
      };
      sw.postMessage({type:'PREFETCH_VERSION',version:ver,runtimeFiles:files},[ch.port2]);
    });
  }
  async function run(){
    mount();
    if(!navigator.onLine){say('版本检查：当前离线，继续使用本地缓存版本。','work');return;}
    if(!('serviceWorker' in navigator)){say('版本检查：当前浏览器不支持 Service Worker。','error');return;}
    try{
      // Explicitly register the v1.18 worker so this probe does not depend on earlier page scripts.
      const reg=await navigator.serviceWorker.register('./coi-serviceworker.js',{scope:'./'});
      await navigator.serviceWorker.ready;
      const r=await fetch(MANIFEST+'?probe='+Date.now(),{cache:'no-store'});
      if(!r.ok) throw new Error('版本清单请求失败 '+r.status);
      const m=await r.json();
      const ver=String(m.version||'').trim();
      const files=Array.isArray(m.runtimeFiles)?m.runtimeFiles:[m.mainJs].filter(Boolean);
      const main=String(m.mainJs||files[0]||'');
      if(!ver||!main) throw new Error('版本清单内容不完整');
      if(await has(main)){
        localStorage.setItem('mingpai-v118-manifest-version',ver);
        say('在线版本检查正常：'+ver+' 已在本地缓存。');
        setTimeout(()=>{const b=mount(); if(b) b.style.display='none';},3000);
        return;
      }
      say('检测到新版本 '+ver+'，正在后台缓存主程序…','work');
      const sw=reg.active||reg.waiting||reg.installing||navigator.serviceWorker.controller;
      if(!sw) throw new Error('Service Worker 尚未就绪');
      await prefetch(sw,ver,files);
      if(!(await has(main))) throw new Error('后台任务完成，但未找到新主程序缓存');
      localStorage.setItem('mingpai-v118-manifest-version',ver);
      say('新版本 '+ver+' 已后台缓存完成；当前页面已是 test.2。');
      setTimeout(()=>{const b=mount(); if(b) b.style.display='none';},3000);
    }catch(err){
      say('版本检查失败：'+(err?.message||String(err)),'error');
      console.error('v1.18 standalone upgrade probe',err);
    }
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',()=>setTimeout(run,300));
  else setTimeout(run,300);
})();
</script>
