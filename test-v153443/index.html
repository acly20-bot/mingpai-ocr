<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>v1.153.4.4.3 独立测试入口</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#f4f8f6;color:#25443d}.boot{max-width:560px;margin:18vh auto;padding:22px;text-align:center}.boot strong{display:block;font-size:18px;margin-bottom:8px}.boot span{font-size:13px;color:#667b75}</style>
</head>
<body>
<div class="boot"><strong>正在加载 v1.153.4.4.3 测试版…</strong><span>正式入口不会被修改</span></div>
<script>
(async()=>{
  try{
    let html=await (await fetch('../index.html?testsource='+Date.now(),{cache:'no-store'})).text();
    html=html.replaceAll('index-B81hyAdU-v153441.js?v=1.153.4.4.1','index-B81hyAdU-v153443-test.js?v=1.153.4.4.3-test');
    html=html.replaceAll('mingpai-stable15344-coi-reload','mingpai-v153443-test-coi-reload');
    html=html.replaceAll('版本：v1.153.4.4.1','版本：v1.153.4.4.3-test');
    html=html.replaceAll('},15000);','},35000);');
    const old=`    try{await attach(MAIN,false);return;}catch(e){console.warn('同源 runtime 加载失败，改用 COS 直连兜底',e)}
    try{await attach(MAIN_DIRECT,true);return;}catch(e){
      const p=document.getElementById('networkPill'),s=document.getElementById('progress');
      if(p){p.textContent='资源：主程序未加载';p.className='pill mini-net netbad'}
      if(s)s.textContent='主程序未能加载。请检查腾讯云 COS 的 v1.153.4.4.1 主程序文件是否已上传，或稍后刷新重试。';
    }`;
    const neo=`    const sources=[[MAIN,false],[MAIN_DIRECT,true]];
    let lastError=null;
    for(let round=0;round<3;round++){
      if(round>0) await new Promise(r=>setTimeout(r,round===1?1200:2500));
      for(const [base,isDirect] of sources){
        const sep=base.includes('?')?'&':'?';
        const src=round===0?base:(base+sep+'loadRetry='+round+'&t='+Date.now());
        try{await attach(src,isDirect);return true;}catch(e){lastError=e;console.warn('主程序加载失败，自动重试',round+1,isDirect?'COS直连':'runtime代理',e)}
      }
    }
    const p=document.getElementById('networkPill'),s=document.getElementById('progress');
    if(p){p.textContent='资源：主程序未加载';p.className='pill mini-net netbad'}
    if(s)s.textContent='主程序自动重试后仍未能从腾讯云 COS 加载，请检查网络后再刷新。';
    console.error('主程序最终加载失败',lastError);
    return false;`;
    if(html.includes(old)) html=html.replace(old,neo);
    document.open();document.write(html);document.close();
  }catch(e){
    document.body.innerHTML='<div class="boot"><strong>测试入口加载失败</strong><span>'+String(e&&e.message||e)+'</span></div>';
  }
})();
</script>
</body>
</html>
