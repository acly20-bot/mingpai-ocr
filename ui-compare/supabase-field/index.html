<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Supabase Field · 现场版</title>
<style>
html,body{margin:0;height:100%;background:#f5f8f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.top{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;background:#fff;border-bottom:1px solid #e5ebe7;color:#718079;font-size:10px}
.top strong{color:#1b3026}.top a{color:#16845a;text-decoration:none;font-weight:700}
iframe{display:block;width:100%;height:calc(100% - 31px);border:0;background:#fff}
</style>
</head>
<body>
<div class="top"><strong>Supabase Field · 现场版</strong><span>基线 v1.153.4.4.1</span><a href="../">返回对比</a></div>
<iframe id="app" src="../../index.html?field=1"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  let d; try{d=frame.contentDocument}catch(e){return}
  if(!d||d.body.dataset.fieldDone)return;
  d.body.dataset.fieldDone='1';

  const st=d.createElement('style');
  st.textContent=`
  body{background:#f5f8f6!important;color:#17201c!important}
  .brand-header{background:#fff!important;color:#17201c!important;border-bottom:1px solid #e3e9e5!important;padding:7px 10px!important;box-shadow:none!important}
  .brand-inner{max-width:1040px!important;margin:auto!important}
  .brand-mark,.brand-divider{display:none!important}
  .brand-inner:before{content:'▣';font-size:16px;color:#23b47e;margin-right:7px}
  .brand-inner h1{font-size:16px!important;line-height:1.15!important}
  .wrap{max-width:1040px!important;padding:7px 6px 72px!important}
  .panel{background:#fff!important;border:1px solid #e2e8e4!important;border-radius:11px!important;box-shadow:none!important}
  #fieldWork,#fieldStats,#fieldRecords{margin:0 0 7px!important;padding:8px!important}

  /* 工作信息：紧凑 */
  #fieldWork>.row:first-of-type{display:grid!important;grid-template-columns:1.35fr 1fr .82fr .78fr;gap:5px!important}
  #fieldWork>.row:first-of-type .field{min-width:0!important}
  #fieldWork label{font-size:10px!important;color:#69766f!important;margin-bottom:3px!important}
  #fieldWork input,#fieldWork select{height:34px!important;padding:6px 8px!important;border-radius:7px!important;background:#fbfcfb!important;border-color:#dce4df!important;font-size:12px!important}
  #fieldWork .primary-actions{display:grid!important;grid-template-columns:1.1fr 1fr .9fr;gap:5px!important;margin:6px 0 0!important}
  #fieldWork .primary-actions .btn{min-width:0!important;min-height:36px!important;border-radius:7px!important;padding:6px 8px!important;font-size:12px!important;box-shadow:none!important}
  #fieldWork #cameraBtn{background:#10a77b!important;color:#fff!important;border-color:#10a77b!important;font-weight:700!important}
  #fieldWork #galleryBtn{background:#eaf8f3!important;color:#16664b!important;border-color:#d8eee5!important}
  #fieldWork #pasteQuickBtn{background:#f4f6f5!important;color:#44524b!important;border-color:#e4e9e6!important}
  #progress{margin-top:5px!important;padding:6px 8px!important;min-height:0!important;border-radius:7px!important;font-size:10.5px!important;line-height:1.4!important;background:#eef9f4!important;border:1px solid #dcefe6!important;color:#356853!important}

  /* 状态区：尽可能紧凑 */
  #fieldStats{padding:7px 8px!important}
  #fieldStats .toolbar-row{display:none!important}
  #fieldStats .topstat{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px!important;margin:0!important}
  #fieldStats .pill,#fieldStats .retry-failed-all{
    min-height:28px!important;padding:4px 5px!important;border-radius:7px!important;
    display:flex!important;align-items:center!important;justify-content:center!important;
    font-size:9.5px!important;line-height:1.15!important;text-align:center!important;
    background:#f4f6f5!important;color:#87908b!important;border:1px solid #eaeeec!important;box-shadow:none!important
  }
  #fieldStats .pill.field-has-data.field-pending{background:#fff5dc!important;color:#90640b!important;border-color:#f2ddb0!important}
  #fieldStats .pill.field-has-data.field-confirmed,
  #fieldStats .pill.field-has-data.field-selected{background:#e9f8f1!important;color:#176b4d!important;border-color:#cfeadd!important}
  #fieldStats .pill.field-has-data.field-sync{background:#fff6df!important;color:#8b6416!important;border-color:#f0dfb7!important}
  #fieldStats .pill.field-has-data.field-failed,
  #fieldStats .retry-failed-all.field-has-data{background:#fff0ef!important;color:#a73832!important;border-color:#f0cbc8!important}
  #fieldStats .field-active{outline:1.5px solid currentColor!important;outline-offset:0!important;font-weight:700!important}
  #fieldStats .pill.field-has-data.field-pending.field-active{background:#f5d982!important}
  #fieldStats .pill.field-has-data.field-sync.field-active{background:#f4dc91!important}
  #fieldStats .pill.field-has-data.field-confirmed.field-active,
  #fieldStats .pill.field-has-data.field-selected.field-active{background:#bfe8d4!important}
  #fieldStats .pill.field-has-data.field-failed.field-active,
  #fieldStats .retry-failed-all.field-has-data.field-active{background:#efb6b1!important}
  #fieldStats .field-total.field-has-data{background:#e9f8f1!important;color:#176b4d!important;border-color:#cfeadd!important}
  #fieldStats .field-queue.field-has-data{background:#eef1f0!important;color:#4e5d56!important;border-color:#dde3df!important}

  /* 设备记录区 */
  #fieldRecords{padding:8px!important}
  .field-head{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-bottom:5px}
  .field-head h2{font-size:15px;margin:0;letter-spacing:-.1px}
  .field-head small{font-size:9px;color:#8a948f}
  .field-tools{display:grid!important;grid-template-columns:auto minmax(0,1fr) auto;gap:5px!important;align-items:end!important;padding:5px!important;background:#f8faf9!important;border:1px solid #e8ece9!important;border-radius:8px!important;margin:0 0 5px!important}
  .field-tools .field{min-width:0!important}
  .field-tools .field:first-child{width:118px!important}
  .field-tools label{font-size:9px!important;color:#738079!important;margin-bottom:2px!important}
  .field-tools input,.field-tools select{height:31px!important;padding:5px 7px!important;border-radius:7px!important;font-size:11px!important;background:#fff!important;border-color:#dce3df!important}
  .field-tools #filterStatus{width:118px!important}
  .field-tools .toolbar-download{display:block!important}
  .field-tools .toolbar-download .btn,#csvTopBtn{height:31px!important;min-height:31px!important;border-radius:7px!important;padding:5px 9px!important;background:#10a77b!important;color:#fff!important;border-color:#10a77b!important;font-size:11px!important;font-weight:700!important}
  .field-bulk{margin:2px 0 4px;padding-top:2px}
  .field-bulk summary{font-size:9.5px;color:#78847e;cursor:pointer;width:max-content}
  .field-bulk .bulkbar{margin-top:5px!important}
  #fieldRecords .pages{margin:4px 0!important}
  #fieldRecords .pages .btn{min-height:30px!important;padding:4px 9px!important;border-radius:7px!important;background:#f6f7f7!important;color:#67736d!important;border-color:#e5e9e7!important}
  #fieldRecords #recordList .card{border:1px solid #e5eae7!important;border-radius:9px!important;padding:7px!important;margin:5px 0!important;box-shadow:none!important}
  #fieldRecords #recordList .thumb{width:52px!important;height:52px!important;border-radius:7px!important}
  #fieldRecords #recordList input,#fieldRecords #recordList textarea,#fieldRecords #recordList select{background:#fbfcfb!important;border-color:#dfe6e2!important;border-radius:7px!important}
  #fieldRecords #recordList .controls .btn{border-radius:7px!important;min-height:33px!important}
  #fieldRecords .badge{border-radius:999px!important}

  .mobile-dock{background:rgba(255,255,255,.985)!important;color:#536159!important;border-top:1px solid #e0e6e2!important;box-shadow:0 -4px 16px rgba(27,52,42,.06)!important}
  .dock-btn{color:#5f6d66!important}
  .dock-home{background:#eaf7f1!important;color:#176c4c!important}
  .dock-camera-ring{background:#10a77b!important;box-shadow:0 4px 12px rgba(16,167,123,.22)!important}

  @media(max-width:700px){
    .wrap{padding:5px 4px 66px!important}
    .brand-header{padding:6px 8px!important}
    .brand-inner h1{font-size:15px!important}
    #fieldWork,#fieldStats,#fieldRecords{padding:6px!important;margin-bottom:5px!important}
    #fieldWork>.row:first-of-type{grid-template-columns:1.1fr .9fr!important;gap:4px!important}
    #fieldWork>.row:first-of-type .field{min-width:0!important}
    #fieldWork label{font-size:9.5px!important}
    #fieldWork input,#fieldWork select{height:30px!important;font-size:11px!important;padding:4px 6px!important}
    #fieldWork .primary-actions{gap:4px!important;margin-top:5px!important}
    #fieldWork .primary-actions .btn{min-height:32px!important;font-size:10.5px!important;padding:5px 5px!important}
    #progress{font-size:9.5px!important;padding:5px 6px!important;margin-top:4px!important}
    #fieldStats .topstat{grid-template-columns:repeat(4,1fr)!important;gap:3px!important}
    #fieldStats .pill,#fieldStats .retry-failed-all{min-height:25px!important;font-size:8.6px!important;padding:3px 2px!important}
    .field-head{margin-bottom:4px}
    .field-head h2{font-size:14px}
    .field-head small{font-size:8.5px}
    .field-tools{grid-template-columns:105px minmax(0,1fr) 74px!important;gap:4px!important;padding:4px!important}
    .field-tools .field:first-child,.field-tools #filterStatus{width:105px!important}
    .field-tools label{font-size:8.5px!important}
    .field-tools input,.field-tools select{height:29px!important;font-size:10.5px!important;padding:4px 5px!important}
    .field-tools .toolbar-download .btn,#csvTopBtn{height:29px!important;min-height:29px!important;font-size:10px!important;padding:4px 6px!important}
    #fieldRecords .pages{margin:3px 0!important}
    #fieldRecords .pages .btn{min-height:27px!important;font-size:10px!important}
    #fieldRecords #recordList .card{padding:6px!important;margin:4px 0!important}
    #fieldRecords #recordList .thumb{width:48px!important;height:48px!important}
  }
  `;
  d.head.appendChild(st);

  const wrap=d.querySelector('.wrap');
  if(!wrap)return;
  const panels=[...wrap.children].filter(x=>x.classList&&x.classList.contains('panel'));
  if(panels.length<4)return;
  const [work,stats,records,advanced]=panels;
  work.id='fieldWork';stats.id='fieldStats';records.id='fieldRecords';

  // 记录区标题
  const oldHead=records.querySelector(':scope > .row');
  if(oldHead) oldHead.remove();
  const head=d.createElement('div');
  head.className='field-head';
  head.innerHTML='<h2>设备记录</h2><small>确认后自动同步飞书</small>';
  records.prepend(head);

  // 搜索/筛选/下载移入记录区顶部
  const toolbar=stats.querySelector('.toolbar-row');
  if(toolbar){
    toolbar.className='field-tools';
    const p=records.querySelector('.pages');
    records.insertBefore(toolbar,p);
  }
  const csv=d.getElementById('csvTopBtn');
  if(csv){
    const holder=d.createElement('div');
    holder.className='toolbar-download';
    holder.appendChild(csv);
    const tools=records.querySelector('.field-tools');
    if(tools)tools.appendChild(holder);
  }

  // 批量管理折叠
  const bulk=stats.querySelector('.bulkbar');
  if(bulk){
    const det=d.createElement('details');
    det.className='field-bulk';
    det.innerHTML='<summary>批量管理</summary>';
    det.appendChild(bulk);
    const p=records.querySelector('.pages');
    records.insertBefore(det,p);
  }

  // 状态芯片重新排序：总/待审/已确认/待同步；已选/队列/失败重试/失败
  const topstat=stats.querySelector('.topstat');
  const retry=stats.querySelector('.retry-failed-all');
  const order=['countAll','countPending','countOk','countSync','countSelected','queuePill'];
  if(topstat){
    order.forEach(id=>{const el=d.getElementById(id);if(el)topstat.appendChild(el)});
    if(retry)topstat.appendChild(retry);
    const fail=d.getElementById('queueFailedPill');if(fail)topstat.appendChild(fail);
  }

  const semanticMap={
    countAll:'field-total',
    countPending:'field-pending',
    countOk:'field-confirmed',
    countSync:'field-sync',
    countSelected:'field-selected',
    queuePill:'field-queue',
    queueFailedPill:'field-failed'
  };
  Object.entries(semanticMap).forEach(([id,cls])=>{const el=d.getElementById(id);if(el)el.classList.add(cls)});
  if(retry)retry.classList.add('field-failed-action');

  function numFrom(el){
    const m=(el?.textContent||'').match(/\d+/g);
    if(!m)return 0;
    return Math.max(...m.map(Number));
  }
  function paint(){
    Object.keys(semanticMap).forEach(id=>{
      const el=d.getElementById(id);if(!el)return;
      const n=numFrom(el);
      el.classList.toggle('field-has-data',n>0);
      el.classList.toggle('field-zero',n===0);
      el.classList.toggle('field-active',el.classList.contains('filter-active'));
    });
    const failed=d.getElementById('queueFailedPill');
    const fn=numFrom(failed);
    if(retry){
      retry.classList.toggle('field-has-data',fn>0);
      retry.classList.toggle('field-zero',fn===0);
      retry.classList.toggle('field-active',retry.classList.contains('filter-active'));
    }
  }
  paint();
  new MutationObserver(paint).observe(d.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['class']});
});
</script>
</body>
</html>
