  d.head.appendChild(st);

  const wrap=d.querySelector('.wrap');
  if(!wrap)return;
  const panels=[...wrap.children].filter(x=>x.classList&&x.classList.contains('panel'));

  const [work,stats,records,advanced]=panels;
  work.id='fieldWork';stats.id='fieldStats';records.id='fieldRecords';

  let topTempInput=null, topHumInput=null;
  let topEnvDirty=false;
  const workRow=work.querySelector(':scope > .row');
  if(workRow){
    const makeTopField=(labelText,cls,inputMode,placeholder)=>{
      const f=d.createElement('div');f.className='field env-top-field '+cls;
      const lab=d.createElement('label');lab.textContent=labelText;
      const inp=d.createElement('input');inp.type='text';inp.inputMode=inputMode;inp.placeholder=placeholder;
      inp.addEventListener('input',()=>{topEnvDirty=true;});
      f.append(lab,inp);workRow.appendChild(f);return inp;
    };
    topTempInput=makeTopField('温度（℃）','env-top-temp','decimal','例如 25.0');
    topHumInput=makeTopField('湿度（%RH）','env-top-hum','numeric','例如 83');
  }


  // V3 robust DOM layout
  const allEls=()=>[...d.querySelectorAll('*')];

  // top title + right settings
  const brand=d.querySelector('.brand-inner');
  if(brand){
    const title=brand.querySelector('h1'); if(title) title.textContent='设备铭牌识别';
    let settingsBtn=d.querySelector('.field-settings-btn');
    if(!settingsBtn){
      settingsBtn=d.createElement('button');
      settingsBtn.type='button'; settingsBtn.className='field-settings-btn'; settingsBtn.textContent='⚙ 设置';

    if(advanced){

      if(advanced.tagName==='DETAILS') advanced.open=true;

      settingsBtn.onclick=()=>{
        const showing=advanced.style.display!=='none';
        advanced.style.display=showing?'none':'block';
        settingsBtn.textContent=showing?'⚙ 设置':'✕ 收起';
      };

  // record heading
  const oldHead=records.querySelector(':scope > .row');
  if(oldHead) oldHead.remove();

  // move network after title
  let network=d.getElementById('networkPill');
  if(!network){
    network=allEls().find(el=>el.children.length===0 && /网络\s*[：:]\s*(在线|离线|检测中)/.test((el.textContent||'').trim()));
  }
  if(network){

    holder.setAttribute('style','margin-left:auto!important;flex:0 0 auto!important;width:auto!important;');
  }

  // build one-line status/filter/search toolbar
  let filter=d.getElementById('filterStatus') || [...d.querySelectorAll('select')].find(sel=>[...sel.options].some(o=>(o.textContent||'').trim()==='全部记录'));
  let search=d.getElementById('searchInput') || [...d.querySelectorAll('input')].find(inp=>/名称\s*\/\s*厂家\s*\/\s*型号\s*\/\s*编号/.test(inp.placeholder||''));
  const oldToolbar=allEls().find(el=>el!==records && el.classList && (el.classList.contains('toolbar-row')||el.classList.contains('field-tools')) && ((filter&&el.contains(filter))||(search&&el.contains(search))));
  const tools=d.createElement('div');tools.className='field-record-tools';
  const l1=d.createElement('span');l1.className='tool-label';l1.textContent='状态';
  const l2=d.createElement('span');l2.className='tool-label';l2.textContent='搜索';
  tools.appendChild(l1);if(filter)tools.appendChild(filter);tools.appendChild(l2);if(search)tools.appendChild(search);
  const page=records.querySelector('.pages');
  records.insertBefore(tools,page);

  // common bulk buttons remain visible
  let bulk=stats.querySelector('.bulkbar') || records.querySelector('.bulkbar');
  if(bulk){

    holder.appendChild(bulk);
    records.insertBefore(holder,page);

  // status order
  const topstat=stats.querySelector('.topstat');
  const findPill=(prefix)=>[...stats.querySelectorAll('.pill')].find(el=>(el.textContent||'').trim().startsWith(prefix));
  const retry=[...stats.querySelectorAll('button,.btn')].find(el=>(el.textContent||'').trim()==='失败重识别')||stats.querySelector('.retry-failed-all');
  const allEl=d.getElementById('countAll')||findPill('总记录');

  if(queueEl) queueEl.textContent=(queueEl.textContent||'').replace(/^队列\s*[：:]\s*/,'');
  if(topstat)[allEl,okEl,pendingEl,syncEl,selectedEl,queueEl,failedEl,retry].filter(Boolean).forEach(el=>topstat.appendChild(el));

    countAll:'field-total',
    countPending:'field-pending',
    countOk:'field-confirmed',
    countSync:'field-sync',

    queueFailedPill:'field-failed'
  };
  Object.entries(semanticMap).forEach(([id,cls])=>{const el=d.getElementById(id);if(el)el.classList.add(cls)});
  if(retry)retry.classList.add('field-failed-action');


  // V4 weather + per-record environment persistence
  const DB_NAME='mingpai-free-v1', STORE='records', WEATHER_KEY='mingpai-field-weather-v1';
  let currentWeather=null;
  function openDb(){
    return new Promise((resolve,reject)=>{
      const req=indexedDB.open(DB_NAME,2);
      req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:'id'});};
      req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error);
    });
  }
  async function getRecord(id){const db=await openDb();return new Promise((res,rej)=>{const q=db.transaction(STORE,'readonly').objectStore(STORE).get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)})}
  async function putRecord(rec){const db=await openDb();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(rec);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
  async function allRecords(){const db=await openDb();return new Promise((res,rej)=>{const q=db.transaction(STORE,'readonly').objectStore(STORE).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error)})}
  const baselineIds=new Set((await allRecords()).map(r=>r.id));

  function weatherText(w){return w&&Number.isFinite(+w.temperature)&&Number.isFinite(+w.humidity)?`${(+w.temperature).toFixed(1)}℃/${Math.round(+w.humidity)}%RH`:'--℃/--%RH'}

  function applyWeatherToTop(){
    if(!currentWeather||topEnvDirty)return;
    if(topTempInput)topTempInput.value=Number(currentWeather.temperature).toFixed(1);
    if(topHumInput)topHumInput.value=String(Math.round(Number(currentWeather.humidity)));
  }
  function installWeatherChip(){
    if(!brand)return;
    let chip=brand.querySelector('.field-weather');
    if(!chip){chip=d.createElement('button');chip.type='button';chip.className='field-weather';brand.insertBefore(chip,d.querySelector('.field-settings-btn')||null);}
    chip.textContent=weatherText(currentWeather);
    chip.title='点击刷新当前温湿度';
    chip.onclick=()=>refreshWeather(true);
  }
  function loadWeatherCache(){
    try{const w=JSON.parse(localStorage.getItem(WEATHER_KEY)||'null');if(w&&Date.now()-Number(w.savedAt||0)<60*60*1000)currentWeather=w}catch{}
    applyWeatherToTop();
  }
  async function refreshWeather(force=false){
    installWeatherChip();
    if(!force&&currentWeather&&Date.now()-Number(currentWeather.savedAt||0)<60*60*1000){applyWeatherToTop();decorateCards();return}
    if(!navigator.geolocation)return;
    navigator.geolocation.getCurrentPosition(async pos=>{
      try{
        const {latitude,longitude}=pos.coords;
        const url=`https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(latitude)}&longitude=${encodeURIComponent(longitude)}&current=temperature_2m,relative_humidity_2m&timezone=auto`;
        const resp=await fetch(url,{cache:'no-store'}); if(!resp.ok)throw new Error('weather HTTP '+resp.status);
        const js=await resp.json();
        currentWeather={temperature:Number(js?.current?.temperature_2m),humidity:Number(js?.current?.relative_humidity_2m),savedAt:Date.now(),latitude,longitude};
        localStorage.setItem(WEATHER_KEY,JSON.stringify(currentWeather));
        applyWeatherToTop(); installWeatherChip(); decorateCards();
      }catch(e){console.warn('weather fetch failed',e)}
    },err=>console.warn('geolocation failed',err),{enableHighAccuracy:false,timeout:10000,maximumAge:60*60*1000});
  }

  function syncLabel(rec){
    const s=rec?.syncStatus;
    return s==='synced'?'已同步':s==='syncing'?'同步中':s==='error'?'失败待重试':s==='pending'?'有修改待同步':s==='local-only'?'仅本机保存':rec?.status==='confirmed'?'尚未同步':'待确认';
  }
  async function decorateCard(card){
    if(card.dataset.envDecorating==='1')return;
    const id=card.querySelector('[data-select-id]')?.getAttribute('data-select-id')||card.querySelector('[data-id]')?.getAttribute('data-id');
    if(!id)return;
    card.dataset.envDecorating='1';
    try{
      let rec=await getRecord(id); if(!rec)return;
      // 只在本次页面新生成记录时复制顶部默认温湿度一次
      if(!baselineIds.has(id)&&(rec.temperature==null||rec.temperature==='')&&(rec.humidity==null||rec.humidity==='')){
        rec.temperature=(topTempInput?.value||'').trim();
        rec.humidity=(topHumInput?.value||'').trim();
        rec.envCapturedAt=Date.now();
        await putRecord(rec);
        baselineIds.add(id);
      }

      const title=card.querySelector('.cardtitle');
      if(title){
        const small=title.querySelector('small'); if(small)small.remove();
        const oldEnv=title.querySelector('.env-summary'); if(oldEnv)oldEnv.remove();
      }

      // 温湿度像厂家/型号一样作为普通字段直接编辑
      const labelNodes=[...card.querySelectorAll('label')];
      const opLabel=labelNodes.find(x=>(x.textContent||'').trim()==='检定员');
      const opField=opLabel?.parentElement;
      let tempField=card.querySelector('.env-record-temp');
      let humField=card.querySelector('.env-record-hum');
      const makeRecField=(labelText,cls,value,inputMode)=>{
        const f=d.createElement('div');f.className='field env-record-field '+cls;
        const lab=d.createElement('label');lab.textContent=labelText;
        const inp=d.createElement('input');inp.type='text';inp.inputMode=inputMode;inp.value=value??'';
        ['click','pointerdown','touchstart'].forEach(ev=>inp.addEventListener(ev,e=>e.stopPropagation()));
        inp.addEventListener('change',async()=>{
          const r=await getRecord(id);if(!r)return;
          if(cls.includes('temp'))r.temperature=inp.value.trim();else r.humidity=inp.value.trim();
          r.envCapturedAt=r.envCapturedAt||Date.now();await putRecord(r);
        });
        f.append(lab,inp);return f;
      };
      if(opField&&!tempField&&!humField){
        tempField=makeRecField('温度（℃）','env-record-temp',rec.temperature,'decimal');
        humField=makeRecField('湿度（%RH）','env-record-hum',rec.humidity,'numeric');
        opField.insertAdjacentElement('afterend',tempField);
        tempField.insertAdjacentElement('afterend',humField);
      }else{
        const ti=tempField?.querySelector('input');if(ti&&d.activeElement!==ti)ti.value=rec.temperature??'';
        const hi=humField?.querySelector('input');if(hi&&d.activeElement!==hi)hi.value=rec.humidity??'';
      }

      const head=card.querySelector('.cardhead');
      const badge=head?.querySelector('.badge');
      if(head&&badge){
        let stack=head.querySelector('.card-status-stack');
        if(!stack){stack=d.createElement('div');stack.className='card-status-stack';badge.replaceWith(stack);stack.appendChild(badge);const sm=d.createElement('div');sm.className='sync-mini';stack.appendChild(sm);}
        stack.querySelector('.sync-mini').textContent='飞书：'+syncLabel(rec);
      }

      // 已确认记录不再显示“取消确认”
      card.querySelectorAll('button').forEach(btn=>{if((btn.textContent||'').trim()==='取消确认')btn.remove();});
      card.dataset.envInitialized='1';
    }catch(e){console.warn('decorate env card failed',e)}
    finally{card.dataset.envDecorating='0'}
  }
  function decorateCards(){d.querySelectorAll('#recordList .card').forEach(card=>decorateCard(card))}

  // Clear button uses same danger style; retain 取消选择.
  [...d.querySelectorAll('button,.btn')].forEach(btn=>{if((btn.textContent||'').trim()==='清空')btn.classList.add('field-clear-danger')});


  // V6 外部浏览器本地导出：全部本地记录 + 温湿度 + 状态
  function xmlEscape(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function crc32(bytes){let x=0xffffffff;for(const b of bytes){x^=b;for(let k=0;k<8;k++)x=(x>>>1)^((x&1)?0xedb88320:0)}return(x^0xffffffff)>>>0}
  function u16(n){return new Uint8Array([n&255,(n>>>8)&255])}
  function u32(n){return new Uint8Array([n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255])}
  function cat(parts){const len=parts.reduce((n,p)=>n+p.length,0),out=new Uint8Array(len);let o=0;for(const p of parts){out.set(p,o);o+=p.length}return out}
  function zipStored(files){
    const enc=new TextEncoder(),locals=[],centrals=[];let offset=0;
    for(const [name,text] of files){const nb=enc.encode(name),data=enc.encode(text),crc=crc32(data);
      const local=cat([u32(0x04034b50),u16(20),u16(0x0800),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(nb.length),u16(0),nb,data]);locals.push(local);
      const central=cat([u32(0x02014b50),u16(20),u16(20),u16(0x0800),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(nb.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),nb]);centrals.push(central);offset+=local.length;
    }
    const size=centrals.reduce((n,p)=>n+p.length,0);return cat([...locals,...centrals,u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(size),u32(offset),u16(0)]);
  }
  function makeXlsx(rows){
    const cell=v=>'<c t="inlineStr"><is><t xml:space="preserve">'+xmlEscape(v)+'</t></is></c>';
    const sheet='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'+rows.map((r,i)=>'<row r="'+(i+1)+'">'+r.map(cell).join('')+'</row>').join('')+'</sheetData></worksheet>';
    return new Blob([zipStored([
      ['[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>'],
      ['_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
      ['xl/workbook.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="设备记录" sheetId="1" r:id="rId1"/></sheets></workbook>'],
      ['xl/_rels/workbook.xml.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>'],
      ['xl/worksheets/sheet1.xml',sheet]
    ])],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  }
  function fmtStatus(r){return r.status==='confirmed'?'已确认':r.status==='pending'?'待审核':(r.status||'')}
  function pad2(n){return String(n).padStart(2,'0')}
  async function localExport(ev){
    const ua=navigator.userAgent||'',isWechat=/MicroMessenger/i.test(ua);if(isWechat)return;
    ev.preventDefault();ev.stopPropagation();ev.stopImmediatePropagation();
    const rows=(await allRecords()).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    if(!rows.length){alert('当前没有可导出的本地记录。');return}
    const head=['单位名称','科室','检定日期','检定员','设备名称','生产厂家','型号','出厂编号','温度（℃）','相对湿度（%RH）','备注','状态','铭牌文本'];
    const body=rows.map(r=>[r.unitName||r.batch||'',r.dept||'',r.date||'',r.operatorName||'',r.name||'',r.manufacturer||'',r.model||'',r.code||'',r.temperature??'',r.humidity??'',r.remark||'',fmtStatus(r),r.raw||'']);
    const now=new Date(),stamp=now.getFullYear()+pad2(now.getMonth()+1)+pad2(now.getDate())+'_'+pad2(now.getHours())+pad2(now.getMinutes())+pad2(now.getSeconds());
    const blob=makeXlsx([head,...body]),url=URL.createObjectURL(blob),a=d.createElement('a');a.href=url;a.download='设备铭牌数据_'+stamp+'.xlsx';d.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
  }
  if(csv)csv.addEventListener('click',localExport,true);

  loadWeatherCache(); installWeatherChip(); refreshWeather(false);
  const cardsObserver=new MutationObserver(()=>decorateCards());
  const list=d.getElementById('recordList');if(list)cardsObserver.observe(list,{childList:true,subtree:true});
  decorateCards();

  function numFrom(el){
    const m=(el?.textContent||'').match(/\d+/g);
    if(!m)return 0;
    return Math.max(...m.map(Number));
  }
  function paint(){
    const queueLabel=d.getElementById('queuePill');
    if(queueLabel){
      const cleaned=(queueLabel.textContent||'').replace(/^队列\s*[：:]\s*/,'');
      if(cleaned!==queueLabel.textContent) queueLabel.textContent=cleaned;
    }
    Object.keys(semanticMap).forEach(id=>{
      const el=d.getElementById(id);if(!el)return;
      const n=numFrom(el);
      el.classList.toggle('field-has-data',n>0);
      el.classList.toggle('field-zero',n===0);
      el.classList.toggle('field-active',el.classList.contains('filter-active'));
    });
    const failed=d.getElementById('queueFailedPill');
    const fn=numFrom(failed);
    if(retry){
      retry.classList.toggle('field-has-data',fn>0);
      retry.classList.toggle('field-zero',fn===0);
      retry.classList.toggle('field-active',retry.classList.contains('filter-active'));
    }
  }
  paint();
  new MutationObserver(paint).observe(d.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['class']});
});
</script>
