name: Test opt-in browser restore diagnosis (same v1.18.4.5)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-boot-resume-diagnosis.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore current second-stage startup test baseline
        env:
          PINNED_COMMIT: ed56e8db775d5e2f3f6943e6f8a5e1d7e23c9178
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/release-baseline/v11845-bootfix-test2:refs/remotes/origin/release-baseline/v11845-bootfix-test2
          test "$(git rev-parse refs/remotes/origin/release-baseline/v11845-bootfix-test2)" = "$PINNED_COMMIT"
          mkdir -p app
          git archive "$PINNED_COMMIT":site-baseline | tar -xf - -C app

      - name: Add opt-in browser resume diagnosis ONLY to test entry
        run: python scripts/add-boot-resume-diagnosis-test.py

      - name: Verify diagnostic isolation, versions, core functions
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('app')
          assert hashlib.sha256((root/'index.html').read_bytes()).hexdigest()=='0082a4f28591f5b2e2906a8b7fec6f94ec1247247467fa5fed02d0572cf7fa22'
          assert hashlib.sha256((root/'recognition-rules-v1184.json').read_bytes()).hexdigest()=='6cd441b385603582934754978f2ea30a09b314cf7bd2a1ae086db4c25e38820c'
          assert json.loads((root/'version-v118-test.json').read_text())['version']=='1.18.4.5'
          assert json.loads((root/'test-adaptive/version-v118-test.json').read_text())['version']=='1.18.4.5-test'
          s=(root/'test-adaptive/index.html').read_text()
          assert 'mingpai-optin-boot-diagnosis' in s
          assert 'pendingConfirmRefreshBound' in s and 'v11845-stats-unit-label' in s
          assert 'const confirmed=/已确认/' in s
          core=(root/'test-adaptive/core.html').read_text()
          assert 'if(resumedController?.scriptURL?.includes' in core
          print('PASS: opt-in diagnosis on test only; 84 rules and stable formal intact')
          PY

      - name: Preserve diagnostic candidate baseline
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/mingpai-bootdiag"
          git worktree add -b release-baseline/v11845-bootdiag-test "$BASE" HEAD
          mkdir -p "$BASE/site-baseline"
          cp -a app/. "$BASE/site-baseline/"
          cd "$BASE"
          git add site-baseline
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test baseline: opt-in-only browser resume diagnostics'
          git push origin HEAD:refs/heads/release-baseline/v11845-bootdiag-test

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
