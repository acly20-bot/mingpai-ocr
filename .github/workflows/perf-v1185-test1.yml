name: v1.18.5-test.1 DOM observer performance candidate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/perf-v1185-test1.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore current 85-rule stable baseline
        env:
          PINNED_COMMIT: ae214f4a11b0c5c107e97fa4b50deb3a562e7200
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/release-baseline/v11845-boot-closeout:refs/remotes/origin/release-baseline/v11845-boot-closeout
          test "$(git rev-parse refs/remotes/origin/release-baseline/v11845-boot-closeout)" = "$PINNED_COMMIT"
          mkdir -p app
          git archive "$PINNED_COMMIT":site-baseline | tar -xf - -C app
      - name: Apply targeted performance change in TEST ONLY
        run: python scripts/perf-v1185-test1-card-observer.py
      - name: Verify stable formal SHA, runtime and 85 rules
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          r=Path('app')
          assert hashlib.sha256((r/'index.html').read_bytes()).hexdigest()=='50b80ba6955fd521b63c5851dbf09f5dbafecfbe2f4a854557c626d799cdb284'
          assert hashlib.sha256((r/'recognition-rules-v1184.json').read_bytes()).hexdigest()=='56387ad6c2bd57ee39186a936e89298605535ef4c8f5702c57b84ebd862eed78'
          assert json.loads((r/'version-v118-test.json').read_text())['version']=='1.18.4.5'
          assert json.loads((r/'test-adaptive/version-v118-test.json').read_text())['version']=='1.18.5-test.1'
          assert len(json.loads((r/'test-adaptive/recognition-rules-v1184.json').read_text())['rules'])==85
          s=(r/'test-adaptive/index.html').read_text()
          assert "node.matches?.('article.card,.card')" in s
          assert 'pendingConfirmRefreshBound' in s
          assert 'v11845-stats-unit-label' in s
          assert 'const confirmed=/已确认/' in s
          assert "nativeChange('temperature',temp)" in s
          assert 'mingpai-optin-boot-diagnosis' not in s
          print('PASS isolated performance candidate; production exact, 85 rules unchanged')
          PY
      - name: Save candidate site branch
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/mingpai-v1185-test1"
          git worktree add -b release-baseline/v1185-test1 "$BASE" HEAD
          mkdir -p "$BASE/site-baseline"
          cp -a app/. "$BASE/site-baseline/"
          cd "$BASE"
          git add site-baseline
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'candidate: v1.18.5-test.1 record observer filter'
          git push origin HEAD:refs/heads/release-baseline/v1185-test1
          echo "TEST_BASELINE_SHA=$(git rev-parse HEAD)"
      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: app
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
