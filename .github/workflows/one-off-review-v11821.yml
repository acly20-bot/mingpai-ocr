name: One-time review of released v1.18.2.1 runtime
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-off-review-v11821.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect COS runtime without changing it
        run: |
          python - <<'PY'
          from urllib.request import urlopen
          import re, collections,json,hashlib
          prefix='https://mingpai-ocr-1387910526.cos.ap-guangzhou.myqcloud.com/assets/'
          urls=['index-B81hyAdU-v1182-test22.js','recognition-rules-v1181.json']
          for fname in urls:
              data=urlopen(prefix+fname,timeout=120).read()
              print('FILE',fname,'BYTES',len(data),'SHA256',hashlib.sha256(data).hexdigest())
              if fname.endswith('.json'):
                  obj=json.loads(data);print('RULES TYPE',type(obj).__name__)
                  if isinstance(obj,dict):print('RULES KEYS',list(obj)[:25], 'LENGTHS',{k:len(v) for k,v in obj.items() if isinstance(v,(list,dict))})
                  continue
              s=data.decode('utf-8','replace')
              terms=['function v11713PatchCard(','function CI(','async function AI(','function v151KeepScroll(','async function runPhotoQueueV9(', 'async function enqueueExistingV9(', 'function v1188CorrectNameplate(', 'recognition-rules-v1181.json','function Hg(', 'async function Hg(','new MutationObserver','setInterval(', 'IndexedDB', 'performance.now(', 'console.', 'fetch(', 'canvas.toDataURL(', 'toBlob(', 'createImageBitmap(', 'v11822RecoveryKey','v1174ApplyExternalRules']
              for term in terms:
                  ix=[m.start() for m in re.finditer(re.escape(term),s)]
                  print('TERM',term,'COUNT',len(ix),'OFFSETS',ix[:8])
                  if term in ('function v11713PatchCard(','function CI(','async function AI(','async function runPhotoQueueV9(', 'async function enqueueExistingV9(', 'function v1188CorrectNameplate(', 'function Hg(', 'async function Hg(','function v151KeepScroll('):
                      for i in ix[:1]:print('FRAGMENT',repr(s[i:i+2200]))
              words=['WebGPU','ocr.space','ocrspace','wasm','hardwareConcurrency','navigator.onLine','syncStatus','recognitionSec','queueFailed','recordList','fieldName','clearInterval','localStorage','sessionStorage','IndexedDB','indexedDB','OCRResult','旋转','裁剪']
              print('WORDS',{w:s.count(w) for w in words})
              print('LAST_1800',repr(s[-1800:]))
          PY
