name: Publish CPAP serial III rule r9 (app v1.18.4.5 unchanged)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-rules-cpap-r9.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore current stable formal and bootdiagnostic test site
        env:
          PINNED_COMMIT: d0d67170f1b460095b9d03afe2d593bde4b79a94
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/release-baseline/v11845-bootdiag-test:refs/remotes/origin/release-baseline/v11845-bootdiag-test
          test "$(git rev-parse refs/remotes/origin/release-baseline/v11845-bootdiag-test)" = "$PINNED_COMMIT"
          mkdir -p app
          git archive "$PINNED_COMMIT":site-baseline | tar -xf - -C app
      - name: Apply exact Pigeon CPAP serial correction to both sites
        run: python scripts/release-rules-cpap-serial-r9.py
      - name: Freeze 85-rule full baseline
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/mingpai-r9"
          git worktree add -b release-baseline/v11845-rules-cpap-r9 "$BASE" HEAD
          mkdir -p "$BASE/site-baseline"
          cp -a app/. "$BASE/site-baseline/"
          cd "$BASE"
          git add site-baseline
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'baseline: v1.18.4.5 and 85 rules including CPAP serial III'
          git push origin HEAD:refs/heads/release-baseline/v11845-rules-cpap-r9
          echo "PINNED_BASELINE_SHA=$(git rev-parse HEAD)"
          sha256sum site-baseline/index.html site-baseline/test-adaptive/index.html site-baseline/recognition-rules-v1184.json
      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: app
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
