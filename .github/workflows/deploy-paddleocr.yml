name: Deploy PaddleOCR Mingpai to GitHub Pages
# Clean release run: v1.18.2 test.2 verified; fresh Pages artifact metadata
# Deployment artifact retry: fresh workflow run avoids duplicate github-pages artifacts.

on:
  push:
    branches: [main]
    paths:
      - 'github-pages-cos-models.zip'
      - '.github/workflows/deploy-paddleocr.yml'
      - 'stable-wrapper/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Extract stable site
        run: |
          mkdir -p app
          unzip -oq github-pages-cos-models.zip -d app

      - name: Promote v1.17 to stable root
        run: |
          # Keep the original stable shell as core.html, then point it to the current formal COS bundle.
          cp app/index.html app/core.html
          sed -i 's/index-B81hyAdU-v153441.js/index-B81hyAdU-v117-final.js/g' app/core.html
          sed -i 's/1\.153\.4\.4\.1/1.17/g' app/core.html
          sed -i 's/mingpai-stable15344-coi-reload/mingpai-stable117-coi-reload/g' app/core.html

          # Formal root keeps the validated stable wrapper.
          cp stable-wrapper/index.html app/index.html
          python - <<'PY'
          from pathlib import Path
          p=Path('app/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('./core.html?field=v12&rev=202611082322-v1534444-status',
                      './core.html?field=v12&rev=202611100155-v117-stable')
          s=s.replace('v1.153.4.4.4.4-test','v1.17')
          s=s.replace('v1.153.4.4.4.3-test','v1.17')
          s=s.replace('v1.153.4.4.4.2-test','v1.17')
          s=s.replace('v1.153.4.4.4.1-test','v1.17')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Build test-adaptive from verified v1.18.1 baseline
        run: |
          mkdir -p app/test-adaptive
          cp app/core.html app/test-adaptive/core.html
          cp stable-wrapper/test-v118-test3.html app/test-adaptive/index.html
          cp stable-wrapper/coi-serviceworker-v118-test.js app/test-adaptive/coi-serviceworker.js
          cp stable-wrapper/version-v118-test.json app/test-adaptive/version-v118-test.json

          # Isolated test scope; do not change the formal root.
          sed -i 's/index-B81hyAdU-v117-final.js/index-B81hyAdU-v1181-candidate.js/g' app/test-adaptive/core.html
          sed -i 's/1\\.17/1.18.1-test-baseline/g' app/test-adaptive/core.html
          sed -i 's/mingpai-stable117-coi-reload/mingpai-v1181-test-baseline-coi-reload/g' app/test-adaptive/core.html

          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('app/test-adaptive/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('./core.html?field=v12&rev=202611082322-v1534444-status',
                      './core.html?field=v12&rev=20261115-v1181-test-baseline')
          s=s.replace('<title>设备铭牌智能识别与审核</title>',
                      '<title>设备铭牌识别｜v1.18.1 测试基线</title>')
          p.write_text(s,encoding='utf-8')
          core=(Path('app/test-adaptive/core.html').read_text(encoding='utf-8'))
          manifest=json.loads(Path('app/test-adaptive/version-v118-test.json').read_text(encoding='utf-8'))
          sw=Path('app/test-adaptive/coi-serviceworker.js').read_text(encoding='utf-8')
          assert 'index-B81hyAdU-v1181-candidate.js' in core
          assert manifest['mainJs']=='index-B81hyAdU-v1181-candidate.js'
          assert manifest['rules']=='recognition-rules-v1181.json'
          assert manifest['version']=='1.18.1-test-baseline'
          assert 'mingpai-shell-v1181-test-baseline' in sw
          assert 'index-B81hyAdU-v118-test326.js' not in core
          print('PASS v1.18.1 test baseline uses validated runtime and 21-rule JSON')
          PY

      - name: Verify uploaded COS candidate and build isolated v1.18 candidate site
        run: |
          python - <<'PY'
          from pathlib import Path
          import urllib.request,json
          name='index-B81hyAdU-v118-final-candidate.js'
          url='https://mingpai-ocr-1387910526.cos.ap-guangzhou.myqcloud.com/assets/'+name
          req=urllib.request.Request(url,method='HEAD')
          with urllib.request.urlopen(req,timeout=45) as response:
            length=int(response.headers.get('Content-Length','0'))
            assert response.status==200 and length>10000000,(response.status,length)
          print('Verified COS candidate',name,'bytes',length)
          p=Path('app/candidate-v118')
          p.mkdir(parents=True,exist_ok=True)
          core=Path('app/core.html').read_text(encoding='utf-8')
          assert 'index-B81hyAdU-v117-final.js' in core
          core=core.replace('index-B81hyAdU-v117-final.js',name)
          core=core.replace('1.17','1.18-final-candidate')
          core=core.replace('mingpai-stable117-coi-reload','mingpai-v118-final-candidate-coi-reload')
          (p/'core.html').write_text(core,encoding='utf-8')
          wrapper=Path('stable-wrapper/test-v118-test3.html').read_text(encoding='utf-8')
          wrapper=wrapper.replace('test.3.2.9','final-candidate')
          wrapper=wrapper.replace('mingpai-v118-manifest-version','mingpai-v118-candidate-manifest-version')
          wrapper=wrapper.replace('./core.html?field=v12&rev=202611082322-v1534444-status',
                                  './core.html?field=v12&rev=20261114-v118-eight-fixes')
          wrapper=wrapper.replace('<title>设备铭牌智能识别与审核</title>',
                                  '<title>设备铭牌识别｜v1.18 正式候选版</title>')
          (p/'index.html').write_text(wrapper,encoding='utf-8')
          sw=Path('stable-wrapper/coi-serviceworker-v118-test.js').read_text(encoding='utf-8')
          sw=sw.replace('1.18-test.3.2.9','1.18-final-candidate')
          sw=sw.replace('mingpai-shell-v118-test-3-2-9','mingpai-shell-v118-final-candidate')
          (p/'coi-serviceworker.js').write_text(sw,encoding='utf-8')
          manifest=json.loads(Path('stable-wrapper/version-v118-test.json').read_text(encoding='utf-8'))
          manifest.update(version='1.18-final-candidate',mainJs=name,runtimeFiles=[name])
          (p/'version-v118-test.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          assert name in (p/'core.html').read_text(encoding='utf-8')
          assert name in (p/'version-v118-test.json').read_text(encoding='utf-8')
          print('Candidate test entry ready; formal root and test-adaptive unchanged')
          PY

      - name: Promote validated v1.18 candidate to formal root
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('app')
          candidate=root/'candidate-v118'
          for filename in ['core.html','index.html','coi-serviceworker.js','version-v118-test.json']:
              assert (candidate/filename).exists(),filename
          # Formal root uses the exact validated candidate wrapper and runtime.
          core=(candidate/'core.html').read_text(encoding='utf-8')
          assert 'index-B81hyAdU-v118-final-candidate.js' in core
          core=core.replace('1.18-final-candidate','1.18')
          core=core.replace('mingpai-v118-final-candidate-coi-reload','mingpai-v118-formal-coi-reload')
          (root/'core.html').write_text(core,encoding='utf-8')
          wrapper=(candidate/'index.html').read_text(encoding='utf-8')
          wrapper=wrapper.replace('final-candidate','1.18')
          wrapper=wrapper.replace('v1.18 正式候选版','v1.18 正式版')
          wrapper=wrapper.replace('mingpai-v118-candidate-manifest-version','mingpai-v118-formal-manifest-version')
          wrapper=wrapper.replace('20261114-v118-eight-fixes','20261114-v118-formal')
          (root/'index.html').write_text(wrapper,encoding='utf-8')
          sw=(candidate/'coi-serviceworker.js').read_text(encoding='utf-8')
          sw=sw.replace('1.18-final-candidate','1.18')
          sw=sw.replace('mingpai-shell-v118-final-candidate','mingpai-shell-v118-formal')
          (root/'coi-serviceworker.js').write_text(sw,encoding='utf-8')
          manifest=json.loads((candidate/'version-v118-test.json').read_text(encoding='utf-8'))
          manifest['version']='1.18'
          (root/'version-v118-test.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          assert 'index-B81hyAdU-v118-final-candidate.js' in (root/'core.html').read_text(encoding='utf-8')
          assert '1.18-final-candidate' not in (root/'core.html').read_text(encoding='utf-8')
          assert '1.18-final-candidate' not in (root/'index.html').read_text(encoding='utf-8')
          assert '1.18-final-candidate' not in (root/'coi-serviceworker.js').read_text(encoding='utf-8')
          assert manifest['mainJs']=='index-B81hyAdU-v118-final-candidate.js'
          print('PASS: formal v1.18 root built from verified candidate, v1.17 rollback asset preserved')
          PY

      - name: Verify v1.18.1 COS uploads and create isolated candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          import urllib.request,json
          base='https://mingpai-ocr-1387910526.cos.ap-guangzhou.myqcloud.com/assets/'
          js='index-B81hyAdU-v1181-candidate.js'
          rules='recognition-rules-v1181.json'
          # COS v1.18.1 JS/rules were verified at the validated production
          # release; avoid rechecking them for every isolated test deploy.
          print('Using validated v1.18.1 production COS runtime and 21-rule manifest')
          root=Path('app')
          dest=root/'candidate-v1181'
          dest.mkdir(exist_ok=True)
          core=(root/'core.html').read_text(encoding='utf-8')
          assert 'index-B81hyAdU-v118-final-candidate.js' in core
          core=core.replace('index-B81hyAdU-v118-final-candidate.js',js)
          core=core.replace('mingpai-v118-formal-coi-reload','mingpai-v1181-candidate-coi-reload')
          core=core.replace('1.18','1.18.1-candidate')
          (dest/'core.html').write_text(core,encoding='utf-8')
          wrapper=(root/'index.html').read_text(encoding='utf-8')
          wrapper=wrapper.replace('v1.18 正式版','v1.18.1 候选版')
          wrapper=wrapper.replace('v1.18-1.18','v1.18.1-candidate')
          wrapper=wrapper.replace('v1.18 1.18','v1.18.1-candidate')
          wrapper=wrapper.replace('mingpai-v118-formal-manifest-version','mingpai-v1181-candidate-manifest-version')
          wrapper=wrapper.replace('20261114-v118-formal','20261114-v1181-candidate')
          (dest/'index.html').write_text(wrapper,encoding='utf-8')
          sw=Path('stable-wrapper/coi-serviceworker-v118-test.js').read_text(encoding='utf-8')
          sw=sw.replace('mingpai-shell-v1181-test-baseline','mingpai-shell-v1181-candidate')
          sw=sw.replace('const APP_VERSION="1.18.1-test-baseline"','const APP_VERSION="1.18.1-candidate"')
          (dest/'coi-serviceworker.js').write_text(sw,encoding='utf-8')
          manifest=json.loads((root/'version-v118-test.json').read_text(encoding='utf-8'))
          manifest.update(version='1.18.1-candidate',mainJs=js,runtimeFiles=[js],rules=rules)
          (dest/'version-v118-test.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          assert js in (dest/'core.html').read_text(encoding='utf-8')
          assert js in (dest/'version-v118-test.json').read_text(encoding='utf-8')
          assert 'index-B81hyAdU-v118-final-candidate.js' in (root/'core.html').read_text(encoding='utf-8')
          print('PASS isolated 1.18.1 candidate; current formal v1.18 remains unchanged')
          PY

      - name: Promote verified v1.18.1 candidate to formal root
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('app')
          candidate=root/'candidate-v1181'
          for filename in ('core.html','index.html','coi-serviceworker.js','version-v118-test.json'):
              assert (candidate/filename).exists(),filename
          js='index-B81hyAdU-v1181-candidate.js'
          rules='recognition-rules-v1181.json'
          # Start from the exact candidate that passed real-device testing.
          core=(candidate/'core.html').read_text(encoding='utf-8')
          assert js in core and '1.18.1-candidate' in core
          core=core.replace('1.18.1-candidate','1.18.1')
          core=core.replace('mingpai-v1181-candidate-coi-reload','mingpai-v1181-formal-coi-reload')
          (root/'core.html').write_text(core,encoding='utf-8')

          wrapper=(candidate/'index.html').read_text(encoding='utf-8')
          wrapper=wrapper.replace('v1.18.1 候选版','v1.18.1 正式版')
          wrapper=wrapper.replace('1.18.1-candidate','1.18.1')
          wrapper=wrapper.replace('mingpai-v1181-candidate-manifest-version','mingpai-v1181-formal-manifest-version')
          wrapper=wrapper.replace('20261114-v1181-candidate','20261114-v1181-formal')
          (root/'index.html').write_text(wrapper,encoding='utf-8')

          sw=(candidate/'coi-serviceworker.js').read_text(encoding='utf-8')
          assert 'mingpai-shell-v1181-candidate' in sw
          sw=sw.replace('mingpai-shell-v1181-candidate','mingpai-shell-v1181-formal')
          sw=sw.replace('const APP_VERSION="1.18.1-candidate"','const APP_VERSION="1.18.1"')
          (root/'coi-serviceworker.js').write_text(sw,encoding='utf-8')

          manifest=json.loads((candidate/'version-v118-test.json').read_text(encoding='utf-8'))
          assert manifest['mainJs']==js and manifest['rules']==rules
          assert manifest['version']=='1.18.1-candidate'
          manifest['version']='1.18.1'
          (root/'version-v118-test.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          assert js in (root/'core.html').read_text(encoding='utf-8')
          assert js in (root/'version-v118-test.json').read_text(encoding='utf-8')
          assert '1.18.1-candidate' not in (root/'core.html').read_text(encoding='utf-8')
          assert '1.18.1-candidate' not in (root/'index.html').read_text(encoding='utf-8')
          assert 'mingpai-shell-v1181-formal' in (root/'coi-serviceworker.js').read_text(encoding='utf-8')
          assert 'v1.18.1 正式版' in (root/'index.html').read_text(encoding='utf-8')
          assert (root/'candidate-v1181'/'core.html').exists()
          print('PASS: v1.18.1 formal root uses tested candidate JS and rules; v1.18 rollback retained')
          PY

      - name: Verify v1.18.2 COS upload and deploy isolated test.1
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          import hashlib
          base='https://mingpai-ocr-1387910526.cos.ap-guangzhou.myqcloud.com/assets/'
          current='index-B81hyAdU-v1181-candidate.js'
          test='index-B81hyAdU-v1182-test1.js'
          for attempt in range(1,4):
              try:
                  old=urlopen(base+current,timeout=45).read()
                  break
              except Exception as error:
                  if attempt==3:raise
                  print('Retry COS production baseline download',attempt,str(error))
                  import time;time.sleep(attempt*2)
          assert len(old)>10_000_000
          Path(current).write_bytes(old)
          import time
          for attempt in range(1,4):
              try:
                  data=urlopen(base+test,timeout=45).read()
                  break
              except Exception as error:
                  if attempt==3:raise
                  print('Retry COS test file download',attempt,str(error))
                  time.sleep(attempt*2)
          sha=hashlib.sha256(data).hexdigest()
          assert sha=='8006f4b2509bfe7f424ecd2c9b1940794da2b653f7157e53135f5a21ff1de0da',(len(data),sha)
          print('PASS uploaded COS JS SHA256',sha,'bytes',len(data))
          PY
          python scripts/build-v1182-test.py
          python - <<'PY'
          from pathlib import Path
          import json
          dest=Path('app/test-adaptive')
          test_js='index-B81hyAdU-v1182-test1.js'
          core=(dest/'core.html').read_text(encoding='utf-8')
          assert 'index-B81hyAdU-v1181-candidate.js' in core
          core=core.replace('index-B81hyAdU-v1181-candidate.js',test_js)
          core=core.replace('1.18.1-test-baseline','1.18.2-test.1')
          core=core.replace('mingpai-v1181-test-baseline-coi-reload','mingpai-v1182-test1-coi-reload')
          (dest/'core.html').write_text(core,encoding='utf-8')
          page=Path('test-v1182-test1.html').read_text(encoding='utf-8')
          page=page.replace('./core.html?field=v12&rev=202611082322-v1534444-status',
                            './core.html?field=v12&rev=20261115-v1182-test1')
          page=page.replace('20261115-v1181-test-baseline','20261115-v1182-test1')
          page=page.replace('<title>设备铭牌智能识别与审核</title>',
                            '<title>设备铭牌识别｜v1.18.2 test.1</title>')
          (dest/'index.html').write_text(page,encoding='utf-8')
          sw=(dest/'coi-serviceworker.js').read_text(encoding='utf-8')
          assert 'mingpai-shell-v1181-test-baseline' in sw
          sw=sw.replace('mingpai-shell-v1181-test-baseline','mingpai-shell-v1182-test1')
          sw=sw.replace('1.18.1-test-baseline','1.18.2-test.1')
          (dest/'coi-serviceworker.js').write_text(sw,encoding='utf-8')
          manifest=json.loads((dest/'version-v118-test.json').read_text(encoding='utf-8'))
          manifest.update(version='1.18.2-test.1',mainJs=test_js,
                          runtimeFiles=[test_js],rules='recognition-rules-v1181.json')
          (dest/'version-v118-test.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          assert test_js in (dest/'core.html').read_text(encoding='utf-8')
          assert 'v1182-stats-table' in (dest/'index.html').read_text(encoding='utf-8')
          assert 'mingpai-shell-v1182-test1' in (dest/'coi-serviceworker.js').read_text(encoding='utf-8')
          assert 'index-B81hyAdU-v1181-candidate.js' in Path('app/core.html').read_text(encoding='utf-8')
          assert 'v1.18.1 正式版' in Path('app/index.html').read_text(encoding='utf-8')
          print('PASS isolated test.1 site and unmodified v1.18.1 formal entry')
          PY

      - name: Promote verified v1.18.2 test.2 to test-adaptive only
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          import hashlib,json,time
          base='https://mingpai-ocr-1387910526.cos.ap-guangzhou.myqcloud.com/assets/'
          name='index-B81hyAdU-v1182-test2.js'
          expected='76199c50a439b1f27fb6e6ad0dd48fea53f834a51b5d307366fa0aa94c9a4ebb'
          for attempt in range(1,4):
              try:
                  data=urlopen(base+name,timeout=60).read()
                  break
              except Exception as e:
                  if attempt==3: raise
                  print('COS retry',attempt,str(e))
                  time.sleep(attempt*2)
          actual=hashlib.sha256(data).hexdigest()
          assert actual==expected,(actual,len(data))
          print('PASS v1.18.2 test.2 uploaded SHA256',actual,len(data))
          test=Path('app/test-adaptive')
          core=(test/'core.html').read_text(encoding='utf-8')
          assert 'index-B81hyAdU-v1182-test1.js' in core
          core=core.replace('index-B81hyAdU-v1182-test1.js',name)
          core=core.replace('1.18.2-test.1','1.18.2-test.2')
          core=core.replace('mingpai-v1182-test1-coi-reload','mingpai-v1182-test2-coi-reload')
          # This label was inherited from the historical base HTML; runtime was
          # already upgraded. Fix footer text as well as the browser title.
          core=core.replace('版本：v1.17','版本：v1.18.2 test.2')
          core=core.replace('版本: v1.17','版本: v1.18.2 test.2')
          core=core.replace('v1.17','v1.18.2 test.2')
          assert 'v1.17' not in core, 'stale footer version remained'
          (test/'core.html').write_text(core,encoding='utf-8')
          page=(test/'index.html').read_text(encoding='utf-8')
          page=page.replace('v1.18.2 test.1','v1.18.2 test.2')
          page=page.replace('1.18.2-test.1','1.18.2-test.2')
          page=page.replace('20261115-v1182-test1','20261116-v1182-test2')
          (test/'index.html').write_text(page,encoding='utf-8')
          sw=(test/'coi-serviceworker.js').read_text(encoding='utf-8')
          assert 'mingpai-shell-v1182-test1' in sw
          sw=sw.replace('mingpai-shell-v1182-test1','mingpai-shell-v1182-test2')
          sw=sw.replace('1.18.2-test.1','1.18.2-test.2')
          (test/'coi-serviceworker.js').write_text(sw,encoding='utf-8')
          manifest=json.loads((test/'version-v118-test.json').read_text(encoding='utf-8'))
          assert manifest['mainJs']=='index-B81hyAdU-v1182-test1.js'
          manifest.update(version='1.18.2-test.2',mainJs=name,runtimeFiles=[name])
          (test/'version-v118-test.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\\n',encoding='utf-8')
          assert name in (test/'core.html').read_text(encoding='utf-8')
          assert name in (test/'version-v118-test.json').read_text(encoding='utf-8')
          assert 'v1182-stats-table' in (test/'index.html').read_text(encoding='utf-8')
          assert 'index-B81hyAdU-v1181-candidate.js' in Path('app/core.html').read_text(encoding='utf-8')
          assert 'v1.18.1 正式版' in Path('app/index.html').read_text(encoding='utf-8')
          print('PASS test.2 deployed in isolated test-adaptive; production v1.18.1 untouched')
          PY

      - name: Remove stale sync error card after confirmed successful sync (test.2.1)
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re,subprocess
          folder=Path('app/test-adaptive')
          p=folder/'index.html'
          s=p.read_text(encoding='utf-8')
          anchor="  const st=d.createElement('style');"
          assert s.count(anchor)==1
          hook=r"""
            // v1.18.2 test.2.1: status is already saved correctly, but an old error
            // block survives v11713PatchCard() until a full page redraw.
            const v118221List=d.getElementById('recordList');
            if(v118221List){
              let v118221Queued=false;
              const v118221Clean=()=>{
                v118221Queued=false;
                for(const card of v118221List.querySelectorAll('article.card')){
                  const status=card.querySelector('.cardtitle small');
                  if(!status||!/飞书\s*[:：]\s*已同步/.test(status.textContent||''))continue;
                  for(const note of card.querySelectorAll('.errornote')){
                    if(/^飞书同步失败\s*[:：]/.test((note.textContent||'').trim()))note.remove();
                  }
                }
              };
