name: Deploy Mingpai OCR (v1.18.7 formal and v1.19.0 test.3.1)

# v1.18.6: publish one pinned, user-verified stable baseline; retain v1.18.5 branch for rollback.
# When publishing future changes, create a NEW reviewed baseline branch and
# update PINNED_COMMIT only after the candidate has passed device tests.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-paddleocr.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release workflow
        uses: actions/checkout@v4

      - name: Restore verified v1.18.6 site (no old version build steps)
        env:
          PINNED_COMMIT: 4a1a352501a22b1eabfae5363297a6a5b08d353c
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/release-baseline/v1186-verified:refs/remotes/origin/release-baseline/v1186-verified
          CURRENT="$(git rev-parse refs/remotes/origin/release-baseline/v1186-verified)"
          test "$CURRENT" = "$PINNED_COMMIT" || { echo "Baseline branch moved unexpectedly"; exit 1; }
          mkdir -p app
          git archive "$CURRENT":site-baseline | tar -xf - -C app

      - name: Verify stable release, rules and user-approved native review UI
        run: |
          python - <<'PY'
          import json,hashlib,re,subprocess
          from pathlib import Path
          root=Path('app')
          # The pinned commit fixes all HTML/JS content; hash the shared rules as a
          # second integrity check rather than retaining obsolete v1.18.5 shell hashes.
          expected={'recognition-rules-v1184.json':'b1b7b9710d9fdbbecd889566efde85b92f662c9d'}
          for name,sha in expected.items():
            data=(root/name).read_bytes()
            got=hashlib.sha1(('blob '+str(len(data))+'\0').encode()+data).hexdigest()
            assert got==sha,(name,got,sha)
          formal=json.loads((root/'version-v118-test.json').read_text())
          test=json.loads((root/'test-adaptive/version-v118-test.json').read_text())
          assert formal['version']=='1.18.6' and test['version']=='1.18.6-test.1'
          assert formal['mainJs']==test['mainJs']=='index-B81hyAdU-v1186-test1-qqgpu-thumbfix.js'
          assert formal['rules']==test['rules']=='recognition-rules-v1184.json'
          assert len(json.loads((root/'recognition-rules-v1184.json').read_text())['rules'])==92
          for entry in ('','test-adaptive/'):
            outer=(root/entry/'index.html').read_text()
            core=(root/entry/'core.html').read_text()
            worker=(root/entry/'coi-serviceworker.js').read_text()
            assert "nativeChange('temperature',temp)" in outer and "nativeChange('humidity',hum)" in outer
            assert 'view?.location?.reload()' not in outer
            assert 'v11841-modal-back' in outer
            assert 'dockModalSelectors' in outer and 'trulyOpen' in outer
            assert 'v11845-stats-unit-label' in outer
            assert 'pendingConfirmRefreshBound' in outer
            assert 'const confirmed=/已确认/' in outer
            assert 'const addedRiskCards=new Set()' in outer
            assert 'const addedEnvCards=new Set()' in outer
            assert 'mingpai-startup-diagnostics-v1182' not in outer
            assert 'mingpai-optin-boot-diagnosis' not in outer
            assert "pendingStatusSelect.dispatchEvent(new Event('change',{bubbles:true}))" in outer
            if not entry:
              assert 'scheduleHiddenDockRecovery' in outer
            assert "attributeFilter:['hidden','style','class','aria-hidden']" in outer
            assert 'recognition-rules-v1184.json' in core
            # Excel data detail layout: exact 13 columns, fixed one-line rows.
            assert 'width="20.44140625"' in outer
            assert 'width="33.6640625"' in outer
            assert 'width="8.88671875"' in outer
            assert 'wrapText="0"' in outer
            assert 'const ht=summary?Math.min(75,Math.max(26,24+Math.floor(maxLen/18)*15)):19.2;' in outer
            assert 'v1186-direct-image-save' in core
            assert 'v1186QqProtected' in core
            assert 'setTimeout(reload,1300)' not in core
            assert formal['mainJs'] in core
            assert 'if(resumedController?.scriptURL?.includes' in core
            assert 'const CLIENT_VERSION="1.18.6' in outer
            assert formal['mainJs'] in worker or formal['mainJs'] in core
            for label,source in (('outer',outer),('core',core)):
              for i,js in enumerate(re.findall(r'<script[^>]*>(.*?)</script>',source,re.I|re.S)):
                if js.strip():
                  f=Path('/tmp')/('mingpai-release-'+entry.replace('/','-')+label+str(i)+'.js')
                  f.write_text(js)
                  subprocess.run(['node','--check',str(f)],check=True)
            f=Path('/tmp')/('mingpai-release-'+entry.replace('/','-')+'sw.js')
            f.write_text(worker)
            subprocess.run(['node','--check',str(f)],check=True)
          print('PASS pinned v1.18.6 Pages release, rules, JS syntax; formal/test isolated')
          PY

      - name: Publish sole photo-quality test from exact formal baseline
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,shutil,subprocess,hashlib
          from pathlib import Path
          root=Path('app')
          dest=root/'test-photoquality'
          dest.mkdir()
          # Archive all historic branches in Git; publish only the current
          # formal shell and a single experimental candidate, not old previews.
          formal_files=('index.html','core.html','coi-serviceworker.js','version-v118-test.json','recognition-rules-v1184.json','recognition-rules-v1183.json')
          before={name:(root/name).read_bytes() for name in formal_files}
          for name in formal_files:
              shutil.copy2(root/name,dest/name)
          old='index-B81hyAdU-v1186-test1-qqgpu-thumbfix.js'
          new='index-B81hyAdU-v1187-photoquality-test4-queuefix.js'
          version='1.18.7-test.4'
          old_rev='1.18.6-test.1-qqgpu-thumbfix'
          new_rev=version+'-queuefix-r5'
          def replace_one(s,a,b):
              assert s.count(a)==1,(a,s.count(a))
              return s.replace(a,b)
          def edit_exact(name,changes):
              original=before[name].decode()
              s=original
              for a,b in changes:
                  s=replace_one(s,a,b)
              (dest/name).write_text(s,encoding='utf-8')
              # Reverse the explicitly allowed substitutions to demonstrate
              # that no other UI, business logic or SW algorithm has changed.
              for a,b in reversed(changes):
                  s=replace_one(s,b,a)
              assert s==original,name
          p=dest/'core.html'
          original=before['core.html'].decode()
          assert original.count(old)==2 and original.count(old_rev)==4
          s=original.replace(old,new).replace(old_rev,new_rev)
          s=replace_one(s,'版本：v1.18.6 正式版','版本：v'+version+' 图片质量专项测试版')
          s=replace_one(s,"const FLAG='mingpai-v1186-formal-coi-reload'","const FLAG='mingpai-photoquality-coi-reload'")
          p.write_text(s,encoding='utf-8')
          assert s.replace(new,old).replace(new_rev,old_rev).replace('版本：v'+version+' 图片质量专项测试版','版本：v1.18.6 正式版').replace("const FLAG='mingpai-photoquality-coi-reload'","const FLAG='mingpai-v1186-formal-coi-reload'")==original
          p=dest/'index.html'
          original=before['index.html'].decode()
          changes=[
              ('<title>设备铭牌识别｜v1.18.6 正式版</title>','<title>设备铭牌识别｜v'+version+' 图片质量专项测试版</title>'),
              ('const CLIENT_VERSION="1.18.6";','const CLIENT_VERSION="'+version+'";'),
              ("const ATTEMPT_PREFIX='mingpai-open-upgrade-'","const ATTEMPT_PREFIX='mingpai-photoquality-open-upgrade-'"),
          ]
          s=original
          for a,b in changes:s=replace_one(s,a,b)
          s=s.replace('mingpai-v118-manifest-version','mingpai-photoquality-manifest-version')
          p.write_text(s,encoding='utf-8')
          check=s.replace('mingpai-photoquality-manifest-version','mingpai-v118-manifest-version')
          for a,b in reversed(changes):check=replace_one(check,b,a)
          assert check==original
          # test.3 runtime no longer produces a reverse-confirm action.
          # Remove only the now redundant shell-side hiding logic.
          s=replace_one(s,'  #recordList button.v118-hide-unconfirm{display:none!important}\n','')
          s=replace_one(s,'      // 已确认记录不再显示“取消确认”\n      updateConfirmButtons(card);\n','')
          start=s.index('  // Hide only the native reverse-confirm action')
          end=s.index('  const addedEnvCards=new Set();',start)
          s=s[:start]+s[end:]
          s=replace_one(s,'      const target=mutation.target.nodeType===1?mutation.target:mutation.target.parentElement;\n      updateConfirmButton(target?.closest(\'button[data-action="toggle"]\'));\n','')
          s=replace_one(s,'        updateConfirmButtons(node);\n','')
          s=replace_one(s,'  if(list){\n    updateConfirmButtons(list);\n    cardsObserver.observe(list,{childList:true,subtree:true,characterData:true});\n  }','  if(list)cardsObserver.observe(list,{childList:true,subtree:true});')
          assert 'updateConfirmButton' not in s and 'v118-hide-unconfirm' not in s
          # Bind Done to the four dynamically created environment inputs.
          for anchor,inputs in [
              ("      inline.querySelectorAll('input').forEach(inp=>{",None),
              ("          ti.addEventListener('blur',persist);hi.addEventListener('blur',persist);",None),
          ]:
              assert s.count(anchor)==1
          s=replace_one(s,"      inline.querySelectorAll('input').forEach(inp=>{","      inline.querySelectorAll('input').forEach(inp=>{\n        inp.setAttribute('enterkeyhint','done');\n        inp.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key==='NumpadEnter')&&!e.isComposing&&e.keyCode!==229){e.preventDefault();inp.blur();}});")
          s=replace_one(s,"          ti.addEventListener('blur',persist);hi.addEventListener('blur',persist);","          [ti,hi].forEach(inp=>{inp.setAttribute('enterkeyhint','done');inp.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key==='NumpadEnter')&&!e.isComposing&&e.keyCode!==229){e.preventDefault();inp.blur();}});});\n          ti.addEventListener('blur',persist);hi.addEventListener('blur',persist);")
          p.write_text(s,encoding='utf-8')
          edit_exact('coi-serviceworker.js',[
              ('const APP_VERSION="1.18.6";','const APP_VERSION="'+version+'";'),
              ('mingpai-shell-v1186-formal-qqgpu-thumbfix','mingpai-shell-v1187-test4-queuefix-r5'),
          ])
          p=dest/'version-v118-test.json'
          m=json.loads(p.read_text())
          m.update(version=version,mainJs=new,runtimeFiles=[new],publishedAt='2026-11-27')
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          assert m['rules']=='recognition-rules-v1184.json'
          assert (dest/m['rules']).read_bytes()==before[m['rules']]
          outer=(dest/'index.html').read_text()
          core=(dest/'core.html').read_text()
          assert 'scheduleHiddenDockRecovery' in outer
          assert 'bindLiveSyncStatus' in outer and 'v1186-sync-status-fix' in outer
          assert 'wrapText="0"' in outer and 'width="20.44140625"' in outer
          assert 'v1186-direct-image-save' in core and 'v1186QqProtected' in core
          assert 'v1187-raw-collapse-test' not in core and 'v1187-card-compact-test' not in core
          assert 'setTimeout(reload,1300)' not in core
          assert new in core and old not in core
          for name in ('index.html','core.html'):
              source=(dest/name).read_text()
              for i,js in enumerate(re.findall(r'<script[^>]*>(.*?)</script>',source,re.I|re.S)):
                  if js.strip():
                      f=Path('/tmp')/('mingpai-photoquality-'+name+str(i)+'.js')
                      f.write_text(js)
                      subprocess.run(['node','--check',str(f)],check=True)
          subprocess.run(['node','--check',str(dest/'coi-serviceworker.js')],check=True)
          # Only remove historical routes from the generated artifact, never
          # from Git history, browser data, COS or the pinned baseline itself.
          for child in root.iterdir():
              if child.is_dir() and child!=dest:
                  shutil.rmtree(child)
          (root/'paddle-performance-test.html').unlink(missing_ok=True)
          assert {p.name for p in root.iterdir() if p.is_dir()}=={dest.name}
          for name,data in before.items():
              assert (root/name).read_bytes()==data,name
          # Shared rule-only update, independent of the formal runtime version.
          pack=json.loads(before['recognition-rules-v1184.json'])
          assert pack['rulesVersion']=='v1.18.4-20261127-r12'
          serial=r'(?:\(21\)\s*|\bSN\s*[:：]?\s*)([A-Z0-9]{6,20})\b'
          explicit=r'\bM\s*Series\b'
          fallback=r'^(?![\s\S]*\b(?:R|X|E|C|Z)\s*Series\b)(?=[\s\S]*\bSeries\b)(?=[\s\S]*\(21\)\s*T\d{2}[A-L]\d{6}\b)[\s\S]*$'
          rules=[
              dict(id='user-20261127-zoll-m-series',priority=16005,match=dict(containsAll=['ZOLL'],regex=explicit),set=dict(name='心脏除颤器',manufacturer='ZOLL Medical Corporation',model='M Series'),extract=dict(codeRegex=serial,codeFlags='i'),stop=True,note='明确M Series型号，动态提取SN或UDI(21)'),
              dict(id='user-20261127-zoll-m-series-logo-ocr',priority=16004,match=dict(containsAll=['ZOLL Medical Corporation','269 Mill Road','Series'],regex=fallback),set=dict(name='心脏除颤器',manufacturer='ZOLL Medical Corporation',model='M Series'),extract=dict(codeRegex=serial,codeFlags='i'),stop=True,note='现场样本M标志漏识别；仅匹配地址、Series及观察到的T系列编号结构；待更多样本验证，不固定序列号'),
          ]
          sample='ZOLL\nSN\n(21) T19K142317\nSeries®\nZOLL Medical Corporation\n269 Mill Road'
          assert re.search(fallback,sample,re.I)
          assert re.search(serial,sample,re.I).group(1)=='T19K142317'
          assert not re.search(fallback,sample.replace('Series®','R Series'),re.I)
          assert not re.search(fallback,sample.replace('T19K142317','AF19K142317'),re.I)
          assert re.search(explicit,'ZOLL MSeries',re.I)
          pack['rules']=rules+pack['rules']
          pack['rulesVersion']='v1.18.4-20261127-r14'
          pack['updatedAt']='2026-11-27'
          assert len(pack['rules'])==94
          payload=json.dumps(pack,ensure_ascii=False,indent=2)+'\n'
          for folder in (root,dest):
              (folder/'recognition-rules-v1184.json').write_text(payload,encoding='utf-8')
          # Promote the exact user-tested candidate, keeping the old pinned
          # baseline and the test route available for rollback and comparison.
          for name in ('index.html','core.html','coi-serviceworker.js'):
              promoted=(dest/name).read_text()
              promoted=promoted.replace('1.18.7-test.4','1.18.7')
              promoted=promoted.replace('图片质量专项测试版','正式版')
              promoted=promoted.replace('mingpai-photoquality-manifest-version','mingpai-v118-manifest-version')
              promoted=promoted.replace('mingpai-photoquality-open-upgrade-','mingpai-open-upgrade-')
              promoted=promoted.replace('mingpai-photoquality-coi-reload','mingpai-v1187-formal-coi-reload')
              promoted=promoted.replace('mingpai-shell-v1187-test4-queuefix-r5','mingpai-shell-v1187-formal-queuefix-r5')
              assert '1.18.7-test.4' not in promoted
              (root/name).write_text(promoted,encoding='utf-8')
              scripts=[promoted] if name.endswith('.js') else re.findall(r'<script[^>]*>(.*?)</script>',promoted,re.I|re.S)
              for i,js in enumerate(scripts):
                  if js.strip():
                      f=Path('/tmp')/('mingpai-promoted-'+name+str(i)+'.js')
                      f.write_text(js)
                      subprocess.run(['node','--check',str(f)],check=True)
          formal_manifest=json.loads((dest/'version-v118-test.json').read_text())
          formal_manifest['version']='1.18.7'
          (root/'version-v118-test.json').write_text(json.dumps(formal_manifest,ensure_ascii=False,indent=2)+chr(10),encoding='utf-8')
          assert new in (root/'core.html').read_text()
          assert old not in (root/'core.html').read_text()
          assert 'const CLIENT_VERSION="1.18.7";' in (root/'index.html').read_text()
          assert 'const APP_VERSION="1.18.7";' in (root/'coi-serviceworker.js').read_text()
          assert (root/'recognition-rules-v1184.json').read_bytes()==(dest/'recognition-rules-v1184.json').read_bytes()
          print('PASS v1.18.7 formal promoted from verified test.4; rollback baseline retained; shared r14')
          PY

      - name: Isolate v1.19.0 card attributes candidate from stable formal release
        run: |
          python - <<'PY'
          import json,re,subprocess,hashlib
          from pathlib import Path
          root=Path('app')
          dest=root/'test-photoquality'
          stable={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in root.iterdir() if p.is_file()}
          old='index-B81hyAdU-v1187-photoquality-test4-queuefix.js'
          new='index-B81hyAdU-v1190-cardattrs-test3.1.js'
          for name in ('index.html','core.html','coi-serviceworker.js'):
              p=dest/name
              s=p.read_text()
              s=s.replace(old,new).replace('1.18.7-test.4-queuefix-r5','1.19.0-test.3.1-cardattrs-r31').replace('1.18.7-test.4','1.19.0-test.3.1')
              s=s.replace('图片质量专项测试版','设备信息优化测试版').replace('mingpai-shell-v1187-test4-queuefix-r5','mingpai-shell-v1190-test31-cardattrs-r31')
              assert '1.18.7-test.4' not in s
              p.write_text(s,encoding='utf-8')
              scripts=[s] if name.endswith('.js') else re.findall(r'<script[^>]*>(.*?)</script>',s,re.I|re.S)
              for i,js in enumerate(scripts):
                  if js.strip():
                      f=Path('/tmp')/('mingpai-v1190-'+name+str(i)+'.js')
                      f.write_text(js)
                      subprocess.run(['node','--check',str(f)],check=True)
          p=dest/'version-v118-test.json'
          m=json.loads(p.read_text())
          m.update(version='1.19.0-test.3.1',mainJs=new,runtimeFiles=[new],publishedAt='2026-11-28')
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+chr(10),encoding='utf-8')
          assert new in (dest/'core.html').read_text()
          assert old not in (dest/'core.html').read_text()
          assert 'const CLIENT_VERSION="1.19.0-test.3.1";' in (dest/'index.html').read_text()
          assert 'const APP_VERSION="1.19.0-test.3.1";' in (dest/'coi-serviceworker.js').read_text()
          assert stable=={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in root.iterdir() if p.is_file()}
          print('PASS v1.19.0-test.3.1 candidate; formal v1.18.7 unchanged byte for byte')
          PY

      - name: Upload verified site
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
