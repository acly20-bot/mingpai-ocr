name: Deploy PaddleOCR Mingpai to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'github-pages-cos-models.zip'
      - '.github/workflows/deploy-paddleocr.yml'
      - 'test-v153444/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Extract stable site
        run: |
          mkdir -p app
          unzip -oq github-pages-cos-models.zip -d app

      - name: Promote v1.16.1 to stable root
        run: |
          # Keep the original stable shell as core.html, then point it to the new COS bundle.
          cp app/index.html app/core.html
          sed -i 's/index-B81hyAdU-v153441.js/index-B81hyAdU-v153445.js/g' app/core.html
          sed -i 's/1\.153\.4\.4\.1/1.16/g' app/core.html
          sed -i 's/mingpai-stable15344-coi-reload/mingpai-stable1161-coi-reload/g' app/core.html

          # Reuse the fully validated V12 wrapper as the formal root UI.
          cp test-v153444/index.html app/index.html
          python - <<'PY'
          from pathlib import Path
          p=Path('app/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('./core.html?field=v12&rev=202611082322-v1534444-status',
                      './core.html?field=v12&rev=202611090235-v1161-stable')
          s=s.replace('v1.153.4.4.4.4-test','v1.16.1')
          s=s.replace('v1.153.4.4.4.3-test','v1.16.1')
          s=s.replace('v1.153.4.4.4.2-test','v1.16.1')
          s=s.replace('v1.153.4.4.4.1-test','v1.16.1')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Build v153443 V12 independent test entry
        run: |
          mkdir -p app/test-v153443

          # Stable core logic, but use the COS test bundle.
          cp app/index.html app/test-v153443/core.html
          cp app/coi-serviceworker.js app/test-v153443/coi-serviceworker.js
          sed -i 's/index-B81hyAdU-v153441.js/index-B81hyAdU-v153443-test.js/g' app/test-v153443/core.html
          sed -i 's/1\.153\.4\.4\.1/1.153.4.4.3-test/g' app/test-v153443/core.html
          sed -i 's/mingpai-stable15344-coi-reload/mingpai-v153443-test-coi-reload/g' app/test-v153443/core.html

          # Reuse the already validated V12 UI wrapper with the final three UI tweaks.
          git show 0d085b44a426a403ffc9eb1b528921b3914a51f3:stable-release/v1.153.4.4.2/index.html > app/test-v153443/index.html

          # Fix mobile dynamic viewport so the bottom dock / preview controls remain visible.
          python - <<'PY'
          from pathlib import Path
          p=Path('app/test-v153443/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace(
              'iframe{display:block;width:100%;height:100vh;border:0;background:#fff}',
              'html,body{overflow:hidden}iframe{display:block;width:100%;height:100vh;height:100dvh;border:0;background:#fff}'
          )
          s=s.replace('rev=202611081130','rev=202611081437-v153443-test')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Add v153444 full test entry
        run: |
          if [ -d test-v153444 ]; then
            cp -R test-v153444 app/test-v153444
            cp app/index.html app/test-v153444/core.html
            cp app/coi-serviceworker.js app/test-v153444/coi-serviceworker.js
            sed -i 's/index-B81hyAdU-v153441.js/index-B81hyAdU-v1534441-test.js/g' app/test-v153444/core.html
            sed -i 's/1\.153\.4\.4\.1/1.153.4.4.4.1-test/g' app/test-v153444/core.html
            sed -i 's/mingpai-stable15344-coi-reload/mingpai-v1534441-test-coi-reload/g' app/test-v153444/core.html
          fi

      - name: Enable offline app-shell recovery for v1.16.1
        run: |
          cat > app/coi-serviceworker.js <<'SW'
          const VERSION="1.16.1";
          const RUNTIME_CACHE="mingpai-runtime-v1161";
          const SHELL_CACHE="mingpai-shell-v1161";
          const COS_RUNTIME="https://mingpai-ocr-1387910526.cos.ap-guangzhou.myqcloud.com/assets/";
          const scopeUrl=new URL(self.registration.scope);
          const runtimePrefix=new URL("./runtime/",scopeUrl).pathname;

          function isolate(resp){
            if(!resp||resp.type==="opaque")return resp;
            const h=new Headers(resp.headers);
            h.set("Cross-Origin-Opener-Policy","same-origin");
            h.set("Cross-Origin-Embedder-Policy","credentialless");
            h.delete("Content-Disposition");
            return new Response(resp.body,{status:resp.status,statusText:resp.statusText,headers:h});
          }
          function ctype(path,h){
            if(path.endsWith(".js"))h.set("Content-Type","application/javascript; charset=utf-8");
            else if(path.endsWith(".wasm"))h.set("Content-Type","application/wasm");
          }
          async function runtime(req,url){
            const rel=url.pathname.slice(runtimePrefix.length);
            const target=new URL(rel,COS_RUNTIME);
            const cache=await caches.open(RUNTIME_CACHE);
            const hit=await cache.match(req,{ignoreSearch:true});
            if(hit)return isolate(hit);
            const up=await fetch(target,{mode:"cors",credentials:"omit",cache:"default"});
            if(!up.ok)throw new Error(`COS ${up.status}`);
            const h=new Headers(up.headers);
            ctype(rel,h);
            h.delete("Content-Disposition");
            h.set("Cross-Origin-Opener-Policy","same-origin");
            h.set("Cross-Origin-Embedder-Policy","credentialless");
            h.set("Cross-Origin-Resource-Policy","same-origin");
            const clean=new Response(up.body,{status:up.status,statusText:up.statusText,headers:h});
            try{await cache.put(req,clean.clone())}catch{}
            return clean;
          }
          async function sameOrigin(req){
            const cache=await caches.open(SHELL_CACHE);
            try{
              const net=await fetch(req);
              if(req.method==="GET"&&net&&net.ok){
                try{await cache.put(req,net.clone())}catch{}
              }
              return isolate(net);
            }catch(err){
              const hit=await cache.match(req,{ignoreSearch:true});
              if(hit)return isolate(hit);
              if(req.mode==="navigate"){
                const root=await cache.match("./index.html",{ignoreSearch:true})||await cache.match("./",{ignoreSearch:true});
                if(root)return isolate(root);
              }
              throw err;
            }
          }

          self.addEventListener("install",e=>e.waitUntil((async()=>{
            const cache=await caches.open(SHELL_CACHE);
            for(const p of ["./","./index.html","./core.html"]){
              try{const r=await fetch(p,{cache:"reload"});if(r.ok)await cache.put(p,r.clone())}catch{}
            }
            await self.skipWaiting();
          })()));

          self.addEventListener("activate",e=>e.waitUntil((async()=>{
            for(const k of await caches.keys()){
              if((k.startsWith("mingpai-runtime-")&&k!==RUNTIME_CACHE)||(k.startsWith("mingpai-shell-")&&k!==SHELL_CACHE))await caches.delete(k);
            }
            await self.clients.claim();
          })()));

          self.addEventListener("fetch",e=>{
            const req=e.request,url=new URL(req.url);
            if(req.cache==="only-if-cached"&&req.mode!=="same-origin")return;
            if(url.origin===scopeUrl.origin&&url.pathname.startsWith(runtimePrefix)){
              e.respondWith(runtime(req,url).catch(err=>new Response("runtime proxy failed: "+err.message,{status:502,headers:{"Content-Type":"text/plain; charset=utf-8","Cross-Origin-Opener-Policy":"same-origin","Cross-Origin-Embedder-Policy":"credentialless"}})));
              return;
            }
            if(url.origin===scopeUrl.origin){
              e.respondWith(sameOrigin(req));
            }
          });
          SW

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
