name: Deploy PaddleOCR Mingpai to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'github-pages-cos-models.zip'
      - '.github/workflows/deploy-paddleocr.yml'
      - 'stable-wrapper/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Extract stable site
        run: |
          mkdir -p app
          unzip -oq github-pages-cos-models.zip -d app

      - name: Promote v1.17 to stable root
        run: |
          # Keep the original stable shell as core.html, then point it to the current formal COS bundle.
          cp app/index.html app/core.html
          sed -i 's/index-B81hyAdU-v153441.js/index-B81hyAdU-v117-final.js/g' app/core.html
          sed -i 's/1\.153\.4\.4\.1/1.17/g' app/core.html
          sed -i 's/mingpai-stable15344-coi-reload/mingpai-stable117-coi-reload/g' app/core.html

          # Formal root keeps the validated stable wrapper.
          cp stable-wrapper/index.html app/index.html
          python - <<'PY'
          from pathlib import Path
          p=Path('app/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('./core.html?field=v12&rev=202611082322-v1534444-status',
                      './core.html?field=v12&rev=202611100155-v117-stable')
          s=s.replace('v1.153.4.4.4.4-test','v1.17')
          s=s.replace('v1.153.4.4.4.3-test','v1.17')
          s=s.replace('v1.153.4.4.4.2-test','v1.17')
          s=s.replace('v1.153.4.4.4.1-test','v1.17')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Build v1.18 test.3.2.4 entry
        run: |
          mkdir -p app/test-adaptive
          cp app/core.html app/test-adaptive/core.html
          cp stable-wrapper/test-v118-test3.html app/test-adaptive/index.html
          cp stable-wrapper/coi-serviceworker-v118-test.js app/test-adaptive/coi-serviceworker.js
          cp stable-wrapper/version-v118-test.json app/test-adaptive/version-v118-test.json

          # Test entry only: point to the v1.18 COS test bundle.
          sed -i 's/index-B81hyAdU-v117-final.js/index-B81hyAdU-v118-test324.js/g' app/test-adaptive/core.html
          sed -i 's/1\.17/1.18-test.3.2.4/g' app/test-adaptive/core.html
          sed -i 's/mingpai-stable117-coi-reload/mingpai-v118-test324-coi-reload/g' app/test-adaptive/core.html

          python - <<'PY'
          from pathlib import Path
          p=Path('app/test-adaptive/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('./core.html?field=v12&rev=202611082322-v1534444-status',
                      './core.html?field=v12&rev=202611131130-v118-test324')
          s=s.replace('<title>设备铭牌智能识别与审核</title>',
                      '<title>设备铭牌识别｜v1.18 test.3.2.4</title>')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Build and self-test v1.18 test.3.2.5 COS bundle
        run: |
          python - <<'PY'
          import urllib.request,pathlib,zipfile,hashlib,subprocess
          src='https://mingpai-ocr-1387910526.cos.ap-guangzhou.myqcloud.com/assets/index-B81hyAdU-v118-test324.js'
          data=urllib.request.urlopen(src,timeout=90).read().decode('utf-8')
          def rep(old,new,label,count=1):
              global data
              n=data.count(old)
              if n!=count: raise SystemExit(f'PATCH COUNT {label}: expected {count}, got {n}')
              data=data.replace(old,new)
              print('PATCH',label,n)

          rep('photoQueueV9.push({file:N,record:i,mode:U,label:h,queuedAt:Date.now(),focusRecordTop:h==="重拍照片"})',
              'photoQueueV9.push({file:N,record:i,mode:U,label:h,queuedAt:Date.now(),focusRecordTop:h==="重拍照片"||/重识别|重新识别/.test(String(h||""))})',
              'retry-focus-flag')

          rep('d.onload=()=>{render(),U.hidden=!1,h.onpointerdown=',
              'd.onload=()=>{render(),h.onpointerdown=',
              'crop-delay-show')
          rep('c("cropCancel").onclick=()=>{FA(),N(null)}}},d.onerror=',
              'c("cropCancel").onclick=()=>{FA(),N(null)}}U.hidden=!1},d.onerror=',
              'crop-show-after-layout')
          data=data.replace('data-crop-action="close">关闭</button>','data-crop-action="close">取消</button>')

          old='let v118StatusTimer=null;function v118StatusEl(){let e=document.getElementById("v118FloatingProgress");if(!e){e=document.createElement("div");e.id="v118FloatingProgress";e.style.cssText="position:fixed;top:calc(env(safe-area-inset-top) + 60px);left:10px;right:10px;transform:none;z-index:99990;width:auto;max-width:none;box-sizing:border-box;padding:5px 8px;border-radius:7px;background:rgba(0,109,91,.84);color:#fff;font-size:11.5px;line-height:1.3;font-weight:650;box-shadow:0 5px 18px rgba(0,0,0,.18);pointer-events:none;display:none;white-space:pre-wrap";document.body.appendChild(e)}return e}function UA(i){const p=c("progress");if(p){p.textContent="";p.style.display="none"}const e=v118StatusEl(),m=String(i||"").trim();if(v118StatusTimer){clearTimeout(v118StatusTimer);v118StatusTimer=null}e.textContent=m;e.style.display=m?"block":"none"}'
          new='let v118StatusTimer=null;function v118StatusEl(){let e=document.getElementById("v118FloatingProgress");if(!e){e=document.createElement("div");e.id="v118FloatingProgress";e.style.cssText="position:fixed;left:10px;right:10px;transform:none;z-index:99990;width:auto;max-width:none;box-sizing:border-box;padding:3px 7px;border-radius:6px;background:rgba(0,109,91,.82);color:#fff;font-size:10.5px;line-height:1.2;font-weight:650;box-shadow:0 2px 8px rgba(0,0,0,.12);pointer-events:none;display:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis";document.body.appendChild(e)}return e}function v118PlaceStatus(e){try{const h=document.querySelector(".brand-header");if(h){const r=h.getBoundingClientRect(),eh=Math.max(20,e.offsetHeight||20);e.style.top=Math.max(2,Math.round(r.bottom-eh-3))+"px";return}}catch{}e.style.top="48px"}function UA(i){const p=c("progress");if(p){p.textContent="";p.style.display="none"}const e=v118StatusEl(),m=String(i||"").trim();if(v118StatusTimer){clearTimeout(v118StatusTimer);v118StatusTimer=null}e.textContent=m;e.style.display=m?"block":"none";m&&requestAnimationFrame(()=>v118PlaceStatus(e))}'
          rep(old,new,'status-dynamic-header')

          checks={
            'retry-focus':'/重识别|重新识别/.test(String(h||""))' in data,
            'crop-hidden-before-final-layout':'d.onload=()=>{render(),U.hidden=!1' not in data and '}}U.hidden=!1},d.onerror=' in data,
            'status-uses-header': 'document.querySelector(".brand-header")' in data and 'r.bottom-eh-3' in data,
            'old-status-position-removed':'safe-area-inset-top) + 60px' not in data,
          }
          for k,v in checks.items(): print('SELFTEST',k,'PASS' if v else 'FAIL')
          if not all(checks.values()): raise SystemExit('SELFTEST FAILED')

          out=pathlib.Path('index-B81hyAdU-v118-test325.js')
          out.write_text(data,encoding='utf-8')
          subprocess.run(['node','--check',str(out)],check=True)
          print('SHA256',hashlib.sha256(out.read_bytes()).hexdigest())
          with zipfile.ZipFile('mingpai-v1.18-test.3.2.5-COS.zip','w',zipfile.ZIP_DEFLATED) as z:
              z.write(out,out.name)
              z.writestr('README.txt','v1.18 test.3.2.5\nSelf-tested fixes: all re-recognition queue entries get final card-top focus; crop modal is revealed only after final action layout; floating status uses actual brand-header geometry.\n')
          PY

      - name: Upload v1.18 test.3.2.5 COS bundle
        uses: actions/upload-artifact@v4
        with:
          name: mingpai-v1.18-test.3.2.5-COS
          path: mingpai-v1.18-test.3.2.5-COS.zip
          retention-days: 7
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
