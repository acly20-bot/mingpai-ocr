name: Deploy PaddleOCR Mingpai to GitHub Pages
# Deployment artifact retry: fresh workflow run avoids duplicate github-pages artifacts.

on:
  push:
    branches: [main]
    paths:
      - 'github-pages-cos-models.zip'
      - '.github/workflows/deploy-paddleocr.yml'
      - 'stable-wrapper/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Extract stable site
        run: |
          mkdir -p app
          unzip -oq github-pages-cos-models.zip -d app

      - name: Promote v1.17 to stable root
        run: |
          # Keep the original stable shell as core.html, then point it to the current formal COS bundle.
          cp app/index.html app/core.html
          sed -i 's/index-B81hyAdU-v153441.js/index-B81hyAdU-v117-final.js/g' app/core.html
          sed -i 's/1\.153\.4\.4\.1/1.17/g' app/core.html
          sed -i 's/mingpai-stable15344-coi-reload/mingpai-stable117-coi-reload/g' app/core.html

          # Formal root keeps the validated stable wrapper.
          cp stable-wrapper/index.html app/index.html
          python - <<'PY'
          from pathlib import Path
          p=Path('app/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('./core.html?field=v12&rev=202611082322-v1534444-status',
                      './core.html?field=v12&rev=202611100155-v117-stable')
          s=s.replace('v1.153.4.4.4.4-test','v1.17')
          s=s.replace('v1.153.4.4.4.3-test','v1.17')
          s=s.replace('v1.153.4.4.4.2-test','v1.17')
          s=s.replace('v1.153.4.4.4.1-test','v1.17')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Build v1.18 test.3.2.9 entry
        run: |
          mkdir -p app/test-adaptive
          cp app/core.html app/test-adaptive/core.html
          cp stable-wrapper/test-v118-test3.html app/test-adaptive/index.html
          cp stable-wrapper/coi-serviceworker-v118-test.js app/test-adaptive/coi-serviceworker.js
          cp stable-wrapper/version-v118-test.json app/test-adaptive/version-v118-test.json

          # Test entry only: point to the v1.18 COS test bundle.
          sed -i 's/index-B81hyAdU-v117-final.js/index-B81hyAdU-v118-test326.js/g' app/test-adaptive/core.html
          sed -i 's/1\.17/1.18-test.3.2.9/g' app/test-adaptive/core.html
          sed -i 's/mingpai-stable117-coi-reload/mingpai-v118-test326-coi-reload/g' app/test-adaptive/core.html

          python - <<'PY'
          from pathlib import Path
          p=Path('app/test-adaptive/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('./core.html?field=v12&rev=202611082322-v1534444-status',
                      './core.html?field=v12&rev=202611132020-v118-test329')
          s=s.replace('<title>设备铭牌智能识别与审核</title>',
                      '<title>设备铭牌识别｜v1.18 test.3.2.9</title>')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Verify uploaded COS candidate and build isolated v1.18 candidate site
        run: |
          python - <<'PY'
          from pathlib import Path
          import urllib.request,json
          name='index-B81hyAdU-v118-final-candidate.js'
          url='https://mingpai-ocr-1387910526.cos.ap-guangzhou.myqcloud.com/assets/'+name
          req=urllib.request.Request(url,method='HEAD')
          with urllib.request.urlopen(req,timeout=45) as response:
            length=int(response.headers.get('Content-Length','0'))
            assert response.status==200 and length>10000000,(response.status,length)
          print('Verified COS candidate',name,'bytes',length)
          p=Path('app/candidate-v118')
          p.mkdir(parents=True,exist_ok=True)
          core=Path('app/core.html').read_text(encoding='utf-8')
          assert 'index-B81hyAdU-v117-final.js' in core
          core=core.replace('index-B81hyAdU-v117-final.js',name)
          core=core.replace('1.17','1.18-final-candidate')
          core=core.replace('mingpai-stable117-coi-reload','mingpai-v118-final-candidate-coi-reload')
          (p/'core.html').write_text(core,encoding='utf-8')
          wrapper=Path('stable-wrapper/test-v118-test3.html').read_text(encoding='utf-8')
          wrapper=wrapper.replace('test.3.2.9','final-candidate')
          wrapper=wrapper.replace('mingpai-v118-manifest-version','mingpai-v118-candidate-manifest-version')
          wrapper=wrapper.replace('./core.html?field=v12&rev=202611082322-v1534444-status',
                                  './core.html?field=v12&rev=20261114-v118-eight-fixes')
          wrapper=wrapper.replace('<title>设备铭牌智能识别与审核</title>',
                                  '<title>设备铭牌识别｜v1.18 正式候选版</title>')
          (p/'index.html').write_text(wrapper,encoding='utf-8')
          sw=Path('stable-wrapper/coi-serviceworker-v118-test.js').read_text(encoding='utf-8')
          sw=sw.replace('1.18-test.3.2.9','1.18-final-candidate')
          sw=sw.replace('mingpai-shell-v118-test-3-2-9','mingpai-shell-v118-final-candidate')
          (p/'coi-serviceworker.js').write_text(sw,encoding='utf-8')
          manifest=json.loads(Path('stable-wrapper/version-v118-test.json').read_text(encoding='utf-8'))
          manifest.update(version='1.18-final-candidate',mainJs=name,runtimeFiles=[name])
          (p/'version-v118-test.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          assert name in (p/'core.html').read_text(encoding='utf-8')
          assert name in (p/'version-v118-test.json').read_text(encoding='utf-8')
          print('Candidate test entry ready; formal root and test-adaptive unchanged')
          PY

      - name: Promote validated v1.18 candidate to formal root
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('app')
          candidate=root/'candidate-v118'
          for filename in ['core.html','index.html','coi-serviceworker.js','version-v118-test.json']:
              assert (candidate/filename).exists(),filename
          # Formal root uses the exact validated candidate wrapper and runtime.
          core=(candidate/'core.html').read_text(encoding='utf-8')
          assert 'index-B81hyAdU-v118-final-candidate.js' in core
          core=core.replace('1.18-final-candidate','1.18')
          core=core.replace('mingpai-v118-final-candidate-coi-reload','mingpai-v118-formal-coi-reload')
          (root/'core.html').write_text(core,encoding='utf-8')
          wrapper=(candidate/'index.html').read_text(encoding='utf-8')
          wrapper=wrapper.replace('final-candidate','1.18')
          wrapper=wrapper.replace('v1.18 正式候选版','v1.18 正式版')
          wrapper=wrapper.replace('mingpai-v118-candidate-manifest-version','mingpai-v118-formal-manifest-version')
          wrapper=wrapper.replace('20261114-v118-eight-fixes','20261114-v118-formal')
          (root/'index.html').write_text(wrapper,encoding='utf-8')
          sw=(candidate/'coi-serviceworker.js').read_text(encoding='utf-8')
          sw=sw.replace('1.18-final-candidate','1.18')
          sw=sw.replace('mingpai-shell-v118-final-candidate','mingpai-shell-v118-formal')
          (root/'coi-serviceworker.js').write_text(sw,encoding='utf-8')
          manifest=json.loads((candidate/'version-v118-test.json').read_text(encoding='utf-8'))
          manifest['version']='1.18'
          (root/'version-v118-test.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          assert 'index-B81hyAdU-v118-final-candidate.js' in (root/'core.html').read_text(encoding='utf-8')
          assert '1.18-final-candidate' not in (root/'core.html').read_text(encoding='utf-8')
          assert '1.18-final-candidate' not in (root/'index.html').read_text(encoding='utf-8')
          assert '1.18-final-candidate' not in (root/'coi-serviceworker.js').read_text(encoding='utf-8')
          assert manifest['mainJs']=='index-B81hyAdU-v118-final-candidate.js'
          print('PASS: formal v1.18 root built from verified candidate, v1.17 rollback asset preserved')
          PY

      - name: Verify v1.18.1 COS uploads and create isolated candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          import urllib.request,json
          base='https://mingpai-ocr-1387910526.cos.ap-guangzhou.myqcloud.com/assets/'
          js='index-B81hyAdU-v1181-candidate.js'
          rules='recognition-rules-v1181.json'
          for name,min_bytes in [(js,10_000_000),(rules,8_000)]:
              req=urllib.request.Request(base+name,method='HEAD')
              with urllib.request.urlopen(req,timeout=60) as r:
                  size=int(r.headers.get('Content-Length',0))
                  assert r.status==200 and size>=min_bytes,(name,r.status,size)
                  print('COS verified',name,size)
          # Full GET of the small rules JSON: confirm intended version and rule count.
          rule_data=json.loads(urllib.request.urlopen(base+rules,timeout=60).read())
          assert rule_data['rulesVersion']=='v1.18.1-20261114'
          assert len(rule_data['rules'])==21
          assert any(r['id']=='v1181-anjian-dtp573' for r in rule_data['rules'])
          root=Path('app')
          dest=root/'candidate-v1181'
          dest.mkdir(exist_ok=True)
          core=(root/'core.html').read_text(encoding='utf-8')
          assert 'index-B81hyAdU-v118-final-candidate.js' in core
          core=core.replace('index-B81hyAdU-v118-final-candidate.js',js)
          core=core.replace('mingpai-v118-formal-coi-reload','mingpai-v1181-candidate-coi-reload')
          core=core.replace('1.18','1.18.1-candidate')
          (dest/'core.html').write_text(core,encoding='utf-8')
          wrapper=(root/'index.html').read_text(encoding='utf-8')
          wrapper=wrapper.replace('v1.18 正式版','v1.18.1 候选版')
          wrapper=wrapper.replace('v1.18-1.18','v1.18.1-candidate')
          wrapper=wrapper.replace('v1.18 1.18','v1.18.1-candidate')
          wrapper=wrapper.replace('mingpai-v118-formal-manifest-version','mingpai-v1181-candidate-manifest-version')
          wrapper=wrapper.replace('20261114-v118-formal','20261114-v1181-candidate')
          (dest/'index.html').write_text(wrapper,encoding='utf-8')
          sw=(root/'coi-serviceworker.js').read_text(encoding='utf-8')
          sw=sw.replace('mingpai-shell-v118-formal','mingpai-shell-v1181-candidate')
          sw=sw.replace('const APP_VERSION="1.18"','const APP_VERSION="1.18.1-candidate"')
          (dest/'coi-serviceworker.js').write_text(sw,encoding='utf-8')
          manifest=json.loads((root/'version-v118-test.json').read_text(encoding='utf-8'))
          manifest.update(version='1.18.1-candidate',mainJs=js,runtimeFiles=[js],rules=rules)
          (dest/'version-v118-test.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          assert js in (dest/'core.html').read_text(encoding='utf-8')
          assert js in (dest/'version-v118-test.json').read_text(encoding='utf-8')
          assert 'index-B81hyAdU-v118-final-candidate.js' in (root/'core.html').read_text(encoding='utf-8')
          print('PASS isolated 1.18.1 candidate; current formal v1.18 remains unchanged')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
