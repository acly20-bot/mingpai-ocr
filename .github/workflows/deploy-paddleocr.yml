name: Deploy Mingpai OCR (pinned stable baseline)

# v1.18.4.5: restore the exact, user-verified Pages site. No historical rebuild.
# When publishing future changes, create a NEW reviewed baseline branch and
# update PINNED_COMMIT only after the candidate has passed device tests.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-paddleocr.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release workflow
        uses: actions/checkout@v4

      - name: Restore verified v1.18.4.5 site (no old version build steps)
        env:
          PINNED_COMMIT: 84dc4fae7acf6dc008c143ef6813f17a7b890c39
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/release-baseline/v11845-pending-confirm:refs/remotes/origin/release-baseline/v11845-pending-confirm
          CURRENT="$(git rev-parse refs/remotes/origin/release-baseline/v11845-pending-confirm)"
          test "$CURRENT" = "$PINNED_COMMIT" || { echo "Baseline branch moved unexpectedly"; exit 1; }
          mkdir -p app
          git archive "$CURRENT":site-baseline | tar -xf - -C app

      - name: Verify stable release, rules and user-approved native review UI
        run: |
          python - <<'PY'
          import json,hashlib,re,subprocess
          from pathlib import Path
          root=Path('app')
          expected={
            'index.html':'0082a4f28591f5b2e2906a8b7fec6f94ec1247247467fa5fed02d0572cf7fa22',
            'test-adaptive/index.html':'565a4a531d7985711cfad22011914617ba50cb290441eecfd1be66dbcc31f512',
            'recognition-rules-v1184.json':'90c5314b67f228d1a74f5be9d18ddc9367f6e967a772c0b6f9f7dd699b108cc6'}
          for name,sha in expected.items():
            got=hashlib.sha256((root/name).read_bytes()).hexdigest()
            assert got==sha,(name,got,sha)
          formal=json.loads((root/'version-v118-test.json').read_text())
          test=json.loads((root/'test-adaptive/version-v118-test.json').read_text())
          assert formal['version']=='1.18.4.5' and test['version']=='1.18.4.5-test'
          assert formal['mainJs']==test['mainJs']=='index-B81hyAdU-v11832-viewport-test2.js'
          assert formal['rules']==test['rules']=='recognition-rules-v1184.json'
          assert len(json.loads((root/'recognition-rules-v1184.json').read_text())['rules'])==76
          for entry in ('','test-adaptive/'):
            outer=(root/entry/'index.html').read_text()
            core=(root/entry/'core.html').read_text()
            worker=(root/entry/'coi-serviceworker.js').read_text()
            assert "nativeChange('temperature',temp)" in outer and "nativeChange('humidity',hum)" in outer
            assert 'view?.location?.reload()' not in outer
            assert 'v11841-modal-back' in outer
            assert 'dockModalSelectors' in outer and 'trulyOpen' in outer
            assert 'v11845-stats-unit-label' in outer
            assert 'pendingConfirmRefreshBound' in outer
            assert "pendingStatusSelect.dispatchEvent(new Event('change',{bubbles:true}))" in outer
            if not entry:
              assert 'scheduleHiddenDockRecovery' in outer
            assert "attributeFilter:['hidden','style','class','aria-hidden']" in outer
            assert 'recognition-rules-v1184.json' in core
            assert formal['mainJs'] in core
            for label,source in (('outer',outer),('core',core)):
              for i,js in enumerate(re.findall(r'<script[^>]*>(.*?)</script>',source,re.I|re.S)):
                if js.strip():
                  f=Path('/tmp')/('mingpai-release-'+entry.replace('/','-')+label+str(i)+'.js')
                  f.write_text(js)
                  subprocess.run(['node','--check',str(f)],check=True)
            f=Path('/tmp')/('mingpai-release-'+entry.replace('/','-')+'sw.js')
            f.write_text(worker)
            subprocess.run(['node','--check',str(f)],check=True)
          print('PASS pinned v1.18.4.5 Pages release, rules, JS syntax; formal/test isolated')
          PY

      - name: Upload verified site
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
