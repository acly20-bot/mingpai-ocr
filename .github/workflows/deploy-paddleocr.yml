name: Deploy PaddleOCR Mingpai to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'github-pages-cos-models.zip'
      - '.github/workflows/deploy-paddleocr.yml'
      - 'stable-wrapper/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Extract stable site
        run: |
          mkdir -p app
          unzip -oq github-pages-cos-models.zip -d app

      - name: Promote v1.17 to stable root
        run: |
          # Keep the original stable shell as core.html, then point it to the current formal COS bundle.
          cp app/index.html app/core.html
          sed -i 's/index-B81hyAdU-v153441.js/index-B81hyAdU-v117-final.js/g' app/core.html
          sed -i 's/1\.153\.4\.4\.1/1.17/g' app/core.html
          sed -i 's/mingpai-stable15344-coi-reload/mingpai-stable117-coi-reload/g' app/core.html

          # Formal root keeps the validated stable wrapper.
          cp stable-wrapper/index.html app/index.html
          python - <<'PY'
          from pathlib import Path
          p=Path('app/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('./core.html?field=v12&rev=202611082322-v1534444-status',
                      './core.html?field=v12&rev=202611100155-v117-stable')
          s=s.replace('v1.153.4.4.4.4-test','v1.17')
          s=s.replace('v1.153.4.4.4.3-test','v1.17')
          s=s.replace('v1.153.4.4.4.2-test','v1.17')
          s=s.replace('v1.153.4.4.4.1-test','v1.17')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Build v1.18 test.3.2.2 entry
        run: |
          mkdir -p app/test-adaptive
          cp app/core.html app/test-adaptive/core.html
          cp stable-wrapper/test-v118-test3.html app/test-adaptive/index.html
          cp stable-wrapper/coi-serviceworker-v118-test.js app/test-adaptive/coi-serviceworker.js
          cp stable-wrapper/version-v118-test.json app/test-adaptive/version-v118-test.json

          # Test entry only: point to the v1.18 COS test bundle.
          sed -i 's/index-B81hyAdU-v117-final.js/index-B81hyAdU-v118-test322.js/g' app/test-adaptive/core.html
          sed -i 's/1\.17/1.18-test.3.2.2/g' app/test-adaptive/core.html
          sed -i 's/mingpai-stable117-coi-reload/mingpai-v118-test322-coi-reload/g' app/test-adaptive/core.html

          python - <<'PY'
          from pathlib import Path
          p=Path('app/test-adaptive/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('./core.html?field=v12&rev=202611082322-v1534444-status',
                      './core.html?field=v12&rev=202611131015-v118-test322')
          s=s.replace('<title>设备铭牌智能识别与审核</title>',
                      '<title>设备铭牌识别｜v1.18 test.3.2.2</title>')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Build v1.18 test.3.2.3 COS bundle
        run: |
          python - <<'PY'
          import urllib.request,pathlib,zipfile,hashlib,re
          src='https://mingpai-ocr-1387910526.cos.ap-guangzhou.myqcloud.com/assets/index-B81hyAdU-v118-test322.js'
          data=urllib.request.urlopen(src,timeout=90).read().decode('utf-8')
          def rep(old,new,label,count=1):
              global data
              n=data.count(old)
              if n!=count: raise SystemExit(f'PATCH COUNT {label}: expected {count}, got {n}')
              data=data.replace(old,new)
              print('PATCH',label,n)

          rep('left:50%;transform:translateX(-50%);z-index:99990;width:min(620px,calc(100% - 24px));box-sizing:border-box;padding:10px 14px;border-radius:12px;background:rgba(0,109,91,.94);color:#fff;font-size:14px;line-height:1.45;font-weight:650;',
              'left:10px;right:110px;transform:none;z-index:99990;width:auto;max-width:560px;box-sizing:border-box;padding:7px 10px;border-radius:9px;background:rgba(0,109,91,.94);color:#fff;font-size:12px;line-height:1.35;font-weight:650;',
              'floating-position-size')

          rep('if(i.focusRecordTop){requestAnimationFrame(()=>{const card=v151FindRecordCard(N.id);(card||c("recordList"))?.scrollIntoView({block:"start",behavior:"smooth"})})}else v151KeepScroll(v151Y);',
              'if(i.focusRecordTop){window.__v118FocusRecordTop=String(N.id)}else v151KeepScroll(v151Y);',
              'defer-retake-focus')

          anchor='try{await AI()}catch{}\nif(focusLatestAfterBatch){'
          if data.count(anchor)!=1: raise SystemExit(f'PATCH COUNT final-focus-anchor: {data.count(anchor)}')
          data=data.replace(anchor,'try{await AI()}catch{}\nif(window.__v118FocusRecordTop&&!focusLatestAfterBatch){const rid=String(window.__v118FocusRecordTop);window.__v118FocusRecordTop="";const go=()=>{const card=v151FindRecordCard(rid);if(card){const y=window.scrollY+card.getBoundingClientRect().top-8;window.scrollTo({top:Math.max(0,y),left:0,behavior:"auto"})}};go();requestAnimationFrame(go);setTimeout(go,120);setTimeout(go,320);setTimeout(go,650)}\nif(focusLatestAfterBatch){')
          print('PATCH final-retake-focus 1')

          rep('i.thumb=await cg(N),await PA(i),await AI(),requestAnimationFrame(()=>{const card=v151FindRecordCard(i.id);(card||c("recordList"))?.scrollIntoView({block:"start",behavior:"smooth"})}),UA(h?"重新识别完成，请核对字段后确认。":"重新识别失败，请查看该条记录的错误原因。")',
              'i.thumb=await cg(N),await PA(i),await AI(),(()=>{const rid=String(i.id),go=()=>{const card=v151FindRecordCard(rid);if(card){const y=window.scrollY+card.getBoundingClientRect().top-8;window.scrollTo({top:Math.max(0,y),left:0,behavior:"auto"})}};go();requestAnimationFrame(go);setTimeout(go,120);setTimeout(go,320);setTimeout(go,650)})(),UA(h?"重新识别完成，请核对字段后确认。":"重新识别失败，请查看该条记录的错误原因。")',
              'retry-stable-focus')

          out=pathlib.Path('index-B81hyAdU-v118-test323.js')
          out.write_text(data,encoding='utf-8')
          print('SHA256',hashlib.sha256(out.read_bytes()).hexdigest())
          with zipfile.ZipFile('mingpai-v1.18-test.3.2.3-COS.zip','w',zipfile.ZIP_DEFLATED) as z:
              z.write(out,out.name)
              z.writestr('README.txt','v1.18 test.3.2.3\nUpload index-B81hyAdU-v118-test323.js to Tencent COS assets/.\nFixes: delayed stable positioning for retake/re-recognize; smaller left floating status.\n')
          PY
          cp index-B81hyAdU-v118-test323.js /tmp/test323.mjs
          node --check /tmp/test323.mjs

      - name: Upload v1.18 test.3.2.3 COS bundle
        uses: actions/upload-artifact@v4
        with:
          name: mingpai-v1.18-test.3.2.3-COS
          path: mingpai-v1.18-test.3.2.3-COS.zip
          retention-days: 7
      - name: Build SCF v1.0.8 deploy ZIP
        run: |
          python - <<'PY'
          import base64
          b64=''
          open('mingpai-feishu-export-scf-v1.0.8.zip','wb').write(base64.b64decode(b64))
          PY

      - name: Upload SCF v1.0.8 deploy ZIP
        uses: actions/upload-artifact@v4
        with:
          name: mingpai-feishu-export-scf-v1.0.8
          path: mingpai-feishu-export-scf-v1.0.8.zip
          retention-days: 30
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
