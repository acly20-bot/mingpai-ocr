name: Deploy Mingpai OCR (pinned v1.18.6 stable baseline)

# v1.18.6: publish one pinned, user-verified stable baseline; retain v1.18.5 branch for rollback.
# When publishing future changes, create a NEW reviewed baseline branch and
# update PINNED_COMMIT only after the candidate has passed device tests.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-paddleocr.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release workflow
        uses: actions/checkout@v4

      - name: Restore verified v1.18.6 site (no old version build steps)
        env:
          PINNED_COMMIT: dae642c745d64c8c5f131ad316b6a974b851788b
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/release-baseline/v1186-verified:refs/remotes/origin/release-baseline/v1186-verified
          CURRENT="$(git rev-parse refs/remotes/origin/release-baseline/v1186-verified)"
          test "$CURRENT" = "$PINNED_COMMIT" || { echo "Baseline branch moved unexpectedly"; exit 1; }
          mkdir -p app
          git archive "$CURRENT":site-baseline | tar -xf - -C app

      - name: Verify stable release, rules and user-approved native review UI
        run: |
          python - <<'PY'
          import json,hashlib,re,subprocess
          from pathlib import Path
          root=Path('app')
          # The pinned commit fixes all HTML/JS content; hash the shared rules as a
          # second integrity check rather than retaining obsolete v1.18.5 shell hashes.
          expected={'recognition-rules-v1184.json':'6e59267334fcae53058fad7d307d02ddc0b71ecd6c70ee97030579c67febbb22'}
          for name,sha in expected.items():
            got=hashlib.sha256((root/name).read_bytes()).hexdigest()
            assert got==sha,(name,got,sha)
          formal=json.loads((root/'version-v118-test.json').read_text())
          test=json.loads((root/'test-adaptive/version-v118-test.json').read_text())
          assert formal['version']=='1.18.6' and test['version']=='1.18.6-test.1'
          assert formal['mainJs']==test['mainJs']=='index-B81hyAdU-v1186-test1-qqgpu-thumbfix.js'
          assert formal['rules']==test['rules']=='recognition-rules-v1184.json'
          assert len(json.loads((root/'recognition-rules-v1184.json').read_text())['rules'])==86
          for entry in ('','test-adaptive/'):
            outer=(root/entry/'index.html').read_text()
            core=(root/entry/'core.html').read_text()
            worker=(root/entry/'coi-serviceworker.js').read_text()
            assert "nativeChange('temperature',temp)" in outer and "nativeChange('humidity',hum)" in outer
            assert 'view?.location?.reload()' not in outer
            assert 'v11841-modal-back' in outer
            assert 'dockModalSelectors' in outer and 'trulyOpen' in outer
            assert 'v11845-stats-unit-label' in outer
            assert 'pendingConfirmRefreshBound' in outer
            assert 'const confirmed=/已确认/' in outer
            assert 'const addedRiskCards=new Set()' in outer
            assert 'const addedEnvCards=new Set()' in outer
            assert 'mingpai-startup-diagnostics-v1182' not in outer
            assert 'mingpai-optin-boot-diagnosis' not in outer
            assert "pendingStatusSelect.dispatchEvent(new Event('change',{bubbles:true}))" in outer
            if not entry:
              assert 'scheduleHiddenDockRecovery' in outer
            assert "attributeFilter:['hidden','style','class','aria-hidden']" in outer
            assert 'recognition-rules-v1184.json' in core
            # Excel data detail layout: exact 13 columns, fixed one-line rows.
            assert 'width="20.44140625"' in outer
            assert 'width="33.6640625"' in outer
            assert 'width="8.88671875"' in outer
            assert 'wrapText="0"' in outer
            assert 'const ht=summary?Math.min(75,Math.max(26,24+Math.floor(maxLen/18)*15)):19.2;' in outer
            assert 'v1186-direct-image-save' in core
            assert 'v1186QqProtected' in core
            assert 'setTimeout(reload,1300)' not in core
            assert formal['mainJs'] in core
            assert 'if(resumedController?.scriptURL?.includes' in core
            assert 'const CLIENT_VERSION="1.18.6' in outer
            assert formal['mainJs'] in worker or formal['mainJs'] in core
            for label,source in (('outer',outer),('core',core)):
              for i,js in enumerate(re.findall(r'<script[^>]*>(.*?)</script>',source,re.I|re.S)):
                if js.strip():
                  f=Path('/tmp')/('mingpai-release-'+entry.replace('/','-')+label+str(i)+'.js')
                  f.write_text(js)
                  subprocess.run(['node','--check',str(f)],check=True)
            f=Path('/tmp')/('mingpai-release-'+entry.replace('/','-')+'sw.js')
            f.write_text(worker)
            subprocess.run(['node','--check',str(f)],check=True)
          print('PASS pinned v1.18.6 Pages release, rules, JS syntax; formal/test isolated')
          PY

      - name: Add isolated v1.18.6-test.1 QQ compatibility preview
        env:
          PREVIEW_COMMIT: a914d2f0888f5e18457be906f22a5e509fa15f53
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/test/v1.18.6-test.1:refs/remotes/origin/test/v1.18.6-test.1
          CURRENT="$(git rev-parse refs/remotes/origin/test/v1.18.6-test.1)"
          test "$CURRENT" = "$PREVIEW_COMMIT" || { echo "Preview branch moved unexpectedly"; exit 1; }
          mkdir -p app/test-v1186
          git archive "$CURRENT":site-baseline/test-adaptive | tar -xf - -C app/test-v1186
          python - <<'PY'
          from pathlib import Path
          import json,re,subprocess
          root=Path('app')
          preview=root/'test-v1186'
          formal=json.loads((root/'version-v118-test.json').read_text())
          test=json.loads((preview/'version-v118-test.json').read_text())
          assert formal['version']=='1.18.6' and test['version']=='1.18.6-test.1'
          assert test['rules']=='recognition-rules-v1184.json'
          assert 'v1186QqProtected' in (preview/'core.html').read_text()
          assert 'v1186-direct-image-save' in (preview/'core.html').read_text()
          assert 'width="20.44140625"' in (preview/'index.html').read_text()
          assert 'wrapText="0"' in (preview/'index.html').read_text()
          assert '保存图片' in (preview/'core.html').read_text()
          assert '保存/转发' not in (preview/'core.html').read_text()
          assert test['mainJs']=='index-B81hyAdU-v1186-test1-qqgpu-thumbfix.js'
          assert test['runtimeFiles']==[test['mainJs']]
          assert test['mainJs'] in (preview/'core.html').read_text()
          assert 'v=1.18.6-test.1-qqgpu-thumbfix' in (preview/'core.html').read_text()
          assert 'mingpai-shell-v1186-test1-qqgpu-thumbfix' in (preview/'coi-serviceworker.js').read_text()
          for name in ('index.html','core.html'):
            source=(preview/name).read_text()
            for i,js in enumerate(re.findall(r'<script[^>]*>(.*?)</script>',source,re.I|re.S)):
              if js.strip():
                f=Path('/tmp')/('mingpai-v1186-'+name+str(i)+'.js')
                f.write_text(js)
                subprocess.run(['node','--check',str(f)],check=True)
          subprocess.run(['node','--check',str(preview/'coi-serviceworker.js')],check=True)
          print('PASS isolated v1.18.6-test.1 preview; formal and existing test unchanged')
          PY

      - name: Add isolated v1.18.7-test.1 compact record layout preview
        env:
          COMPACT_PREVIEW_COMMIT: 6e496845b17917b7c57bdce52bc83bb37732e7a7
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/test/v1.18.7-test.1:refs/remotes/origin/test/v1.18.7-test.1
          CURRENT="$(git rev-parse refs/remotes/origin/test/v1.18.7-test.1)"
          test "$CURRENT" = "$COMPACT_PREVIEW_COMMIT" || { echo "Record layout preview branch moved unexpectedly"; exit 1; }
          mkdir -p app/test-v1187
          git archive "$CURRENT":site-baseline/test-adaptive | tar -xf - -C app/test-v1187
          python - <<'PY'
          from pathlib import Path
          import json,re,subprocess
          root=Path('app')
          preview=root/'test-v1187'
          formal=json.loads((root/'version-v118-test.json').read_text())
          test=json.loads((preview/'version-v118-test.json').read_text())
          assert formal['version']=='1.18.6' and test['version']=='1.18.7-test.1'
          assert formal['mainJs']==test['mainJs']=='index-B81hyAdU-v1186-test1-qqgpu-thumbfix.js'
          assert formal['rules']==test['rules']=='recognition-rules-v1184.json'
          assert 'v1187-raw-collapse-test' in (preview/'core.html').read_text()
          assert 'v1187-card-compact-test' in (preview/'core.html').read_text()
          assert 'v1186-direct-image-save' in (preview/'core.html').read_text()
          assert 'mingpai-shell-v1187-test1-card-compact' in (preview/'coi-serviceworker.js').read_text()
          for name in ('index.html','core.html'):
            source=(preview/name).read_text()
            for i,js in enumerate(re.findall(r'<script[^>]*>(.*?)</script>',source,re.I|re.S)):
              if js.strip():
                f=Path('/tmp')/('mingpai-v1187-'+name+str(i)+'.js')
                f.write_text(js)
                subprocess.run(['node','--check',str(f)],check=True)
          subprocess.run(['node','--check',str(preview/'coi-serviceworker.js')],check=True)
          print('PASS v1.18.7 isolated record-layout prototype; production v1.18.6 untouched')
          PY

      - name: Add independent Edge restore diagnostic page
        run: |
          set -euo pipefail
          mkdir -p app/edge-lab
          cp edge-lab/index.html app/edge-lab/index.html
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          p=Path('app/edge-lab/index.html')
          s=p.read_text(encoding='utf-8')
          assert 'Edge 恢复旧标签专项测试' in s
          assert 'setInterval(' not in s and 'location.reload(' not in s
          assert 'navigator.serviceWorker.register(' not in s
          assert 'index-B81hy' not in s
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          assert len(scripts)==1,len(scripts)
          for i,body in enumerate(scripts):
            f=Path('/tmp/edge-lab-script-'+str(i)+'.js')
            f.write_text(body)
            subprocess.run(['node','--check',str(f)],check=True)
          print('PASS isolated Edge A/B restore diagnostic')
          PY

      - name: Add isolated Edge full-app restore comparators (C/D)
        run: |
          set -euo pipefail
          cp edge-lab/build_variants.py app/edge-lab/build_variants.py
          python app/edge-lab/build_variants.py app
          python - <<'PY'
          from pathlib import Path
          root=Path('app/edge-lab')
          assert (root/'ui/index.html').is_file()
          assert (root/'direct/index.html').is_file()
          assert (root/'worker/index.html').is_file()
          assert (root/'full/index.html').is_file()
          assert (root/'worker/coi-serviceworker.js').is_file()
          assert (root/'full/coi-serviceworker.js').is_file()
          assert not (root/'ui/coi-serviceworker.js').exists()
          assert not (root/'direct/coi-serviceworker.js').exists()
          for mode in ('ui','direct'):
            assert 'v1186-direct-image-save' in (root/mode/'core.html').read_text()
            assert 'edge-lab-lifecycle' in (root/mode/'index.html').read_text()
          assert 'async function run(){return;' in (root/'worker/index.html').read_text()
          assert 'mingpai-open-version-check' in (root/'full/index.html').read_text()
          print('PASS Edge C/D/E/F isolated comparators')
          PY

      - name: Upload verified site
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
