name: Deploy PaddleOCR Mingpai to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'github-pages-cos-models.zip'
      - '.github/workflows/deploy-paddleocr.yml'
      - 'stable-wrapper/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Extract stable site
        run: |
          mkdir -p app
          unzip -oq github-pages-cos-models.zip -d app

      - name: Promote v1.17 to stable root
        run: |
          # Keep the original stable shell as core.html, then point it to the current formal COS bundle.
          cp app/index.html app/core.html
          sed -i 's/index-B81hyAdU-v153441.js/index-B81hyAdU-v117-final.js/g' app/core.html
          sed -i 's/1\.153\.4\.4\.1/1.17/g' app/core.html
          sed -i 's/mingpai-stable15344-coi-reload/mingpai-stable117-coi-reload/g' app/core.html

          # Formal root keeps the validated stable wrapper.
          cp stable-wrapper/index.html app/index.html
          python - <<'PY'
          from pathlib import Path
          p=Path('app/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('./core.html?field=v12&rev=202611082322-v1534444-status',
                      './core.html?field=v12&rev=202611100155-v117-stable')
          s=s.replace('v1.153.4.4.4.4-test','v1.17')
          s=s.replace('v1.153.4.4.4.3-test','v1.17')
          s=s.replace('v1.153.4.4.4.2-test','v1.17')
          s=s.replace('v1.153.4.4.4.1-test','v1.17')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Build v1.18 test.3.1 entry
        run: |
          mkdir -p app/test-adaptive
          cp app/core.html app/test-adaptive/core.html
          cp stable-wrapper/test-v118-test3.html app/test-adaptive/index.html
          cp stable-wrapper/coi-serviceworker-v118-test.js app/test-adaptive/coi-serviceworker.js
          cp stable-wrapper/version-v118-test.json app/test-adaptive/version-v118-test.json

          # Test entry only: point to the v1.18 COS test bundle.
          sed -i 's/index-B81hyAdU-v117-final.js/index-B81hyAdU-v118-test31.js/g' app/test-adaptive/core.html
          sed -i 's/1\.17/1.18-test.3.1/g' app/test-adaptive/core.html
          sed -i 's/mingpai-stable117-coi-reload/mingpai-v118-test31-coi-reload/g' app/test-adaptive/core.html

          python - <<'PY'
          from pathlib import Path
          p=Path('app/test-adaptive/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('./core.html?field=v12&rev=202611082322-v1534444-status',
                      './core.html?field=v12&rev=202611130034-v118-test31')
          s=s.replace('<title>设备铭牌智能识别与审核</title>',
                      '<title>设备铭牌识别｜v1.18 test.3.1</title>')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Build v1.18 test.3.2 COS bundle
        run: |
          python - <<'PY'
          import urllib.request, pathlib, zipfile, hashlib
          src='https://mingpai-ocr-1387910526.cos.ap-guangzhou.myqcloud.com/assets/index-B81hyAdU-v118-test31.js'
          data=urllib.request.urlopen(src,timeout=90).read().decode('utf-8')
          orig=data
          def rep(old,new,label,count=None):
              global data
              n=data.count(old)
              if n==0: raise SystemExit(f'PATCH NOT FOUND: {label}')
              if count is not None and n!=count: raise SystemExit(f'PATCH COUNT {label}: expected {count}, got {n}')
              data=data.replace(old,new)
              print('PATCH',label,n)

          rep('e.startsWith("已加入识别队列")||e.startsWith("识别中：")',
              'e.startsWith("已加入识别队列")||e.startsWith("识别中：")||e.startsWith("上次识别被中断，已自动重新排队")',
              'resume-stale-requeued',1)
          rep('i.status="pending",i.queueFailed=!1,(i.feishuRecordId||i.remoteRecordId)&&(i.syncStatus="pending"),i.error=`已加入识别队列：${h}`',
              'i.status="pending",i.queueFailed=!1,i.queueStatus="queued",i.failureReason="",i.queueRecoveredAt=0,(i.feishuRecordId||i.remoteRecordId)&&(i.syncStatus="pending"),i.error=`已加入识别队列：${h}`',
              'retry-clear-old-failure',1)
          rep('if(U){N.error="";N.queueStatus="done"}',
              'if(U){N.error="";N.queueStatus="done";N.queueFailed=false;N.failureReason="";N.queueRecoveredAt=0;N.hardSelfHealPending=false}',
              'queue-success-cleanup',1)
          rep('if(ok){rec.error="";rec.queueFailed=false;return true}',
              'if(ok){rec.error="";rec.queueFailed=false;rec.queueStatus="done";rec.failureReason="";rec.queueRecoveredAt=0;rec.hardSelfHealPending=false;return true}',
              'image-heal-success-cleanup',1)
          rep('if(healed){N.queueFailed=false;N.error="";UAS("图片读取异常已局部自愈，本张已重新读取并识别成功。",3500)}',
              'if(healed){N.queueFailed=false;N.error="";N.queueStatus="done";N.failureReason="";N.queueRecoveredAt=0;N.hardSelfHealPending=false;UAS("图片读取异常已局部自愈，本张已重新读取并识别成功。",3500)}',
              'catch-heal-success-cleanup',1)
          rep('i.queueFailed=!h,i.thumb=await cg(N),await PA(i)',
              'i.queueFailed=!h,h&&(i.error="",i.queueStatus="done",i.failureReason="",i.queueRecoveredAt=0,i.hardSelfHealPending=false),i.thumb=await cg(N),await PA(i)',
              'direct-retry-success-cleanup',1)
          rep('function nI(i){return i.unitName==null&&(i.unitName=i.batch||""),i.remark==null&&(i.remark=""),i.operatorName==null&&(i.operatorName=""),i.classifyNote==null&&(i.classifyNote=""),i.recognitionSec==null&&(i.recognitionSec=""),i}',
              'function nI(i){i.unitName==null&&(i.unitName=i.batch||"");i.remark==null&&(i.remark="");i.operatorName==null&&(i.operatorName="");i.classifyNote==null&&(i.classifyNote="");i.recognitionSec==null&&(i.recognitionSec="");const e=String(i.error||"");const hasResult=!!(String(i.raw||"").trim()||String(i.name||"").trim()||String(i.manufacturer||"").trim()||String(i.model||"").trim()||String(i.code||"").trim());if(hasResult&&i.queueFailed===false&&(e.startsWith("上次识别被中断")||e.startsWith("识别中：")||e.startsWith("已加入识别队列"))){i.error="";i.queueStatus="done";i.failureReason="";i.queueRecoveredAt=0;i.hardSelfHealPending=false}return i}',
              'legacy-success-normalize',1)

          out=pathlib.Path('index-B81hyAdU-v118-test32.js')
          out.write_text(data,encoding='utf-8')
          print('SOURCE_LEN',len(orig),'OUTPUT_LEN',len(data))
          print('SHA256',hashlib.sha256(out.read_bytes()).hexdigest())
          with zipfile.ZipFile('mingpai-v1.18-test.3.2-COS.zip','w',zipfile.ZIP_DEFLATED) as z:
              z.write(out,out.name)
              z.writestr('README.txt','v1.18 test.3.2\nUpload index-B81hyAdU-v118-test32.js to Tencent COS assets/.\nFixes: failure-state cleanup, interrupted retry recovery, legacy stale-success cleanup.\n')
          PY
          cp index-B81hyAdU-v118-test32.js /tmp/test32.mjs
          node --check /tmp/test32.mjs

      - name: Upload v1.18 test.3.2 COS bundle
        uses: actions/upload-artifact@v4
        with:
          name: mingpai-v1.18-test.3.2-COS
          path: mingpai-v1.18-test.3.2-COS.zip
          retention-days: 7
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
