name: Deploy PaddleOCR Mingpai to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'github-pages-cos-models.zip'
      - '.github/workflows/deploy-paddleocr.yml'
      - 'stable-wrapper/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Extract stable site
        run: |
          mkdir -p app
          unzip -oq github-pages-cos-models.zip -d app

      - name: Promote v1.17.1-fixes-test to stable root
        run: |
          # Keep the original stable shell as core.html, then point it to the new COS bundle.
          cp app/index.html app/core.html
          sed -i 's/index-B81hyAdU-v153441.js/index-B81hyAdU-v1171-fixes-test.js/g' app/core.html
          sed -i 's/1\.153\.4\.4\.1/1.16/g' app/core.html
          sed -i 's/mingpai-stable15344-coi-reload/mingpai-stable117-coi-reload/g' app/core.html

          # Reuse the fully validated V12 wrapper as the formal root UI.
          cp stable-wrapper/test-v1171-fixes.html app/index.html
          python - <<'PY'
          from pathlib import Path
          p=Path('app/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('./core.html?field=v12&rev=202611082322-v1534444-status',
                      './core.html?field=v12&rev=202611110050-v1171-fixes-test')
          s=s.replace('v1.153.4.4.4.4-test','v1.17.1-fixes-test')
          s=s.replace('v1.153.4.4.4.3-test','v1.17.1-fixes-test')
          s=s.replace('v1.153.4.4.4.2-test','v1.17.1-fixes-test')
          s=s.replace('v1.153.4.4.4.1-test','v1.17.1-fixes-test')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Build adaptive OCR scheduler test entry
        run: |
          mkdir -p app/test-adaptive
          cp app/core.html app/test-adaptive/core.html
          cp stable-wrapper/test-v1171-fixes.html app/test-adaptive/index.html
          cp app/coi-serviceworker.js app/test-adaptive/coi-serviceworker.js

          # Test bundle only: stable v1.17.1-fixes-test remains untouched at root.
          sed -i 's/index-B81hyAdU-v1171-fixes-test.js/index-B81hyAdU-v117.js/g' app/test-adaptive/core.html
          sed -i 's/1\.16/1.17.1-fixes-test/g' app/test-adaptive/core.html
          sed -i 's/mingpai-stable117-coi-reload/mingpai-v117-final-coi-reload/g' app/test-adaptive/core.html

          python - <<'PY'
          from pathlib import Path
          p=Path('app/test-adaptive/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('./core.html?field=v12&rev=202611082322-v1534444-status',
                      './core.html?field=v12&rev=202611110050-v1171-fixes-test')
          s=s.replace('<title>设备铭牌智能识别与审核</title>',
                      '<title>设备铭牌识别｜vv1.17.1-fixes-test.1 修复测试</title>')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
