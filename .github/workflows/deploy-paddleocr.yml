name: Deploy PaddleOCR Mingpai to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'github-pages-cos-models.zip'
      - '.github/workflows/deploy-paddleocr.yml'
      - 'ui-compare/**'
      - 'stable-release/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Extract prebuilt site
        run: |
          mkdir -p app
          unzip -oq github-pages-cos-models.zip -d app
      - name: Add UI comparison previews
        run: |
          if [ -d ui-compare ]; then
            cp -R ui-compare app/ui-compare
          fi
      - name: Promote stable V12 wrapper
        run: |
          cp app/index.html app/core.html
          cp stable-release/v1.153.4.4.2/index.html app/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
