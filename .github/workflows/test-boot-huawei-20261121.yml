name: Test Huawei startup and confirmed risk hints (v1.18.4.5)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-boot-huawei-20261121.yml'
      - 'scripts/fix-startup-resume-browser-test2.py'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore current 84-rule stable baseline
        env:
          PINNED_COMMIT: 4a95343410230cdb86b4a9712452206aa0202f12
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/release-baseline/v11845-bootfix-test:refs/remotes/origin/release-baseline/v11845-bootfix-test
          test "$(git rev-parse refs/remotes/origin/release-baseline/v11845-bootfix-test)" = "$PINNED_COMMIT"
          mkdir -p app
          git archive "$PINNED_COMMIT":site-baseline | tar -xf - -C app
      - name: Optimize already controlled browser reopen and cached shell fallback in test
        run: python scripts/fix-startup-resume-browser-test2.py
      - name: Verify no formal changes, version unchanged and 84 rules
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('app')
          expected={
            'index.html':'0082a4f28591f5b2e2906a8b7fec6f94ec1247247467fa5fed02d0572cf7fa22',
            'recognition-rules-v1184.json':'6cd441b385603582934754978f2ea30a09b314cf7bd2a1ae086db4c25e38820c'}
          for path,sha in expected.items():
            assert hashlib.sha256((root/path).read_bytes()).hexdigest()==sha
          assert json.loads((root/'version-v118-test.json').read_text())['version']=='1.18.4.5'
          assert json.loads((root/'test-adaptive/version-v118-test.json').read_text())['version']=='1.18.4.5-test'
          assert len(json.loads((root/'test-adaptive/recognition-rules-v1184.json').read_text())['rules'])==84
          s=(root/'test-adaptive/index.html').read_text()
          assert 'pendingConfirmRefreshBound' in s and 'v11845-stats-unit-label' in s
          assert 'const confirmed=/已确认/' in s
          core=(root/'test-adaptive/core.html').read_text()
          assert 'deadline(navigator.serviceWorker.ready,4200' in core
          assert 'if(resumedController?.scriptURL?.includes' in core
          sw=(root/'test-adaptive/coi-serviceworker.js').read_text()
          assert 'const timer=cached?setTimeout(()=>ctrl.abort(),2400):null' in sw
          assert 'cache.match("./index.html")' not in sw
          print('PASS test startup and warning fix; formal byte-identical')
          PY
      - name: Freeze candidate test baseline for rollback
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/mingpai-v11845-boot-test"
          git worktree add -b release-baseline/v11845-bootfix-test2 "$BASE" HEAD
          mkdir -p "$BASE/site-baseline"
          cp -a app/. "$BASE/site-baseline/"
          cd "$BASE"
          git add site-baseline
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test baseline: controlled browser resume and bounded shell network wait'
          git push origin HEAD:refs/heads/release-baseline/v11845-bootfix-test
          echo "PINNED_BASELINE_SHA=$(git rev-parse HEAD)"
      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: app
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
