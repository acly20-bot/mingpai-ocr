name: Fix formal-only dock recovery (v1.18.4.5 unchanged)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-formal-dock-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Restore pinned tested dockfix baseline
        env:
          PINNED_COMMIT: a146f14352630726ef9ddcc581d075cb936a4ce8
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/release-baseline/v11845-dockfix:refs/remotes/origin/release-baseline/v11845-dockfix
          test "$(git rev-parse refs/remotes/origin/release-baseline/v11845-dockfix)" = "$PINNED_COMMIT"
          mkdir -p app
          git archive "$PINNED_COMMIT":site-baseline | tar -xf - -C app

      - name: Correct formal-only dock recovery and keep test byte-identical
        run: |
          python scripts/fix-formal-dock-recovery.py

      - name: Freeze full Pages site into a new immutable baseline
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/mingpai-v11845-dock-recovery-baseline"
          git worktree add -b release-baseline/v11845-dock-recovery "$BASE" HEAD
          mkdir -p "$BASE/site-baseline"
          cp -a app/. "$BASE/site-baseline/"
          cd "$BASE"
          git add site-baseline
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'baseline: formal dock recovery v1.18.4.5 (unchanged version)'
          git push origin HEAD:refs/heads/release-baseline/v11845-dock-recovery
          echo "PINNED_BASELINE_SHA=$(git rev-parse HEAD)"
          sha256sum site-baseline/index.html site-baseline/test-adaptive/index.html site-baseline/recognition-rules-v1184.json

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
