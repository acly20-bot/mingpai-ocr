name: Test native temperature/humidity save (v1.18.4.5)

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-v11845-native-environment-test.py'
      - '.github/workflows/test-native-environment.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore frozen v1.18.4.4 release
        env:
          PINNED_COMMIT: 780c368e4b3fc3460db3b39d68720e80cc2e5780
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/release-baseline/v11844:refs/remotes/origin/release-baseline/v11844
          CURRENT="$(git rev-parse refs/remotes/origin/release-baseline/v11844)"
          test "$CURRENT" = "$PINNED_COMMIT" || { echo "Baseline branch changed"; exit 1; }
          mkdir -p app
          git archive "$CURRENT":site-baseline | tar -xf - -C app

      - name: Apply native temperature/humidity fix to test ONLY
        run: |
          python scripts/apply-v11845-native-environment-test.py

      - name: Verify formal SHA and test version
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('app')
          assert hashlib.sha256((root/'index.html').read_bytes()).hexdigest()=='cb4c91582292aedc35333f43b96631ad359d627dd51fa1616402522b1403aa6d'
          assert hashlib.sha256((root/'recognition-rules-v1184.json').read_bytes()).hexdigest()=='90c5314b67f228d1a74f5be9d18ddc9367f6e967a772c0b6f9f7dd699b108cc6'
          assert json.loads((root/'version-v118-test.json').read_text())['version']=='1.18.4.4'
          assert json.loads((root/'test-adaptive/version-v118-test.json').read_text())['version']=='1.18.4.5-test'
          assert 'nativeChange(\'temperature\',temp)' in (root/'test-adaptive/index.html').read_text()
          assert 'nativeChange(\'humidity\',hum)' in (root/'test-adaptive/index.html').read_text()
          print('PASS isolated test only, production unchanged')
          PY

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
