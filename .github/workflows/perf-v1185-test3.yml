name: v1.18.5-test.3 targeted historical observer cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/perf-v1185-test3.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore user-verified v1.18.5-test.2 baseline
        env:
          PINNED_COMMIT: 25ddd5634fdf28b8531930fd04a08791153b3fb7
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/release-baseline/v1185-test2:refs/remotes/origin/release-baseline/v1185-test2
          test "$(git rev-parse refs/remotes/origin/release-baseline/v1185-test2)" = "$PINNED_COMMIT"
          mkdir -p app
          git archive "$PINNED_COMMIT":site-baseline | tar -xf - -C app
      - name: Apply strictly isolated test3 observer cleanups
        run: python scripts/perf-v1185-test3-cleanup.py
      - name: Validate protected formal and all essential features
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          r=Path('app')
          assert hashlib.sha256((r/'index.html').read_bytes()).hexdigest()=='50b80ba6955fd521b63c5851dbf09f5dbafecfbe2f4a854557c626d799cdb284'
          assert hashlib.sha256((r/'recognition-rules-v1184.json').read_bytes()).hexdigest()=='56387ad6c2bd57ee39186a936e89298605535ef4c8f5702c57b84ebd862eed78'
          assert json.loads((r/'version-v118-test.json').read_text())['version']=='1.18.4.5'
          assert json.loads((r/'test-adaptive/version-v118-test.json').read_text())['version']=='1.18.5-test.3'
          assert len(json.loads((r/'test-adaptive/recognition-rules-v1184.json').read_text())['rules'])==85
          s=(r/'test-adaptive/index.html').read_text()
          for marker in ["pendingConfirmRefreshBound","v11845-stats-unit-label","nativeChange('temperature',temp)","const confirmed=/已确认/","decorateCards(current)","addedRiskCards","v11711BootTimer=setInterval"]:
            assert marker in s,marker
          assert 'mingpai-startup-diagnostics-v1182' not in s
          assert 'mingpai-optin-boot-diagnosis' not in s
          assert 'scheduleHiddenDockRecovery' in (r/'index.html').read_text()
          print('PASS pinned formal, 85 rules, test3 stable features')
          PY
      - name: Freeze candidate baseline for independent rollback
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/mingpai-v1185-test3"
          git worktree add -b release-baseline/v1185-test3 "$BASE" HEAD
          mkdir -p "$BASE/site-baseline"
          cp -a app/. "$BASE/site-baseline/"
          cd "$BASE"
          git add site-baseline
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'candidate: v1.18.5-test.3 targeted old observer cleanup'
          git push origin HEAD:refs/heads/release-baseline/v1185-test3
          echo "TEST_BASELINE_SHA=$(git rev-parse HEAD)"
      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: app
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
