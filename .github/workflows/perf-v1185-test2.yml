name: v1.18.5-test.2 incremental records / IndexedDB performance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/perf-v1185-test2.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Restore verified v1.18.5-test.1 baseline
        env:
          PINNED_COMMIT: 9da8b1c51521a1a6b2ec1e0813fec5484f579374
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/release-baseline/v1185-test1:refs/remotes/origin/release-baseline/v1185-test1
          test "$(git rev-parse refs/remotes/origin/release-baseline/v1185-test1)" = "$PINNED_COMMIT"
          mkdir -p app
          git archive "$PINNED_COMMIT":site-baseline | tar -xf - -C app
      - name: Apply incremental card performance change to test only
        run: python scripts/perf-v1185-test2-incremental-cards.py
      - name: Verify formal SHA, approved features, and 85 rules
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          r=Path('app')
          assert hashlib.sha256((r/'index.html').read_bytes()).hexdigest()=='50b80ba6955fd521b63c5851dbf09f5dbafecfbe2f4a854557c626d799cdb284'
          assert hashlib.sha256((r/'recognition-rules-v1184.json').read_bytes()).hexdigest()=='56387ad6c2bd57ee39186a936e89298605535ef4c8f5702c57b84ebd862eed78'
          assert json.loads((r/'version-v118-test.json').read_text())['version']=='1.18.4.5'
          assert json.loads((r/'test-adaptive/version-v118-test.json').read_text())['version']=='1.18.5-test.2'
          assert len(json.loads((r/'test-adaptive/recognition-rules-v1184.json').read_text())['rules'])==85
          s=(r/'test-adaptive/index.html').read_text()
          assert "const addedEnvCards=new Set()" in s
          assert "decorateCards(current)" in s
          assert "pendingConfirmRefreshBound" in s
          assert "v11845-stats-unit-label" in s
          assert "nativeChange('temperature',temp)" in s
          assert "const confirmed=/已确认/" in s
          assert "mingpai-optin-boot-diagnosis" not in s
          print('PASS isolated v1.18.5-test.2, formal stable, 85 rules')
          PY
      - name: Save full test2 baseline
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/mingpai-v1185-test2"
          git worktree add -b release-baseline/v1185-test2 "$BASE" HEAD
          mkdir -p "$BASE/site-baseline"
          cp -a app/. "$BASE/site-baseline/"
          cd "$BASE"
          git add site-baseline
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'candidate: v1.18.5-test.2 incremental card decoration'
          git push origin HEAD:refs/heads/release-baseline/v1185-test2
          echo "TEST_BASELINE_SHA=$(git rev-parse HEAD)"
      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: app
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
