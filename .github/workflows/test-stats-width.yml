name: Test adaptive statistics columns (v1.18.4.5 unchanged)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-stats-width.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore tested stable baseline
        env:
          PINNED_COMMIT: 0843351521afe85b62722198349cd29489586500
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/release-baseline/v11845-dock-recovery:refs/remotes/origin/release-baseline/v11845-dock-recovery
          test "$(git rev-parse refs/remotes/origin/release-baseline/v11845-dock-recovery)" = "$PINNED_COMMIT"
          mkdir -p app
          git archive "$PINNED_COMMIT":site-baseline | tar -xf - -C app

      - name: Apply statistics layout changes only to test
        run: |
          python scripts/fix-stats-column-width-test.py

      - name: Verify unchanged formal and recognizable test version
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path('app')
          assert hashlib.sha256((root/'index.html').read_bytes()).hexdigest()=='12153339d77125c2168a16366b279325539085d929c8c26e22b67eadb9aaef73'
          assert hashlib.sha256((root/'recognition-rules-v1184.json').read_bytes()).hexdigest()=='90c5314b67f228d1a74f5be9d18ddc9367f6e967a772c0b6f9f7dd699b108cc6'
          assert json.loads((root/'version-v118-test.json').read_text())['version']=='1.18.4.5'
          assert json.loads((root/'test-adaptive/version-v118-test.json').read_text())['version']=='1.18.4.5-test'
          test=(root/'test-adaptive/index.html').read_text()
          assert 'stats-compact-hint' in test
          assert 'stats-priority-equipment' in test
          assert 'dockModalSelectors' in test and 'trulyOpen' in test
          print('PASS adaptive statistics test, formal unchanged, current baseline intact')
          PY

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
