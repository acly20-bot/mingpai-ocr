name: Publish 2026-11-21 nameplate rules (same v1.18.4.5)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-rules-20261121.yml'
      - 'scripts/release-rules-20261121.py'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore verified v1.18.4.5 stable site
        env:
          PINNED_COMMIT: 84dc4fae7acf6dc008c143ef6813f17a7b890c39
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/release-baseline/v11845-pending-confirm:refs/remotes/origin/release-baseline/v11845-pending-confirm
          test "$(git rev-parse refs/remotes/origin/release-baseline/v11845-pending-confirm)" = "$PINNED_COMMIT"
          mkdir -p app
          git archive "$PINNED_COMMIT":site-baseline | tar -xf - -C app
      - name: Apply independent eight-case rule correction to both sites
        run: python scripts/release-rules-20261121.py
      - name: Freeze updated 84-rule site baseline
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/mingpai-rules-20261121"
          git worktree add -b release-baseline/v11845-rules-20261121 "$BASE" HEAD
          mkdir -p "$BASE/site-baseline"
          cp -a app/. "$BASE/site-baseline/"
          cd "$BASE"
          git add site-baseline
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'baseline: v1.18.4.5, 84 nameplate recognition rules'
          git push origin HEAD:refs/heads/release-baseline/v11845-rules-20261121
          echo "PINNED_BASELINE_SHA=$(git rev-parse HEAD)"
          sha256sum site-baseline/index.html site-baseline/test-adaptive/index.html site-baseline/recognition-rules-v1184.json
      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: app
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
