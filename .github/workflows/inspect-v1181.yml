name: Inspect v1.18.1 runtime for safe next test update
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace sync, caching and runtime hooks
        run: |
          python - <<'PY'
          import urllib.request,re
          s=urllib.request.urlopen('https://mingpai-ocr-1387910526.cos.ap-guangzhou.myqcloud.com/assets/index-B81hyAdU-v1181-candidate.js',timeout=120).read().decode()
          print('BYTES',len(s))
          terms=['1254043','record not found','飞书同步失败','同步/重试飞书','remoteRecordId','feishuRecordId','async function F(','async function Hg(','v1174ApplyExternalRules','recognition-rules-v1181','v118RetryStatusNoRender','async function sync','function v1174RuleMatches','worker-entry','ort-wasm-simd-threaded']
          for term in terms:
            positions=[m.start() for m in re.finditer(re.escape(term),s)]
            print('\\nTERM',term,'COUNT',len(positions))
            for pos in positions[:5]:print('SNIP',pos,repr(s[max(0,pos-900):pos+1800]))
          PY
