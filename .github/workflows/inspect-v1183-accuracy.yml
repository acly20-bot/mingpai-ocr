name: Inspect v1.18.3 accuracy extension points
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-v1183-accuracy.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect released runtime and rule JSON
        run: |
          python - <<'PY'
          import re,json,urllib.request
          base='https://mingpai-ocr-1387910526.cos.ap-guangzhou.myqcloud.com/assets/'
          data=urllib.request.urlopen(base+'recognition-rules-v1181.json',timeout=120).read()
          rules=json.loads(data)
          print('RULE_MANIFEST',json.dumps({k:v for k,v in rules.items() if k!='rules'},ensure_ascii=False))
          print('RULE_SAMPLE',json.dumps(rules['rules'][:2],ensure_ascii=False))
          s=urllib.request.urlopen(base+'index-B81hyAdU-v1182-test22.js',timeout=120).read().decode()
          terms=['function v1174ApplyExternalRules(', 'async function v1174ApplyExternalRules(', 'v1174ApplyExternalRules(', 'function CI(', 'function v11713PatchCard(', 'function v151FindRecordCard(', 'function v1188CorrectNameplate(', 'function nI(', 'async function AI(', 'const recordList','id="recordList"', 'type="text"', 'class="card"', 'class="input"']
          for term in terms:
            positions=[x.start() for x in re.finditer(re.escape(term),s)]
            print('TERM',term,'COUNT',len(positions))
            for i in positions[:2]:print('SRC',repr(s[max(0,i-240):i+4400]))
          PY
