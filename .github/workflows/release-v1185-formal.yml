name: Promote verified performance v1.18.5 formal
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v1185-formal.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore user-verified test3 site
        env:
          PINNED_COMMIT: 2b845968ed8d4e43ec63e104e63af9c45e9d4f09
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/release-baseline/v1185-test3:refs/remotes/origin/release-baseline/v1185-test3
          test "$(git rev-parse refs/remotes/origin/release-baseline/v1185-test3)" = "$PINNED_COMMIT"
          mkdir -p app
          git archive "$PINNED_COMMIT":site-baseline | tar -xf - -C app
      - name: Promote only tested performance sections to formal
        run: python scripts/release-v1185-formal.py
      - name: Freeze full formal and test baselines
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/mingpai-v1185-formal"
          git worktree add -b release-baseline/v1185-formal "$BASE" HEAD
          mkdir -p "$BASE/site-baseline"
          cp -a app/. "$BASE/site-baseline/"
          cd "$BASE"
          git add site-baseline
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'stable: v1.18.5 performance and 85 rules'
          git push origin HEAD:refs/heads/release-baseline/v1185-formal
          echo "PINNED_BASELINE_SHA=$(git rev-parse HEAD)"
          sha256sum site-baseline/index.html site-baseline/test-adaptive/index.html site-baseline/recognition-rules-v1184.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
