name: Restore approved stats layout (same v1.18.4.5 version)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-stats-restore.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore frozen latest stable baseline
        env:
          PINNED_COMMIT: 0843351521afe85b62722198349cd29489586500
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/release-baseline/v11845-dock-recovery:refs/remotes/origin/release-baseline/v11845-dock-recovery
          test "$(git rev-parse refs/remotes/origin/release-baseline/v11845-dock-recovery)" = "$PINNED_COMMIT"
          mkdir -p app
          git archive "$PINNED_COMMIT":site-baseline | tar -xf - -C app

      - name: Restore screenshot's previous statistics presentation in both sites
        run: |
          python scripts/restore-stats-layout-formal-test.py

      - name: Freeze complete release baseline
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/mingpai-stats-restore-baseline"
          git worktree add -b release-baseline/v11845-stats-restored "$BASE" HEAD
          mkdir -p "$BASE/site-baseline"
          cp -a app/. "$BASE/site-baseline/"
          cd "$BASE"
          git add site-baseline
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'baseline: v1.18.4.5 restored previous stats layout in formal and test'
          git push origin HEAD:refs/heads/release-baseline/v11845-stats-restored
          echo "PINNED_BASELINE_SHA=$(git rev-parse HEAD)"
          sha256sum site-baseline/index.html site-baseline/test-adaptive/index.html site-baseline/recognition-rules-v1184.json

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
