name: Close out tested boot and hint fixes (v1.18.4.5 unchanged)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/closeout-v11845.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Restore 85-rule stable site with tested Edge recovery
        env:
          PINNED_COMMIT: 505a09ba03730c2de1d72cddbc1bcfea5b7ef1ee
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/release-baseline/v11845-rules-cpap-r9:refs/remotes/origin/release-baseline/v11845-rules-cpap-r9
          test "$(git rev-parse refs/remotes/origin/release-baseline/v11845-rules-cpap-r9)" = "$PINNED_COMMIT"
          mkdir -p app
          git archive "$PINNED_COMMIT":site-baseline | tar -xf - -C app
      - name: Close out validated startup and review reminders
        run: python scripts/closeout-v11845-boot-and-hints.py
      - name: Verify no diagnostic and all stable safeguards
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          r=Path('app')
          assert json.loads((r/'version-v118-test.json').read_text())['version']=='1.18.4.5'
          assert json.loads((r/'test-adaptive/version-v118-test.json').read_text())['version']=='1.18.4.5-test'
          assert len(json.loads((r/'recognition-rules-v1184.json').read_text())['rules'])==85
          for pre in ('','test-adaptive/'):
            s=(r/pre/'index.html').read_text()
            c=(r/pre/'core.html').read_text()
            assert 'mingpai-optin-boot-diagnosis' not in s
            assert 'pendingConfirmRefreshBound' in s
            assert 'v11845-stats-unit-label' in s
            assert 'const confirmed=/已确认/' in s
            assert 'if(resumedController?.scriptURL?.includes' in c
          assert 'scheduleHiddenDockRecovery' in (r/'index.html').read_text()
          print('PASS stable UI, same visible versions, 85 rules, no diagnostics')
          PY
      - name: Freeze complete stable site baseline
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/mingpai-boot-closeout"
          git worktree add -b release-baseline/v11845-boot-closeout "$BASE" HEAD
          mkdir -p "$BASE/site-baseline"
          cp -a app/. "$BASE/site-baseline/"
          cd "$BASE"
          git add site-baseline
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'baseline: v1.18.4.5 reviewed boot and hints, 85 rules, no diagnosis'
          git push origin HEAD:refs/heads/release-baseline/v11845-boot-closeout
          echo "PINNED_BASELINE_SHA=$(git rev-parse HEAD)"
          sha256sum site-baseline/index.html site-baseline/test-adaptive/index.html site-baseline/recognition-rules-v1184.json
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: app
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
