<script id="mingpai-open-version-check">
(()=>{
  'use strict';
  const CLIENT_VERSION="1.18.4.5-test";
  const MANIFEST='./version-v118-test.json';
  const ATTEMPT_PREFIX='mingpai-open-upgrade-';
  let checking=false;
  function read(key){try{return sessionStorage.getItem(key)}catch{return null}}
  function save(key,value){try{sessionStorage.setItem(key,value)}catch{}}
  function clear(key){try{sessionStorage.removeItem(key)}catch{}}
  function timeout(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
  async function check(){
    if(checking||navigator.onLine===false)return;
    checking=true;
    try{
      // The worker handles this endpoint network-first; no stale app shell JSON.
      const url=MANIFEST+'?check='+Date.now();
      const response=await fetch(url,{cache:'no-store'});
      if(!response.ok)return;
      const manifest=await response.json();
      const remote=String(manifest?.version||'').trim();
      if(!remote||!manifest?.mainJs)return;
      const marker=ATTEMPT_PREFIX+remote;
      // Even when the top-level HTML is current, the previous service
      // worker may have served a stale cached core.html to the iframe.
      // Compare the actual rendered footer version, not only wrapper version.
      let coreOutdated=false;
      try{
        const frame=document.getElementById('app');
        if(frame&&frame.contentDocument?.readyState!=='complete'){
          await Promise.race([
            new Promise(resolve=>frame.addEventListener('load',resolve,{once:true})),
            timeout(4500)
          ]);
        }
        const text=frame?.contentDocument?.body?.innerText||'';
        const footer=[...text.matchAll(/版本\s*[:：]\s*v?(\d+(?:\.\d+)+)/g)];
        const actual=footer.length?footer[footer.length-1][1]:'';
        if(actual&&actual!==remote.replace(/-test(?:\.\d+)*$/, ''))coreOutdated=true;
      }catch(error){console.debug('[铭牌版本] 无法读取内页版本',error)}
      if(remote===CLIENT_VERSION&&!coreOutdated){
        clear(marker);
        return;
      }
      // Avoid loops if a captive portal, WebView or SW keeps supplying stale
      // HTML. A failed attempt is eligible for a new try after 2 minutes.
      const previous=Number(read(marker)||0);
      if(previous&&Date.now()-previous<120000)return;
      save(marker,String(Date.now()));
      try{
        // Activate the freshly published SW before navigating, so its
        // network-first core.html handler never serves yesterday's shell.
        if('serviceWorker' in navigator){
          const registration=await navigator.serviceWorker.getRegistration('./');
          if(registration){
            await Promise.race([registration.update(),timeout(3500)]);
            if(registration.waiting)registration.waiting.postMessage({type:'SKIP_WAITING'});
            await Promise.race([
              new Promise(resolve=>navigator.serviceWorker.addEventListener('controllerchange',resolve,{once:true})),
              timeout(1000)
            ]);
          }
        }
      }catch(error){console.debug('[铭牌版本] Service Worker 更新暂不可用',error)}
      // Only a verified server-version mismatch can cause this reload.
      // Query parameter isolates browser HTTP cache without changing the path.
      const next=new URL(location.href);
      next.searchParams.set('mpv',remote);
      location.replace(next.href);
    }catch(error){
      // Offline, server timeouts, or invalid manifest must not interrupt OCR.
      console.debug('[铭牌版本] 本次启动保持当前版本',error);
    }finally{checking=false}
  }
  // Check without blocking first paint or local-record restoration.
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',check,{once:true});
  else check();
})();
</script>

    ? '疑似电压、频率或功率，不像出厂编号，请核对铭牌中的 SN、序列号或产品编码。'

  return '';
}

  function refreshWeather(force=false){
    installWeatherChip();

      const age=Date.now()-Number(old.savedAt||0);
      if(old.manual&&new Date(Number(old.savedAt||0)).toDateString()===new Date().toDateString()){
        setWeatherButton('manual','当前是人工填写值；当天不自动覆盖，点击↻强制获取天气');
        return;
      }
      if(age>=0&&age<WEATHER_TTL_MS){
        setWeatherButton('ready','天气缓存未过期；点击↻手动刷新');
        return;
      }
    }
    if(weatherFetching){
      if(force){weatherForcePending=true;showWeatherFeedback('天气请求进行中，完成后将再次刷新。')}
      return;
    }
    if(!navigator.onLine){
      setWeatherButton('error','网络不可用，已保留原温湿度');
      if(force||!validWeather(old))showWeatherFeedback('无法联网，已保留原温湿度。请联网后重试。',true);
      return;
    }
    weatherFetching=true;
    const requestSeq=++weatherSeq;
    setWeatherButton('loading','正在更新温湿度…');
    if(force)showWeatherFeedback('正在获取最新定位温湿度…');
    const finish=()=>{
      weatherFetching=false;
      if(weatherForcePending){weatherForcePending=false;refreshWeather(true)}
    };
    const fail=msg=>{
      console.warn('weather refresh failed',msg);
      setWeatherButton('error',msg+'；已保留原温湿度');
      if(force||!validWeather(old))showWeatherFeedback(msg+'；已保留原温湿度。',true);
      finish();
    };
    const loadForecast=async(lat,lon,isCached=false)=>{
      const controller=new AbortController();
      const timeout=setTimeout(()=>controller.abort(),12000);
      try{
        const url=`https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(lat)}&longitude=${encodeURIComponent(lon)}&current=temperature_2m,relative_humidity_2m&timezone=auto`;
        const resp=await fetchWeatherReliable(url,{cache:'no-store',signal:controller.signal});
        if(!resp.ok)throw Error('天气服务 HTTP '+resp.status);
        const js=await resp.json();
        const next={temperature:numeric(js?.current?.temperature_2m),humidity:numeric(js?.current?.relative_humidity_2m),savedAt:Date.now(),latitude:lat,longitude:lon,manual:false,dateKey:weatherDate()};
        if(!validWeather(next))throw Error('天气服务返回值无效');
        if(requestSeq!==weatherSeq){
          setWeatherButton('ready','已保留较新的手动填写值');
          if(force)showWeatherFeedback('已保留你刚手动修改的温湿度。');
          finish();
          return;
        }
        currentWeather=next;
        localStorage.setItem(WEATHER_KEY,JSON.stringify(next));
        installWeatherChip();
        decorateCards();
        const hm=new Date(next.savedAt).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
        const msg=`天气已更新 ${hm}${isCached?'（使用上次有效定位）':''}：${weatherText(next)}`;
        setWeatherButton('ready',msg);
        if(force)showWeatherFeedback(msg);
      }catch(e){fail(e?.name==='AbortError'?'天气请求超时':(e?.message||'天气请求失败'));return}
      finally{clearTimeout(timeout)}
      finish();
    };
    const cachedLat=numeric(old?.latitude),cachedLon=numeric(old?.longitude);
    const hasCachedLocation=cachedLat!==null&&cachedLon!==null&&Math.abs(cachedLat)<=90&&Math.abs(cachedLon)<=180;
    if(!navigator.geolocation){
      if(hasCachedLocation){loadForecast(cachedLat,cachedLon,true);return}
      fail('此浏览器不支持定位');return;
    }
    try{
      navigator.geolocation.getCurrentPosition(
        p=>loadForecast(p.coords.latitude,p.coords.longitude),
        e=>{
          if(hasCachedLocation){loadForecast(cachedLat,cachedLon,true);return}
          const reasons={1:'未获定位权限，请在浏览器设置中允许位置权限',2:'定位位置不可用',3:'定位超时'};
          fail(reasons[e?.code]||'无法获取定位');
        },
        {enableHighAccuracy:false,timeout:10000,maximumAge:force?0:60*60*1000}
      );
    }catch(e){
      if(hasCachedLocation){loadForecast(cachedLat,cachedLon,true);return}
      fail('定位失败：'+(e?.message||String(e)));
    }
  }

              alert('温湿度输入无效：温度应为数字，湿度应在 0～100 之间。');return;
            }

              let rec=await getRecord(id);

        const showH=draft?draft.humidity:(rec.humidity??'');

      const head=card.querySelector('.cardhead');

      if(head&&badge){
        let stack=head.querySelector('.card-status-stack');
        if(!stack){stack=d.createElement('div');stack.className='card-status-stack';badge.replaceWith(stack);stack.appendChild(badge);const sm=d.createElement('div');sm.className='sync-mini';stack.appendChild(sm);}

      if(title){

<script id="v118-upgrade-probe">

(function v1183PreviewBackInit(){
  "use strict";
  const frame=document.getElementById("app");
  if(!frame)return;
  let armed=false, observing=null, observedDoc=null, disposed=false;
  const getDoc=()=>{try{return frame.contentDocument}catch{return null}};
  const hasPreview=()=>!!getDoc()?.getElementById("v155ImagePreview");

    const d=getDoc();

  };
  const marker="__mingpaiPreviewBack1183";

      try{
        history.pushState({...history.state,[marker]:true},"",location.href);
        armed=true;

      armed=false;

      // The popstate callback sees armed=false and cannot close any new modal.

<script id="v11841-modal-back">

    if(style.display==='none'||style.visibility==='hidden'||Number(style.opacity||1)===0)return false;
